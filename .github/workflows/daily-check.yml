name: "Daily NRW Update"

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC daily
  workflow_dispatch:  # Manual trigger for testing

concurrency:
  group: nrw-automation
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
      MIN_PROVIDER_COVERAGE: ${{ secrets.MIN_PROVIDER_COVERAGE }}
      # Playwright configuration
      NRW_USE_SHARED_PLAYWRIGHT: 'true'  # Use shared PlaywrightManager (now default behavior)
      # Draft generation configuration
      NRW_DRAFTS_ENABLED: 'true'  # Enable draft generation

    steps:
      - name: Branch guard
        run: |
          EXPECTED_BRANCH="${OVERRIDE_EXPECTED_BRANCH:-main}"
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ "$CURRENT_BRANCH" != "$EXPECTED_BRANCH" ]]; then
            echo "❌ Workflow running on unexpected branch: $CURRENT_BRANCH"
            echo "Expected: $EXPECTED_BRANCH"
            echo "Set OVERRIDE_EXPECTED_BRANCH env var to override this check"
            exit 1
          fi
          echo "✅ Branch guard passed: running on $CURRENT_BRANCH"

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python3 -m playwright install --with-deps chromium

      - name: Run optional validation tests
        if: env.NRW_RUN_OPTIONAL_TESTS == 'true'
        run: |
          echo "🧪 Running optional contract and newsletter validation tests..."
          python3 -m pytest tests/test_discovery_contract.py -v
          python3 -m pytest tests/test_newsletter_mapping.py -v
        continue-on-error: true

      - name: Configure Git
        run: |
          git config user.name "NRW Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"


      - name: Run daily pipeline
        run: python3 daily_orchestrator.py | tee .local_run.log

      - name: Extract discovery metrics
        if: always()
        run: |
          if [ -f ".local_run.log" ]; then
            echo "📊 Discovery Metrics:"
            echo "===================="

            # Extract standardized discovery metrics line
            discovery_line=$(grep -E "^Polled [0-9]+ movies, [0-9]+ changes detected" .local_run.log | tail -n 1 || echo "")

            if [ -n "$discovery_line" ]; then
              # Parse the line to extract numbers
              polled=$(echo "$discovery_line" | grep -oE "Polled [0-9]+" | grep -oE "[0-9]+")
              transitions=$(echo "$discovery_line" | grep -oE ", [0-9]+ changes detected" | grep -oE "[0-9]+")

              echo "Polled Movies: $polled"
              echo "Changes Detected: $transitions"

              # Add to GitHub step summary
              {
                echo "## 🔍 Discovery Metrics"
                echo ""
                echo "| Metric | Count |"
                echo "|--------|-------|"
                echo "| 🎬 Polled Movies | $polled |"
                echo "| ⚡ Changes Detected | $transitions |"
                echo ""
              } >> $GITHUB_STEP_SUMMARY

              # Export to GitHub environment for later steps
              echo "DISCOVERY_POLLED=$polled" >> $GITHUB_ENV
              echo "DISCOVERY_TRANSITIONS=$transitions" >> $GITHUB_ENV
            else
              echo "⚠️ No standardized discovery metrics found in log"
              echo "DISCOVERY_POLLED=0" >> $GITHUB_ENV
              echo "DISCOVERY_TRANSITIONS=0" >> $GITHUB_ENV
            fi
          else
            echo "⚠️ No log file found (.local_run.log)"
            echo "DISCOVERY_POLLED=0" >> $GITHUB_ENV
            echo "DISCOVERY_TRANSITIONS=0" >> $GITHUB_ENV
          fi

      - name: Check for 3-day discovery stall
        if: always()
        run: |
          if [ -f "metrics/daily.jsonl" ]; then
            echo "📊 Checking for discovery stalls (3-day unique-date window)..."

            # Group entries by date, take the most recent entry per date, then take last 3 unique dates
            unique_dates_data=$(jq -s 'group_by(.date) | map(sort_by(.timestamp // .date) | last) | sort_by(.date) | .[-3:]' metrics/daily.jsonl)

            # Count zero-transition days from the 3 unique dates (handle legacy entries)
            zero_count=$(echo "$unique_dates_data" | jq '[.[] | select(.transitions == 0 or (.transitions == null and .newly_digital == 0))] | length')
            total_count=$(echo "$unique_dates_data" | jq 'length')

            echo "Last $total_count unique days: $zero_count days with 0 transitions"

            if [ "$total_count" -ge 3 ] && [ "$zero_count" -eq 3 ]; then
              echo "🚨 DISCOVERY STALL DETECTED: 0 transitions for 3 consecutive unique days"
              echo "DISCOVERY_STALLED=true" >> $GITHUB_ENV

              # Get date range for the stall from unique dates
              first_date=$(echo "$unique_dates_data" | jq -r '.[0].date')
              last_date=$(echo "$unique_dates_data" | jq -r '.[-1].date')
              echo "STALL_START_DATE=$first_date" >> $GITHUB_ENV
              echo "STALL_END_DATE=$last_date" >> $GITHUB_ENV

              # Check if we should fail the workflow
              if [ "${NRW_FAIL_ON_STALL:-false}" = "true" ]; then
                echo "💥 NRW_FAIL_ON_STALL=true - marking job as failed"
                exit 1
              fi
            else
              echo "✅ No discovery stall detected"
              echo "DISCOVERY_STALLED=false" >> $GITHUB_ENV
            fi
          else
            echo "⚠️ No metrics file found - cannot check for stalls"
            echo "DISCOVERY_STALLED=false" >> $GITHUB_ENV
          fi

      - name: Verify new arrivals in data.json
        if: always()
        run: |
          if [ -f "data.json" ]; then
            today=$(date -u +%Y-%m-%d)

            # Count new arrivals for today (adjust field name if needed)
            new_arrivals=$(jq -r --arg d "$today" '[.movies[] | select(.digital_date == $d)] | length' data.json 2>/dev/null || echo "0")

            echo "📊 New Arrivals Verification:"
            echo "============================"
            echo "Date: $today"
            echo "New Arrivals: $new_arrivals"

            # Add to GitHub step summary
            {
              echo "## 📅 New Arrivals"
              echo ""
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| 📅 Date | $today |"
              echo "| 🆕 New Arrivals | $new_arrivals |"
              echo ""
            } >> $GITHUB_STEP_SUMMARY

            # Export for commit message
            echo "NEW_ARRIVALS=$new_arrivals" >> $GITHUB_ENV
          else
            echo "⚠️ data.json not found - cannot verify new arrivals"
            echo "NEW_ARRIVALS=0" >> $GITHUB_ENV
          fi

      - name: Extract per-phase timing summary
        if: always()
        run: |
          if [ -f ".local_run.log" ]; then
            echo "📊 Per-Phase Performance Summary:"
            echo "================================"
            # Extract phase timing lines from the log
            grep -E "⏱️.*Phase Timings:|✅.*:.*s$|❌.*:.*s$" .local_run.log || echo "No phase timing data found"
            echo ""
            # Extract total duration
            grep -E "⏱️.*Total Duration:" .local_run.log || echo "No total duration found"
          else
            echo "⚠️ No log file found (.local_run.log)"
          fi

      - name: Check for Google search URLs in data.json
        run: |
          if [ -f "data.json" ]; then
            search_urls=$(jq -r '.movies[] | select(.watch_links != null) | .watch_links[] | select(.link != null) | .link' data.json 2>/dev/null | grep -c 'google.com/search' || echo "0")
            if [ "$search_urls" -gt 0 ]; then
              echo "ERROR: Found $search_urls Google search URLs in data.json"
              if [ "${NRW_FAIL_ON_SEARCH_URLS:-false}" = "true" ]; then
                echo "Failing workflow due to NRW_FAIL_ON_SEARCH_URLS=true"
                exit 1
              else
                echo "WARNING: Google search URLs detected but not failing (set NRW_FAIL_ON_SEARCH_URLS=true to fail)"
              fi
            else
              echo "✓ No Google search URLs found in data.json"
            fi
          else
            echo "WARNING: data.json not found, skipping search URL check"
          fi

      - name: Check for drafts
        id: drafts
        run: |
          if [ -d "admin/drafts" ] && [ "$(ls -A admin/drafts)" ]; then
            draft_count=$(ls admin/drafts/*.json 2>/dev/null | wc -l || echo "0")
            echo "📝 Generated $draft_count draft(s) for admin review"
            echo "draft_count=$draft_count" >> $GITHUB_OUTPUT
            echo "has_drafts=true" >> $GITHUB_OUTPUT

            # List draft files for summary
            for draft in admin/drafts/*.json; do
              if [ -f "$draft" ]; then
                draft_id=$(basename "$draft" .json)
                echo "  - Draft: $draft_id"
              fi
            done
          else
            echo "📭 No drafts generated"
            echo "draft_count=0" >> $GITHUB_OUTPUT
            echo "has_drafts=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract draft summary
        if: always()
        run: |
          echo "📊 Draft Generation Summary:"
          echo "==========================="

          draft_count=${{ steps.drafts.outputs.draft_count }}

          # Output to both console and GitHub summary
          {
            echo "## 📝 Draft Generation Summary"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| 📝 Drafts Generated | $draft_count |"
            echo "| 🔍 Polled Movies | ${DISCOVERY_POLLED:-0} |"
            echo "| ⚡ Changes Detected | ${DISCOVERY_TRANSITIONS:-0} |"
            echo ""
            if [ "$draft_count" -gt 0 ]; then
              echo "### ✅ Next Steps:"
              echo "1. Admin should review drafts in the admin panel"
              echo "2. Edit titles if needed"
              echo "3. Publish approved drafts to production"
            else
              echo "### ℹ️ Status:"
              echo "No new drafts generated - no recent movie updates found"
            fi
            echo ""
          } | tee -a $GITHUB_STEP_SUMMARY

      - name: Handle pipeline failure
        if: failure()
        run: |
          echo "🔍 Discovery pipeline failed - checking for issues..."
          echo "WORKFLOW_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          echo "FAILURE_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV


      - name: Create discovery stall issue
        if: always() && env.DISCOVERY_STALLED == 'true' && env.NRW_NOTIFICATIONS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const startDate = process.env.STALL_START_DATE || 'unknown';
            const endDate = process.env.STALL_END_DATE || 'unknown';
            const polled = process.env.DISCOVERY_POLLED || '0';

            const title = 'Discovery Stalled: 0 transitions for 3 days';

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## 🚨 Discovery System Stalled

            **Alert:** Discovery system has detected 0 transitions for 3 consecutive days.

            **Stall Period:** ${startDate} to ${endDate}
            **Last Run Polled:** ${polled} movies
            **Workflow Run:** ${workflowUrl}
            **Detection Time:** ${new Date().toISOString()}

            ### 🔍 Diagnostic Information:
            - **Total Days Checked:** 3
            - **Days with 0 Transitions:** 3
            - **Last Polled Count:** ${polled}

            ### 🛠️ Investigation Steps:
            1. **Check Discovery System:**
               - Verify TMDB API key is valid and not rate-limited
               - Check \`generate_data.py --discover\` output for errors
               - Review discovery configuration in \`config.yaml\`

            2. **Check Provider Monitoring:**
               - Verify \`generate_data.py --check\` is polling tracking movies
               - Check for API quota exhaustion (Watchmode, etc.)
               - Review provider scraper health

            3. **Data Validation:**
               - Ensure \`movie_tracking.json\` has movies in 'tracking' status
               - Verify discovery date range is appropriate
               - Check for upstream data source issues

            ### 📊 Expected Behavior:
            - Average >1 transition per week under normal conditions
            - Discovery should find new premieres regularly
            - Provider monitoring should detect status changes

            ### 🔧 Manual Recovery:
            \`\`\`bash
            # Test discovery manually
            python3 generate_data.py --discover --debug

            # Test provider monitoring
            python3 generate_data.py --check

            # Check metrics history
            tail -20 metrics/daily.jsonl
            \`\`\`

            This issue was created automatically by the discovery health monitoring system.`,
              labels: ['automation', 'discovery-stall', 'critical']
            });

            console.log(\`Created discovery stall issue #\${issue.data.number}: \${title}\`);

      - name: Check for changes
        id: changes
        if: always()
        run: |
          if ! git diff --quiet --exit-code -- admin/drafts/ metrics/daily.jsonl; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in repository"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Preserve drafts
        if: always()
        run: |
          echo "📝 Preserving generated drafts..."
          # Ensure drafts directory exists and is preserved
          mkdir -p admin/drafts
          echo "✅ Drafts preserved"

      - name: Archive metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-metrics-${{ github.run_id }}
          path: |
            metrics/discovery_run.json
            metrics/*.jsonl
            .local_run.log
          retention-days: 30

      - name: Commit drafts and metrics
        if: always() && steps.changes.outputs.changes == 'true'
        run: |
          # Build commit message with discovery summary
          draft_count=${{ steps.drafts.outputs.draft_count }}
          if [ "$draft_count" -gt 0 ]; then
            commit_msg="Daily discovery - $(date +%Y-%m-%d) [drafts]"
          else
            commit_msg="Daily discovery - $(date +%Y-%m-%d) [metrics]"
          fi

          # Add discovery metrics if we have them
          if [ "${DISCOVERY_POLLED:-0}" != "0" ] || [ "${DISCOVERY_TRANSITIONS:-0}" != "0" ]; then
            commit_msg="$commit_msg"$'\n\n'"Discovery: polled=${DISCOVERY_POLLED:-0}, transitions=${DISCOVERY_TRANSITIONS:-0}"
          fi

          # Add draft count
          if [ "$draft_count" -gt 0 ]; then
            commit_msg="$commit_msg, drafts=${draft_count}"
          fi

          # Stage generated files (but not data.json - that's published by admin)
          # TODO: When auto-publish is re-enabled, add data.json here: git add admin/drafts/ metrics/daily.jsonl data.json
          git add admin/drafts/ metrics/daily.jsonl

          # Only commit if there are staged changes and set flag accordingly
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "COMMIT_MADE=false" >> $GITHUB_ENV
          else
            if git commit -m "$commit_msg"; then
              echo "COMMIT_MADE=true" >> $GITHUB_ENV
            else
              echo "Commit failed"
              echo "COMMIT_MADE=false" >> $GITHUB_ENV
            fi
          fi

      - name: Push changes to main
        if: always() && env.COMMIT_MADE == 'true'
        run: git push origin main

      - name: Create draft notification
        if: success() && steps.drafts.outputs.has_drafts == 'true' && env.NRW_NOTIFICATIONS == 'true'
        uses: actions/github-script@v7
        env:
          DRAFT_COUNT: ${{ steps.drafts.outputs.draft_count }}
        with:
          script: |
            const workflowUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const draftCount = process.env.DRAFT_COUNT || '0';
            const polled = process.env.DISCOVERY_POLLED || '0';
            const transitions = process.env.DISCOVERY_TRANSITIONS || '0';

            const title = `Drafts Generated - ${new Date().toLocaleDateString()}`;

            // Create a notification issue for admin review
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## 📝 New Drafts Ready for Review

            **Discovery Run:** ${new Date().toISOString()}
            **Workflow Run:** ${workflowUrl}

            ### 📊 Discovery Summary:
            - **Movies Polled:** ${polled}
            - **Changes Detected:** ${transitions}
            - **Drafts Generated:** ${draftCount}

            ### 📝 Next Steps:
            1. **Admin Review Required:** Open the admin panel to review drafts
            2. **Edit Titles:** Modify titles if needed before publishing
            3. **Publish:** Click 'Publish' for approved drafts

            ### 🔗 Admin Panel:
            Access the admin panel to review and publish these drafts.

            **Status:** Drafts are ready for admin review and publishing.

            ---
            *This notification was created automatically by the daily discovery workflow.*`,
              labels: ['automation', 'drafts-ready', 'admin-action-required']
            });

            console.log(`Created draft notification issue #${issue.data.number}: ${title}`);

            // Also add to step summary
            const summaryMarkdown = `
            ## 📝 Drafts Generated Successfully

            **Draft Count:** ${draftCount}
            **Discovery:** polled=${polled}, transitions=${transitions}

            📝 **Notification:** Issue #${issue.data.number}
            🔗 **Workflow:** [View Run](${workflowUrl})

            **⚠️ Admin action required to publish drafts**
            `;

            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryMarkdown);

      - name: Get pipeline status for failure report
        if: failure()
        id: pipeline-status
        run: |
          echo "pipeline_status=Discovery pipeline failed" >> $GITHUB_OUTPUT
          echo "failure_time=${FAILURE_TIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" >> $GITHUB_OUTPUT

      - name: Create GitHub issue on failure
        if: failure() && env.NRW_NOTIFICATIONS == 'true'
        uses: actions/github-script@v7
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PIPELINE_STATUS: ${{ steps.pipeline-status.outputs.pipeline_status }}
          FAILURE_TIME: ${{ steps.pipeline-status.outputs.failure_time }}
        with:
          script: |
            const pipelineStatus = process.env.PIPELINE_STATUS || 'Unknown';
            const failureTime = process.env.FAILURE_TIME || new Date().toISOString();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Discovery Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Daily Discovery Pipeline Failure

            **Workflow Run:** ${process.env.WORKFLOW_URL}
            **Failure Time:** ${failureTime}
            **Branch:** ${context.ref}
            **Pipeline Status:** ${pipelineStatus}

            ### Debugging Steps:
            1. Check the workflow logs at the URL above
            2. Review \`daily_orchestrator.py\` output for specific errors
            3. Verify API keys are properly configured in repository secrets
            4. Check data quality validation errors
            5. Review discovery system health

            ### Manual Recovery:
            If needed, run the daily pipeline manually:
            \`\`\`bash
            python3 daily_orchestrator.py
            \`\`\`

            ### Impact:
            - No drafts were generated
            - Admin panel will not have new content to review
            - Site content remains unchanged

            This issue was created automatically by the failed discovery workflow.`,
              labels: ['automation', 'discovery-failure', 'bug']
            })
