name: "Daily NRW Update"

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC daily
  workflow_dispatch:  # Manual trigger for testing
    inputs:
      test_mode:
        description: 'Enable test mode to simulate approval failures'
        required: false
        default: false
        type: boolean

concurrency:
  group: nrw-automation
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
      MIN_PROVIDER_COVERAGE: ${{ secrets.MIN_PROVIDER_COVERAGE }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium

      - name: Configure Git
        run: |
          git config user.name "NRW Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"


      - name: Run daily pipeline
        run: python3 daily_orchestrator.py | tee .local_run.log

      - name: Extract discovery metrics
        if: always()
        run: |
          if [ -f ".local_run.log" ]; then
            echo "📊 Discovery Metrics:"
            echo "===================="

            # Extract standardized discovery metrics line
            discovery_line=$(grep -E "^Polled [0-9]+ movies, [0-9]+ changes detected" .local_run.log | tail -n 1 || echo "")

            if [ -n "$discovery_line" ]; then
              # Parse the line to extract numbers
              polled=$(echo "$discovery_line" | grep -oE "Polled [0-9]+" | grep -oE "[0-9]+")
              transitions=$(echo "$discovery_line" | grep -oE ", [0-9]+ changes detected" | grep -oE "[0-9]+")

              echo "Polled Movies: $polled"
              echo "Changes Detected: $transitions"

              # Add to GitHub step summary
              {
                echo "## 🔍 Discovery Metrics"
                echo ""
                echo "| Metric | Count |"
                echo "|--------|-------|"
                echo "| 🎬 Polled Movies | $polled |"
                echo "| ⚡ Changes Detected | $transitions |"
                echo ""
              } >> $GITHUB_STEP_SUMMARY

              # Export to GitHub environment for later steps
              echo "DISCOVERY_POLLED=$polled" >> $GITHUB_ENV
              echo "DISCOVERY_TRANSITIONS=$transitions" >> $GITHUB_ENV
            else
              echo "⚠️ No standardized discovery metrics found in log"
              echo "DISCOVERY_POLLED=0" >> $GITHUB_ENV
              echo "DISCOVERY_TRANSITIONS=0" >> $GITHUB_ENV
            fi
          else
            echo "⚠️ No log file found (.local_run.log)"
            echo "DISCOVERY_POLLED=0" >> $GITHUB_ENV
            echo "DISCOVERY_TRANSITIONS=0" >> $GITHUB_ENV
          fi

      - name: Check for 14-day discovery stall
        if: always()
        run: |
          if [ -f "metrics/daily.jsonl" ]; then
            echo "📊 Checking for discovery stalls (14-day unique-date window)..."

            # Group entries by date, take the most recent entry per date, then take last 14 unique dates
            unique_dates_data=$(jq -s 'group_by(.date) | map(sort_by(.timestamp // .date) | last) | sort_by(.date) | .[-14:]' metrics/daily.jsonl)

            # Count zero-transition days from the 14 unique dates (handle legacy entries)
            zero_count=$(echo "$unique_dates_data" | jq '[.[] | select(.transitions == 0 or (.transitions == null and .newly_digital == 0))] | length')
            total_count=$(echo "$unique_dates_data" | jq 'length')

            echo "Last $total_count unique days: $zero_count days with 0 transitions"

            if [ "$total_count" -ge 14 ] && [ "$zero_count" -eq 14 ]; then
              echo "🚨 DISCOVERY STALL DETECTED: 0 transitions for 14 consecutive unique days"
              echo "DISCOVERY_STALLED=true" >> $GITHUB_ENV

              # Get date range for the stall from unique dates
              first_date=$(echo "$unique_dates_data" | jq -r '.[0].date')
              last_date=$(echo "$unique_dates_data" | jq -r '.[-1].date')
              echo "STALL_START_DATE=$first_date" >> $GITHUB_ENV
              echo "STALL_END_DATE=$last_date" >> $GITHUB_ENV
            else
              echo "✅ No discovery stall detected"
              echo "DISCOVERY_STALLED=false" >> $GITHUB_ENV
            fi
          else
            echo "⚠️ No metrics file found - cannot check for stalls"
            echo "DISCOVERY_STALLED=false" >> $GITHUB_ENV
          fi

      - name: Verify new arrivals in data.json
        if: always()
        run: |
          if [ -f "data.json" ]; then
            today=$(date -u +%Y-%m-%d)

            # Count new arrivals for today (adjust field name if needed)
            new_arrivals=$(jq -r --arg d "$today" '[.movies[] | select(.digital_date == $d)] | length' data.json 2>/dev/null || echo "0")

            echo "📊 New Arrivals Verification:"
            echo "============================"
            echo "Date: $today"
            echo "New Arrivals: $new_arrivals"

            # Add to GitHub step summary
            {
              echo "## 📅 New Arrivals"
              echo ""
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| 📅 Date | $today |"
              echo "| 🆕 New Arrivals | $new_arrivals |"
              echo ""
            } >> $GITHUB_STEP_SUMMARY

            # Export for commit message
            echo "NEW_ARRIVALS=$new_arrivals" >> $GITHUB_ENV
          else
            echo "⚠️ data.json not found - cannot verify new arrivals"
            echo "NEW_ARRIVALS=0" >> $GITHUB_ENV
          fi

      - name: Extract per-phase timing summary
        if: always()
        run: |
          if [ -f ".local_run.log" ]; then
            echo "📊 Per-Phase Performance Summary:"
            echo "================================"
            # Extract phase timing lines from the log
            grep -E "⏱️.*Phase Timings:|✅.*:.*s$|❌.*:.*s$" .local_run.log || echo "No phase timing data found"
            echo ""
            # Extract total duration
            grep -E "⏱️.*Total Duration:" .local_run.log || echo "No total duration found"
          else
            echo "⚠️ No log file found (.local_run.log)"
          fi

      - name: Check for Google search URLs in data.json
        run: |
          if [ -f "data.json" ]; then
            search_urls=$(jq -r '.movies[] | select(.watch_links != null) | .watch_links[] | select(.link != null) | .link' data.json 2>/dev/null | grep -c 'google.com/search' || echo "0")
            if [ "$search_urls" -gt 0 ]; then
              echo "ERROR: Found $search_urls Google search URLs in data.json"
              if [ "${NRW_FAIL_ON_SEARCH_URLS:-false}" = "true" ]; then
                echo "Failing workflow due to NRW_FAIL_ON_SEARCH_URLS=true"
                exit 1
              else
                echo "WARNING: Google search URLs detected but not failing (set NRW_FAIL_ON_SEARCH_URLS=true to fail)"
              fi
            else
              echo "✓ No Google search URLs found in data.json"
            fi
          else
            echo "WARNING: data.json not found, skipping search URL check"
          fi

      - name: Simulate approval failure (test mode)
        if: github.event.inputs.test_mode == 'true'
        run: |
          echo "🧪 Test mode enabled - simulating approval failure"
          if [ -f "admin/approval.json" ]; then
            # Make approval stale by modifying timestamp
            jq '.timestamp = "2020-01-01T00:00:00Z"' admin/approval.json > admin/approval_test.json
            mv admin/approval_test.json admin/approval.json
            echo "Modified approval timestamp to simulate stale approval"
          else
            echo "No approval file to modify - will test missing approval scenario"
          fi

      - name: Validate approval freshness
        run: |
          if [ -f "admin/approval.json" ]; then
            echo "📋 Approval status:"
            reviewer=$(jq -r '.reviewer // "unknown"' admin/approval.json)
            timestamp=$(jq -r '.timestamp // "unknown"' admin/approval.json)
            echo "  Reviewer: $reviewer"
            echo "  Timestamp: $timestamp"

            # Validate timestamp is within 2 hours
            if [ "$timestamp" != "unknown" ] && [ "$timestamp" != "null" ]; then
              # Convert timestamp to epoch seconds (handle both Z and +00:00 formats)
              approval_epoch=$(date -d "${timestamp/Z/+00:00}" +%s 2>/dev/null || echo "0")
              current_epoch=$(date +%s)
              age_seconds=$((current_epoch - approval_epoch))
              age_hours=$((age_seconds / 3600))

              echo "  Age: ${age_hours} hours (${age_seconds}s)"

              if [ $age_seconds -gt 7200 ]; then
                echo "❌ ERROR: Approval is stale (older than 2 hours)"
                exit 1
              else
                echo "✅ Approval is fresh (within 2 hours)"
              fi
            else
              echo "❌ ERROR: Invalid or missing timestamp in approval"
              exit 1
            fi

            # Optionally check digest if present
            if jq -e '.digest' admin/approval.json > /dev/null 2>&1; then
              digest=$(jq -r '.digest' admin/approval.json)
              echo "  Digest: $digest"
            fi
          else
            echo "❌ ERROR: admin/approval.json not found - approval required"
            exit 1
          fi

      - name: Extract curation diagnostics
        if: always()
        run: |
          if [ -f "admin/approval.json" ]; then
            echo "📊 Curation Diagnostics:"
            echo "======================="

            # Extract curation metrics
            edits=$(jq -r '.edits // 0' admin/approval.json 2>/dev/null || echo "0")
            additions=$(jq -r '.additions // 0' admin/approval.json 2>/dev/null || echo "0")
            hidden=$(jq -r '.hidden // 0' admin/approval.json 2>/dev/null || echo "0")
            featured=$(jq -r '.featured // 0' admin/approval.json 2>/dev/null || echo "0")
            ordered=$(jq -r '.ordered // 0' admin/approval.json 2>/dev/null || echo "0")
            movies_reviewed=$(jq -r '.movies_reviewed // 0' admin/approval.json 2>/dev/null || echo "0")

            # Output to both console and GitHub summary
            {
              echo "## 📊 Curation Summary"
              echo ""
              echo "| Metric | Count |"
              echo "|--------|-------|"
              echo "| ✏️ Edits | $edits |"
              echo "| ➕ Additions | $additions |"
              echo "| 🚫 Hidden | $hidden |"
              echo "| ⭐ Featured | $featured |"
              echo "| 📋 Ordered | $ordered |"
              echo "| 📝 Reviews | $movies_reviewed |"
              echo ""
            } | tee -a $GITHUB_STEP_SUMMARY

            # Store metrics for commit message
            echo "CURATION_EDITS=$edits" >> $GITHUB_ENV
            echo "CURATION_ADDITIONS=$additions" >> $GITHUB_ENV
            echo "CURATION_HIDDEN=$hidden" >> $GITHUB_ENV
            echo "CURATION_FEATURED=$featured" >> $GITHUB_ENV
            echo "CURATION_ORDERED=$ordered" >> $GITHUB_ENV
            echo "CURATION_REVIEWS=$movies_reviewed" >> $GITHUB_ENV

            echo "✅ Curation metrics extracted"
          else
            echo "⚠️ No approval file found - curation diagnostics unavailable"
            # Set zero defaults
            echo "CURATION_EDITS=0" >> $GITHUB_ENV
            echo "CURATION_ADDITIONS=0" >> $GITHUB_ENV
            echo "CURATION_HIDDEN=0" >> $GITHUB_ENV
            echo "CURATION_FEATURED=0" >> $GITHUB_ENV
            echo "CURATION_ORDERED=0" >> $GITHUB_ENV
            echo "CURATION_REVIEWS=0" >> $GITHUB_ENV
          fi

      - name: Handle approval failure with rollback
        if: failure()
        run: |
          echo "🔍 Checking if failure was due to approval issues..."

          # Check if approval file exists and get its status
          if [ -f "admin/approval.json" ]; then
            reviewer=$(jq -r '.reviewer // "unknown"' admin/approval.json 2>/dev/null || echo "unknown")
            timestamp=$(jq -r '.timestamp // "unknown"' admin/approval.json 2>/dev/null || echo "unknown")

            # Check if approval is stale
            if [ "$timestamp" != "unknown" ] && [ "$timestamp" != "null" ]; then
              approval_epoch=$(date -d "${timestamp/Z/+00:00}" +%s 2>/dev/null || echo "0")
              current_epoch=$(date +%s)
              age_seconds=$((current_epoch - approval_epoch))
              age_hours=$((age_seconds / 3600))

              if [ $age_seconds -gt 7200 ]; then
                echo "🔄 Detected stale approval - performing rollback"
                echo "APPROVAL_FAILURE_TYPE=stale" >> $GITHUB_ENV
                echo "APPROVAL_AGE_HOURS=$age_hours" >> $GITHUB_ENV
                echo "APPROVAL_REVIEWER=$reviewer" >> $GITHUB_ENV
                echo "APPROVAL_TIMESTAMP=$timestamp" >> $GITHUB_ENV
              else
                echo "Approval is fresh, failure due to other reasons"
                exit 0
              fi
            else
              echo "🔄 Detected invalid approval timestamp - performing rollback"
              echo "APPROVAL_FAILURE_TYPE=invalid_timestamp" >> $GITHUB_ENV
              echo "APPROVAL_REVIEWER=$reviewer" >> $GITHUB_ENV
            fi
          else
            echo "🔄 Detected missing approval - performing rollback"
            echo "APPROVAL_FAILURE_TYPE=missing" >> $GITHUB_ENV
          fi

          # Perform rollback
          echo "Attempting to restore data.json from previous commit..."
          if git show HEAD~1:data.json > /dev/null 2>&1; then
            git checkout HEAD~1 -- data.json
            echo "✅ Successfully restored data.json from previous commit"
          elif [ -f "backups/data.json" ]; then
            cp backups/data.json data.json
            echo "✅ Successfully restored data.json from backup"
          else
            echo "⚠️ No previous commit or backup found for data.json"
          fi

          # Set workflow URL for issue creation
          echo "WORKFLOW_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

      - name: Create approval failure issue
        if: failure() && env.APPROVAL_FAILURE_TYPE
        uses: actions/github-script@v7
        with:
          script: |
            const failureType = process.env.APPROVAL_FAILURE_TYPE;
            const workflowUrl = process.env.WORKFLOW_URL;
            const reviewer = process.env.APPROVAL_REVIEWER || 'unknown';
            const timestamp = process.env.APPROVAL_TIMESTAMP || 'unknown';
            const ageHours = process.env.APPROVAL_AGE_HOURS || 'unknown';

            let title, bodyDetails;

            if (failureType === 'missing') {
              title = 'Daily Update Blocked: Missing Admin Approval';
              bodyDetails = `**Issue:** No admin/approval.json file found
            **Action Taken:** Attempted rollback of data.json`;
            } else if (failureType === 'stale') {
              title = 'Daily Update Blocked: Stale Admin Approval';
              bodyDetails = `**Issue:** Admin approval is stale (${ageHours} hours old)
            **Reviewer:** ${reviewer}
            **Approval Timestamp:** ${timestamp}
            **Action Taken:** Attempted rollback of data.json`;
            } else if (failureType === 'invalid_timestamp') {
              title = 'Daily Update Blocked: Invalid Approval Timestamp';
              bodyDetails = `**Issue:** Admin approval has invalid or missing timestamp
            **Reviewer:** ${reviewer}
            **Action Taken:** Attempted rollback of data.json`;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## Daily Update Blocked - Approval Required

            ${bodyDetails}

            **Workflow Run:** ${workflowUrl}
            **Failure Time:** ${new Date().toISOString()}
            **Branch:** ${context.ref}

            ### Required Actions:
            1. **Admin must provide fresh approval** (within 2 hours)
            2. Create or update \`admin/approval.json\` with valid timestamp
            3. Re-run the workflow manually or wait for next scheduled run

            ### Approval File Format:
            \`\`\`json
            {
              "reviewer": "admin-username",
              "timestamp": "${new Date().toISOString()}",
              "approved": true
            }
            \`\`\`

            ### Manual Recovery:
            If rollback failed, you may need to manually restore data.json:
            \`\`\`bash
            git checkout HEAD~1 -- data.json
            # OR restore from backup if available
            cp backups/data.json data.json
            \`\`\`

            This issue was created automatically due to approval validation failure.`,
              labels: ['automation', 'approval-required', 'blocked']
            });

            console.log(\`Created issue #\${issue.data.number}: \${title}\`);

      - name: Create discovery stall issue
        if: always() && env.DISCOVERY_STALLED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const startDate = process.env.STALL_START_DATE || 'unknown';
            const endDate = process.env.STALL_END_DATE || 'unknown';
            const polled = process.env.DISCOVERY_POLLED || '0';

            const title = 'Discovery Stalled: 0 transitions for 14 days';

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## 🚨 Discovery System Stalled

            **Alert:** Discovery system has detected 0 transitions for 14 consecutive days.

            **Stall Period:** ${startDate} to ${endDate}
            **Last Run Polled:** ${polled} movies
            **Workflow Run:** ${workflowUrl}
            **Detection Time:** ${new Date().toISOString()}

            ### 🔍 Diagnostic Information:
            - **Total Days Checked:** 14
            - **Days with 0 Transitions:** 14
            - **Last Polled Count:** ${polled}

            ### 🛠️ Investigation Steps:
            1. **Check Discovery System:**
               - Verify TMDB API key is valid and not rate-limited
               - Check \`generate_data.py --discover\` output for errors
               - Review discovery configuration in \`config.yaml\`

            2. **Check Provider Monitoring:**
               - Verify \`generate_data.py --check\` is polling tracking movies
               - Check for API quota exhaustion (Watchmode, etc.)
               - Review provider scraper health

            3. **Data Validation:**
               - Ensure \`movie_tracking.json\` has movies in 'tracking' status
               - Verify discovery date range is appropriate
               - Check for upstream data source issues

            ### 📊 Expected Behavior:
            - Average >1 transition per week under normal conditions
            - Discovery should find new premieres regularly
            - Provider monitoring should detect status changes

            ### 🔧 Manual Recovery:
            \`\`\`bash
            # Test discovery manually
            python3 generate_data.py --discover --debug

            # Test provider monitoring
            python3 generate_data.py --check

            # Check metrics history
            tail -20 metrics/daily.jsonl
            \`\`\`

            This issue was created automatically by the discovery health monitoring system.`,
              labels: ['automation', 'discovery-stall', 'critical']
            });

            console.log(\`Created discovery stall issue #\${issue.data.number}: \${title}\`);

      - name: Check for changes
        id: changes
        if: always()
        run: |
          if ! git diff --quiet --exit-code -- data.json metrics/daily.jsonl; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in repository"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Capture approval context before cleanup
        if: always()
        run: |
          if [ -f "admin/approval.json" ]; then
            echo "📋 Capturing approval context before cleanup..."
            reviewer=$(jq -r '.reviewer // "unknown"' admin/approval.json 2>/dev/null || echo "unknown")
            timestamp=$(jq -r '.timestamp // "unknown"' admin/approval.json 2>/dev/null || echo "unknown")
            echo "APPROVAL_REVIEWER=$reviewer" >> $GITHUB_ENV
            echo "APPROVAL_TIMESTAMP=$timestamp" >> $GITHUB_ENV
            echo "✅ Approval context captured: reviewer=$reviewer, timestamp=$timestamp"
          else
            echo "⚠️ No approval file found - setting defaults"
            echo "APPROVAL_REVIEWER=system" >> $GITHUB_ENV
            echo "APPROVAL_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          fi

      - name: Clean up admin artifacts
        if: always()
        run: |
          echo "🧹 Cleaning up ephemeral admin artifacts..."
          # Remove approval artifacts after processing (per ephemeral policy)
          rm -f admin/approval.json
          rm -f admin/ordering.json
          rm -f admin/hidden_movies.json
          rm -f admin/featured_movies.json
          rm -f admin/watch_link_overrides.json
          rm -f admin/movie_reviews.json
          rm -f diary/*.md 2>/dev/null || true
          echo "✅ Admin artifacts cleaned up (ephemeral policy)"

      - name: Commit changes
        if: always() && steps.changes.outputs.changes == 'true'
        run: |
          # Build commit message with curation summary
          commit_msg="Daily update - $(date +%Y-%m-%d) [automated]"

          # Add discovery metrics if we have them
          if [ "${DISCOVERY_POLLED:-0}" != "0" ] || [ "${DISCOVERY_TRANSITIONS:-0}" != "0" ]; then
            commit_msg="$commit_msg"$'\n\n'"Discovery: polled=${DISCOVERY_POLLED:-0}, transitions=${DISCOVERY_TRANSITIONS:-0}"
          fi

          # Add new arrivals count if available
          if [ "${NEW_ARRIVALS:-0}" != "0" ]; then
            commit_msg="$commit_msg, arrivals=${NEW_ARRIVALS:-0}"
          fi

          # Add curation summary if we have metrics
          if [ "${CURATION_EDITS:-0}" != "0" ] || [ "${CURATION_ADDITIONS:-0}" != "0" ] || [ "${CURATION_HIDDEN:-0}" != "0" ] || [ "${CURATION_FEATURED:-0}" != "0" ]; then
            commit_msg="$commit_msg"$'\n\n'"Curation: edits=${CURATION_EDITS:-0}, adds=${CURATION_ADDITIONS:-0}, hidden=${CURATION_HIDDEN:-0}, featured=${CURATION_FEATURED:-0}"

            if [ "${CURATION_ORDERED:-0}" != "0" ] || [ "${CURATION_REVIEWS:-0}" != "0" ]; then
              commit_msg="$commit_msg, ordered=${CURATION_ORDERED:-0}, reviews=${CURATION_REVIEWS:-0}"
            fi
          fi

          git add data.json metrics/daily.jsonl
          git commit -m "$commit_msg"

      - name: Push changes to main
        if: always() && steps.changes.outputs.changes == 'true'
        run: git push origin main

      - name: Create success notification
        if: success() && steps.changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const edits = process.env.CURATION_EDITS || '0';
            const additions = process.env.CURATION_ADDITIONS || '0';
            const hidden = process.env.CURATION_HIDDEN || '0';
            const featured = process.env.CURATION_FEATURED || '0';
            const ordered = process.env.CURATION_ORDERED || '0';
            const reviews = process.env.CURATION_REVIEWS || '0';

            // Use captured approval context from environment variables
            const reviewer = process.env.APPROVAL_REVIEWER || 'system';
            const timestamp = process.env.APPROVAL_TIMESTAMP || new Date().toISOString();

            const title = `Daily Update Completed - ${new Date().toLocaleDateString()}`;
            const curationSummary = `edits=${edits}, additions=${additions}, hidden=${hidden}, featured=${featured}`;
            const extendedSummary = ordered !== '0' || reviews !== '0' ?
              `, ordered=${ordered}, reviews=${reviews}` : '';

            // Create a closed issue as a success log entry
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## ✅ Daily Update Successfully Completed

            **Deployment Time:** ${new Date().toISOString()}
            **Reviewer:** ${reviewer}
            **Approval Timestamp:** ${timestamp}
            **Workflow Run:** ${workflowUrl}

            ### 📊 Curation Summary:
            - **Edits:** ${edits}
            - **Additions:** ${additions}
            - **Hidden:** ${hidden}
            - **Featured:** ${featured}
            - **Ordered:** ${ordered}
            - **Reviews:** ${reviews}

            ### 🎯 Impact:
            ${curationSummary}${extendedSummary}

            **Status:** Public site updated successfully with curated content.

            ---
            *This log entry was created automatically by the daily automation workflow.*`,
              labels: ['automation', 'deployment-log', 'success'],
              state: 'closed'  // Close immediately as it's just a log entry
            });

            console.log(\`Created success log issue #\${issue.data.number}: \${title}\`);

            // Also add to step summary
            const summaryMarkdown = \`
            ## ✅ Deployment Completed Successfully

            **Reviewer:** ${reviewer}
            **Timestamp:** ${timestamp}
            **Curation:** ${curationSummary}${extendedSummary}

            📝 **Success Log:** Issue #\${issue.data.number}
            🔗 **Workflow:** [View Run](${workflowUrl})
            \`;

            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryMarkdown);

      - name: Get approval status for failure report
        if: failure()
        id: approval-status
        run: |
          if [ -f "admin/approval.json" ]; then
            reviewer=$(jq -r '.reviewer // "unknown"' admin/approval.json 2>/dev/null || echo "unknown")
            timestamp=$(jq -r '.timestamp // "unknown"' admin/approval.json 2>/dev/null || echo "unknown")
            echo "approval_status=Present: reviewer=$reviewer, timestamp=$timestamp" >> $GITHUB_OUTPUT
          else
            echo "approval_status=Missing" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APPROVAL_STATUS: ${{ steps.approval-status.outputs.approval_status }}
        with:
          script: |
            const approvalInfo = process.env.APPROVAL_STATUS || 'Unknown';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Automation Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Daily Automation Failure

            **Workflow Run:** ${process.env.WORKFLOW_URL}
            **Failure Time:** ${new Date().toISOString()}
            **Branch:** ${context.ref}
            **Approval Status:** ${approvalInfo}

            ### Debugging Steps:
            1. Check the workflow logs at the URL above
            2. Review \`daily_orchestrator.py\` output for specific errors
            3. Verify API keys are properly configured in repository secrets
            4. Check data quality validation errors
            5. Review approval status above for approval-related failures

            ### Manual Recovery:
            If needed, run the daily pipeline manually:
            \`\`\`bash
            python3 daily_orchestrator.py
            \`\`\`

            This issue was created automatically by the failed workflow.`,
              labels: ['automation', 'bug']
            })
