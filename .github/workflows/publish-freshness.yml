name: "Publish Freshness Guard"

# The site deploys only when data.json changes (publish.yml push-path filter),
# so a broken daily pipeline can leave the live site silently stale — no
# failed run, no signal, just old content. This guard fails loudly instead:
# if the last successful publish is older than 26 hours it opens a critical
# issue (or bumps the existing open one), and closes the alert once a fresh
# publish lands.

on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC — hours after the 07:30 UTC daily pipeline
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check last successful publish
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_AGE_HOURS = 26;  // daily cadence + scheduling jitter
            const STALE_LABEL = 'publish-stale';

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              status: 'success',
              per_page: 1,
            });
            const last = runs.data.workflow_runs[0];
            const ageHours = last
              ? (Date.now() - new Date(last.run_started_at).getTime()) / 3.6e6
              : Infinity;
            const ageLabel = last
              ? `${ageHours.toFixed(1)}h ago (${last.run_started_at})`
              : 'never';
            console.log(`Last successful publish: ${ageLabel}`);

            const openAlerts = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: STALE_LABEL,
              state: 'open',
              per_page: 5,
            });

            if (ageHours <= MAX_AGE_HOURS) {
              console.log('Publish is fresh — all good.');
              // Auto-resolve any open staleness alert
              for (const issue of openAlerts.data.issues ?? openAlerts.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ Resolved: a successful publish ran ${ageLabel}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
                console.log(`Closed stale-publish alert #${issue.number}`);
              }
              return;
            }

            // Stale — alert loudly, but don't stack duplicate issues
            const body = [
              '## 🚨 The live site has not been published in over 26 hours',
              '',
              `**Last successful publish:** ${ageLabel}`,
              `**Checked at:** ${new Date().toISOString()}`,
              '',
              '### Likely causes',
              '1. The daily pipeline (daily-check.yml) failed or produced no data.json change — publish.yml only triggers on data.json pushes.',
              '2. The publish workflow itself is failing (check its runs).',
              '',
              '### How to fix',
              '- Re-publish now (safe, no data regeneration): **Actions → "Publish Draft" → Run workflow**,',
              '  or from a terminal: `gh workflow run publish.yml --ref main`',
              '- Then check why daily-check.yml did not commit data.json today.',
              '',
              '*Created automatically by the Publish Freshness Guard.*',
            ].join('\n');

            const existing = (openAlerts.data.issues ?? openAlerts.data)[0];
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              console.log(`Still stale — bumped existing alert #${existing.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Site publish is STALE — no deploy in 24h+',
                body,
                labels: ['automation', STALE_LABEL, 'critical'],
              });
              console.log(`Opened stale-publish alert #${issue.data.number}`);
            }

            core.setFailed(`No successful publish in ${MAX_AGE_HOURS}h (last: ${ageLabel})`);
