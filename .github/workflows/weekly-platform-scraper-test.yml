name: Weekly Platform Scraper Test

on:
  schedule:
    # Run every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: # Allow manual triggering

jobs:
  test-platform-scraper:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        python3 -m playwright install --with-deps chromium

    - name: Run platform scraper smoke test
      run: |
        python3 -m pytest tests/test_platform_scraper.py --smoke --headless
      env:
        NRW_SCRAPER_HEADLESS: 'true'

    - name: Run RT and Wikipedia scraper tests
      run: |
        python3 -m pytest tests/test_rt_and_wikipedia_scrapers.py -v -m slow
      env:
        NRW_SCRAPER_HEADLESS: 'true'
      continue-on-error: true  # Don't fail workflow if enrichment tests fail

    - name: Notify on failure
      if: failure()
      run: |
        echo "Platform scraper smoke test failed. Check scraper selectors for updates."
        echo "This may indicate streaming platform UI changes requiring maintenance."