<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Spreadsheet Layout v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

/* Header */
.header {
    background: #2a2a2a; padding: 1rem 1.5rem; border-bottom: 1px solid #3a3a3a;
    display: flex; justify-content: space-between; align-items: center;
}
.header h1 { font-size: 1.3rem; color: #ff6b6b; }
.header-right { display: flex; gap: 0.75rem; align-items: center; }
.stat { color: #999; font-size: 0.85rem; }
.stat strong { color: #fff; }
.hdr-btn {
    padding: 0.4rem 0.8rem; border: none; border-radius: 4px;
    font-size: 0.8rem; cursor: pointer; color: #fff; font-weight: 600;
}

/* Filters bar */
.filters {
    display: flex; gap: 0.5rem; padding: 0.5rem 1rem; align-items: center;
    background: #222; border-bottom: 1px solid #2a2a2a;
}
.fbtn {
    padding: 0.3rem 0.65rem; background: #3a3a3a; color: #ccc; border: none;
    border-radius: 4px; cursor: pointer; font-size: 0.78rem; position: relative;
    transition: all 0.15s;
}
.fbtn:hover { background: #4a4a4a; color: #fff; }
.fbtn.active { background: #ff6b6b; color: #fff; }
.fbtn.warn { background: #dc3545; color: #fff; font-weight: bold; }
.fbtn .ct {
    position: absolute; top: -7px; right: -7px;
    background: #fff; color: #dc3545; border-radius: 50%;
    width: 18px; height: 18px; font-size: 0.58rem; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #dc3545;
}
.search-input {
    margin-left: auto; padding: 0.3rem 0.6rem;
    background: #1a1a1a; border: 1px solid #3a3a3a; color: #fff;
    border-radius: 4px; font-size: 0.78rem; width: 200px;
}

/* Column Headers */
.col-headers {
    display: flex; align-items: center; gap: 0;
    padding: 0.3rem 0.5rem;
    background: #222; border-bottom: 2px solid #3a3a3a;
    position: sticky; top: 0; z-index: 30;
    font-size: 0.6rem; color: #666; text-transform: uppercase; letter-spacing: 0.04em;
}
.col-hdr { flex-shrink: 0; padding: 0 0.3rem; }

/* Date section headers */
.date-header {
    padding: 0.35rem 1rem; background: #1e1e1e;
    color: #ff6b6b; font-size: 0.82rem; font-weight: 600;
    position: sticky; top: 26px; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2a2a2a;
}
.date-header .ct { color: #555; font-weight: normal; font-size: 0.78rem; }

/* Movie row — grid for column alignment */
.movie-row {
    display: grid;
    grid-template-columns: 16px 36px minmax(150px,500px) 130px 26px 30px 90px 30px 30px 68px 20px 24px 1fr;
    gap: 0 0.25rem;
    padding: 0.25rem 0.5rem;
    align-items: center;
    border-bottom: 1px solid #1e1e1e;
    cursor: pointer; transition: background 0.1s;
    min-height: 46px;
}
.movie-row:hover { background: #222; }
.movie-row.expanded { background: #1a1a2e; border-bottom-color: transparent; }
.movie-row.pick { border-left: 3px solid #ffd700; }
.movie-row.incomplete { border-left: 3px solid #dc3545; }
.movie-row.pick.incomplete { border-left: 3px solid #ffd700; }

/* Drag handle */
.drag-handle {
    cursor: grab; color: #444;
    font-size: 0.8rem; text-align: center; line-height: 1;
    letter-spacing: -2px; user-select: none;
}
.drag-handle:hover { color: #999; }
.drag-handle:active { cursor: grabbing; }

/* Poster — doubles as trailer button */
.pst-wrap {
    width: 32px; height: 48px; position: relative; cursor: pointer;
    border-radius: 3px; overflow: hidden; flex-shrink: 0;
}
.pst-wrap:hover .pst-play { opacity: 1; }
.pst-wrap:hover::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.45); border-radius: 3px;
}
.pst { width: 32px; height: 48px; border-radius: 3px; object-fit: cover; background: #111; display: block; }
.pst-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 0.7rem; opacity: 0; transition: opacity 0.15s;
    z-index: 2; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    pointer-events: none;
}
.no-pst {
    width: 32px; height: 48px; background: #222; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    color: #444; font-size: 0.4rem; cursor: pointer;
}

/* Title + Labels in one grid cell */
.r-title-labels {
    display: flex; align-items: center; gap: 0;
    min-width: 0; overflow: hidden;
}
.r-title {
    font-weight: 600; font-size: 0.85rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex-shrink: 1; min-width: 50px;
}

/* Category toggle buttons inline with title */
.row-cat-btns {
    display: flex; gap: 2px; flex-shrink: 0; margin-left: 0.35rem;
}
.cat-btn {
    padding: 1px 4px; border-radius: 3px; font-size: 0.5rem; font-weight: 700;
    border: 1px solid #333; background: transparent; color: #444;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
    line-height: 1.3;
}
.cat-btn:hover { border-color: #888; color: #ccc; }
.cat-btn.on { border-color: var(--c); background: var(--c); color: var(--ct, #fff); }

/* Director */
.r-dir {
    color: #999; font-size: 0.78rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.r-dir.bad { color: #dc3545; }

/* CC + Min */
.r-cc { color: #888; font-size: 0.72rem; text-align: center; }
.r-min { color: #888; font-size: 0.72rem; text-align: center; }

/* Quick research links */
.quick-links {
    display: flex; gap: 2px; justify-content: center;
}
.ql {
    padding: 2px 5px; border-radius: 2px; font-size: 0.52rem; font-weight: 700;
    text-decoration: none; color: #999; background: #2a2a2a;
    transition: all 0.1s; cursor: pointer; border: none;
    display: flex; align-items: center; justify-content: center;
    height: 18px; letter-spacing: 0.02em;
}
.ql:hover { color: #fff; background: #444; }
.ql.dead { color: #333; pointer-events: none; }

/* Score cells */
.r-score { text-align: center; font-size: 0.7rem; font-weight: 700; padding: 2px 3px; border-radius: 3px; }
.rt-high { background: #28a745; color: #fff; }
.rt-mid { background: #ffc107; color: #000; }
.rt-low { background: #dc3545; color: #fff; }
.score-none { color: #333; }
.imdb-good { color: #ffd700; }
.imdb-ok { color: #888; }

/* Streaming pill */
.stream-pill {
    font-size: 0.55rem; font-weight: 700; padding: 2px 5px;
    border-radius: 3px; color: #fff; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: inline-block; max-width: 68px;
}
.stream-netflix { background: #E50914; }
.stream-mubi { background: #1a73e8; }
.stream-disney { background: #113CCF; }
.stream-max { background: #B537F2; }
.stream-hulu { background: #1CE783; color: #000; }
.stream-prime { background: #00A8E1; }
.stream-apple { background: #aaa; color: #000; }
.stream-generic { background: #666; }

/* Incomplete indicator */
.incomplete-dot {
    display: flex; align-items: center; justify-content: center;
}
.inc-flag {
    width: 9px; height: 9px; border-radius: 50%; background: #dc3545;
    display: inline-block;
}

/* Trash button */
.trash-btn {
    background: none; border: none;
    color: #444; cursor: pointer; font-size: 0.8rem; padding: 2px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px; transition: all 0.15s;
}
.trash-btn:hover { color: #dc3545; background: rgba(220,53,69,0.15); }

/* ======= EXPANDED EDIT PANEL ======= */
.ep {
    display: none; padding: 0.75rem 1rem 0.75rem 52px;
    background: #1a1a2e; border-bottom: 1px solid #2a2a4a;
    font-size: 0.8rem;
}
.ep.open { display: block; }

.ep-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 1.25rem;
}
.ep-col { display: flex; flex-direction: column; gap: 0.35rem; }

/* Section label */
.ep-section-label {
    font-size: 0.65rem; color: #ff6b6b; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 0.2rem; padding-bottom: 0.15rem;
    border-bottom: 1px solid #2a2a4a;
}

/* Field rows */
.fr { display: flex; gap: 0.3rem; align-items: center; }
.fl { font-size: 0.68rem; color: #666; min-width: 46px; flex-shrink: 0; }
.fi {
    flex: 1; padding: 0.2rem 0.35rem;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    color: #fff; border-radius: 3px; font-size: 0.76rem;
}
.fi.miss { background: #3a1a1a; border-color: #dc3545; }
.fi-sm { width: 50px; flex: none; }
.sv {
    padding: 0.2rem 0.45rem; background: #28a745; color: #fff;
    border: none; border-radius: 3px; font-size: 0.68rem; cursor: pointer;
}
.sv:hover { background: #218838; }

/* Link buttons in expanded */
.lnk-row { display: flex; gap: 2px; margin-bottom: 0.2rem; }
.lb {
    padding: 0.22rem 0.4rem; border: none; border-radius: 3px;
    font-size: 0.6rem; font-weight: 700; color: #fff; cursor: pointer;
    transition: all 0.15s;
}
.lb.g { background: #28a745; }
.lb.g:hover { background: #218838; }
.lb.r { background: #dc3545; }
.lb.r:hover { background: #c82333; }
.lnk-input { display: flex; gap: 0.25rem; }
.lf {
    flex: 1; padding: 0.2rem 0.35rem;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    color: #fff; border-radius: 3px; font-size: 0.72rem;
}
.lnk-hint { font-size: 0.58rem; color: #555; margin-top: 0.1rem; }

/* Quotes panel in middle column */
.quotes-list {
    display: flex; flex-direction: column; gap: 0.3rem;
    max-height: 180px; overflow-y: auto;
}
.quote-item {
    display: flex; align-items: flex-start; gap: 0.3rem;
    padding: 0.3rem 0.4rem; background: #2a2a2a; border-radius: 4px;
    border: 1px solid #3a3a3a; font-size: 0.72rem; color: #ccc;
    cursor: pointer; transition: all 0.15s; position: relative;
}
.quote-item:hover { border-color: #6c5ce7; }
.quote-item.selected { border-color: #6c5ce7; background: rgba(108,92,231,0.12); }
.quote-item .q-check {
    width: 14px; height: 14px; border: 1.5px solid #555; border-radius: 3px;
    flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.5rem; transition: all 0.12s;
}
.quote-item.selected .q-check { border-color: #6c5ce7; background: #6c5ce7; color: #fff; }
.quote-text { line-height: 1.4; flex: 1; }
.quote-src { font-size: 0.6rem; color: #666; margin-top: 2px; }
.quote-empty { color: #555; font-size: 0.72rem; font-style: italic; padding: 0.5rem 0; }
.quote-add-row { display: flex; gap: 0.25rem; margin-top: 0.25rem; }
.quote-add-input {
    flex: 1; padding: 0.2rem 0.35rem;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    color: #fff; border-radius: 3px; font-size: 0.72rem;
}
.quote-add-btn {
    padding: 0.2rem 0.45rem; background: #6c5ce7; color: #fff;
    border: none; border-radius: 3px; font-size: 0.65rem; font-weight: 600;
    cursor: pointer;
}
.quote-add-btn:hover { background: #5a4bd6; }
.quote-count { font-size: 0.6rem; color: #666; }

/* Watch links */
.wl-label { font-size: 0.65rem; color: #666; margin-bottom: 0.1rem; }
.svc-row { display: flex; gap: 2px; margin-bottom: 0.15rem; }
.sb {
    padding: 0.18rem 0.35rem; border: none; border-radius: 3px;
    font-size: 0.56rem; font-weight: 700; color: #fff; cursor: pointer;
}
.sb.g { background: #28a745; }
.sb.r { background: #dc3545; }
.sb.add { background: transparent; border: 1px dashed #555; color: #666; font-weight: 400; }
.sb.add:hover { border-color: #999; color: #ccc; }

/* Synopsis */
.syn-wrap { flex: 1; display: flex; flex-direction: column; }
.syn-hdr { display: flex; justify-content: space-between; margin-bottom: 0.1rem; }
.syn-hdr span { font-size: 0.62rem; color: #555; }
.syn {
    width: 100%; flex: 1; min-height: 120px; padding: 0.3rem 0.4rem;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    color: #fff; border-radius: 3px; font-size: 0.73rem; resize: vertical;
    font-family: inherit;
}
.syn.miss { background: #3a1a1a; border-color: #dc3545; }

/* Remove/actions in expanded */
.ep-actions { display: flex; justify-content: flex-end; margin-top: 0.35rem; gap: 0.4rem; }
.rm-btn {
    padding: 0.22rem 0.55rem; background: #dc3545; color: #fff;
    border: none; border-radius: 3px; font-size: 0.72rem; cursor: pointer;
}
.rm-btn:hover { background: #c82333; }
.quote-btn {
    padding: 0.22rem 0.55rem; background: #6c5ce7; color: #fff;
    border: none; border-radius: 3px; font-size: 0.72rem; cursor: pointer;
    text-decoration: none;
}

/* Overlays */
.img-overlay {
    display: none; position: fixed; inset: 0; z-index: 1001;
    background: rgba(0,0,0,0.88); align-items: center; justify-content: center; cursor: pointer;
}
.img-overlay.open { display: flex; }
.img-overlay img { max-height: 80vh; max-width: 90vw; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }

.t-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.92); align-items: center; justify-content: center;
}
.t-overlay.open { display: flex; }
.t-box { width: 90%; max-width: 880px; position: relative; }
.t-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 0.8rem; background: #2a2a2a; border-radius: 8px 8px 0 0;
}
.t-bar span { color: #fff; font-weight: 600; font-size: 0.95rem; }
.t-close {
    background: none; border: none; color: #999; font-size: 1.4rem;
    cursor: pointer; padding: 0; width: 1.8rem; height: 1.8rem;
    display: flex; align-items: center; justify-content: center; border-radius: 4px;
}
.t-close:hover { background: #dc3545; color: #fff; }
.t-vid {
    background: #000; aspect-ratio: 16/9; border-radius: 0 0 8px 8px;
    display: flex; align-items: center; justify-content: center; color: #333; font-size: 0.85rem;
}
</style>
</head>

function isIncomplete(m) {
    return !m.trlr || !m.img || !m.dir || !m.cc || !m.syn || !m.rt || !m.wiki;
}

function rtClass(score) {
    if (score === null || score === undefined) return 'score-none';
    if (score >= 75) return 'rt-high';
    if (score >= 50) return 'rt-mid';
    return 'rt-low';
}

function streamClass(name) {
    if (!name) return '';
    const n = name.toLowerCase();
    if (n.includes('netflix')) return 'stream-netflix';
    if (n.includes('mubi')) return 'stream-mubi';
    if (n.includes('disney')) return 'stream-disney';
    if (n.includes('max') || n.includes('hbo')) return 'stream-max';
    if (n.includes('hulu')) return 'stream-hulu';
    if (n.includes('prime') || n.includes('amazon')) return 'stream-prime';
    if (n.includes('apple')) return 'stream-apple';
    return 'stream-generic';
}

function renderRow(m) {
    const incomplete = isIncomplete(m);
    const trlrClick = m.trlr ? `onclick="event.stopPropagation(); openTrl('${m.title.replace(/'/g,"\\'")}')"` : '';
    const posterHtml = m.poster
        ? `<div class="pst-wrap" ${trlrClick}><img class="pst" src="${m.poster}"><span class="pst-play">&#9654;</span></div>`
        : `<div class="no-pst" ${trlrClick}>?</div>`;

    // RT score display
    const rtDisplay = m.rt_score !== null && m.rt_score !== undefined
        ? `<div class="r-score ${rtClass(m.rt_score)}">${m.rt_score}</div>`
        : `<div class="r-score score-none">—</div>`;

    // IMDb display
    const imdbDisplay = m.imdb_rating !== null && m.imdb_rating !== undefined
        ? `<div class="r-score ${m.imdb_rating >= 7.0 ? 'imdb-good' : 'imdb-ok'}">${m.imdb_rating}</div>`
        : `<div class="r-score score-none">—</div>`;

    // Streaming pill
    const streamHtml = m.streaming
        ? `<span class="stream-pill ${streamClass(m.streaming)}">${m.streaming}</span>`
        : '';

    // Category toggle buttons — all inline next to title
    function catBtn(key, label, color, textColor) {
        return `<button class="cat-btn ${m[key]?'on':''}" style="--c:${color};--ct:${textColor||'#fff'}" onclick="event.stopPropagation(); this.classList.toggle('on')" title="${label}">${label}</button>`;
    }

    return `
    <div class="movie-row ${m.pick?'pick':''} ${incomplete?'incomplete':''}" onclick="toggle(this)">
        <div class="drag-handle" onclick="event.stopPropagation()">&#8942;&#8942;</div>
        ${posterHtml}
        <div class="r-title-labels">
            <div class="r-title">${m.title}</div>
            <div class="row-cat-btns" onclick="event.stopPropagation()">
                ${catBtn('pick', '★', '#ffd700', '#000')}
                ${catBtn('bigtime', 'BIG', '#ff6b6b')}
                ${catBtn('indie', 'INDIE', '#4a90d9')}
                ${catBtn('foreign', 'FRGN', '#9b59b6')}
                ${catBtn('series', 'SERIES', '#17a2b8')}
                ${catBtn('restore', 'REST', '#C8A951', '#000')}
                ${catBtn('vscr', 'VSCR', '#e67e22')}
                ${catBtn('doc', 'DOC', '#4A90D9')}
            </div>
        </div>
        <div class="r-dir ${!m.dir?'bad':''}">${m.dir || '—'}</div>
        <div class="r-cc">${m.cc || '—'}</div>
        <div class="r-min">${m.min || '—'}</div>
        <div class="quick-links" onclick="event.stopPropagation()">
            <a class="ql ${m.wiki_url?'':'dead'}" ${m.wiki_url?`href="${m.wiki_url}" target="_blank"`:''} title="Wikipedia">WIKI</a>
            <a class="ql ${m.imdb?'':'dead'}" ${m.imdb?`href="https://www.imdb.com/title/${m.imdb}/" target="_blank"`:''} title="IMDb">IMDB</a>
            <a class="ql ${m.rt?'':'dead'}" href="#" title="Rotten Tomatoes">RT</a>
        </div>
        ${rtDisplay}
        ${imdbDisplay}
        <div>${streamHtml}</div>
        <div class="incomplete-dot">${incomplete ? '<span class="inc-flag" title="Incomplete data"></span>' : ''}</div>
        <button class="trash-btn" onclick="event.stopPropagation(); if(confirm('Remove '+${JSON.stringify(m.title)}+'?')) this.closest('.movie-row').style.display='none'" title="Remove">&#128465;</button>
    </div>
    <div class="ep">
        <div class="ep-grid">
            <div class="ep-col">
                <div class="fr">
                    <span class="fl">Director</span>
                    <input class="fi ${!m.dir?'miss':''}" value="${m.dir}">
                </div>
                <div class="fr">
                    <span class="fl">Country</span>
                    <input class="fi fi-sm ${!m.cc?'miss':''}" value="${m.cc}">
                    <span class="fl" style="min-width:24px; margin-left:0.2rem;">Min</span>
                    <input class="fi fi-sm" value="${m.min||''}">
                    <button class="sv" style="margin-left:0.15rem;">Save</button>
                </div>
                <div class="lnk-row" style="margin-top:0.25rem;">
                    <button class="lb ${m.trlr?'g':'r'}">&#9654; TRLR</button>
                    <button class="lb ${m.rt?'g':'r'}">RT</button>
                    <button class="lb ${m.img?'g':'r'}" onclick="event.stopPropagation(); ${m.poster ? `showImg('${m.poster.replace('/w92/','/w500/')}')` : ''}">IMG</button>
                    <button class="lb ${m.wiki?'g':'r'}">WIKI</button>
                </div>
                <div class="lnk-input">
                    <input class="lf" placeholder="Select a link button to edit...">
                    <button class="sv">Save</button>
                </div>
                <div style="margin-top:0.3rem;">
                    <div class="svc-row">
                        <span class="fl" style="min-width:auto;">Stream</span>
                        ${m.streaming ? `<button class="sb g">${m.streaming.toUpperCase()}</button>` : ''}
                        <button class="sb add">+ add</button>
                    </div>
                    <div class="svc-row" style="margin-top:0.15rem;">
                        <span class="fl" style="min-width:auto;">VOD</span>
                        ${m.vod_amazon ? '<button class="sb g">AMAZON</button>' : ''}
                        ${m.vod_apple ? '<button class="sb g">ITUNES</button>' : ''}
                        ${m.vod_vudu ? '<button class="sb g">VUDU</button>' : ''}
                        <button class="sb add">+ add</button>
                    </div>
                </div>
            </div>

            <div class="ep-col">
                <div class="ep-section-label">Pull Quotes <span class="quote-count">${(m.quotes||[]).length} saved</span></div>
                <div class="quotes-list">
                    ${(m.quotes||[]).length > 0 ? (m.quotes||[]).map((q,i) => `
                        <div class="quote-item ${q.selected?'selected':''}" onclick="this.classList.toggle('selected')">
                            <span class="q-check">${q.selected?'&#10003;':''}</span>
                            <div>
                                <div class="quote-text">"${q.text}"</div>
                                <div class="quote-src">— ${q.source}</div>
                            </div>
                        </div>
                    `).join('') : '<div class="quote-empty">No quotes yet</div>'}
                </div>
                <div class="quote-add-row">
                    <input class="quote-add-input" placeholder="Add a pull quote...">
                    <button class="quote-add-btn">+ Add</button>
                </div>
            </div>

            <div class="ep-col">
                <div class="syn-wrap">
                    <div class="syn-hdr">
                        <span class="ep-section-label" style="border:none; padding:0; margin:0;">Synopsis</span>
                        <span>${(m.syn||'').length}/600</span>
                    </div>
                    <textarea class="syn ${!m.syn?'miss':''}">${m.syn||''}</textarea>
                </div>
                <div class="ep-actions">
                    <button class="rm-btn">Remove from wall</button>
                </div>
            </div>
        </div>
    </div>`;
}

function formatDate(d) {
    const dt = new Date(d + 'T12:00:00');
    return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

let html = '';
for (const section of MOVIES) {
    html += `<div class="date-header">${formatDate(section.date)} <span class="ct">${section.items.length} movies</span></div>`;
    section.items.forEach(m => { html += renderRow(m); });
}
document.getElementById('movie-list').innerHTML = html;

function toggle(row) {
    const panel = row.nextElementSibling;
    const wasOpen = panel.classList.contains('open');
    document.querySelectorAll('.ep').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.movie-row').forEach(r => r.classList.remove('expanded'));
    if (!wasOpen) { panel.classList.add('open'); row.classList.add('expanded'); }
}

function showImg(url) {
    document.getElementById('img-preview').src = url;
    document.getElementById('imgoverlay').classList.add('open');
}
function closeImg() { document.getElementById('imgoverlay').classList.remove('open'); }

function openTrl(title) {
    document.getElementById('trl-title').textContent = title;
    document.getElementById('trl-vid').textContent = 'Playing: ' + title;
    document.getElementById('toverlay').classList.add('open');
}
function closeTrl() { document.getElementById('toverlay').classList.remove('open'); }

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeTrl(); closeImg(); }
});
</script>
