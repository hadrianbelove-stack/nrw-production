<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <!-- Resolve all relative URLs (styles, app.js, data.json, posters) from repo root -->
    <base href="../">
    <title>MOCKUP — Nav Bar Variants A/B/C/D</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="assets/styles.css?v=103">
    <style>
    /* ===== Common to all variants: approved density bits not yet in styles.css ===== */
    .cwide-hdr { padding: 14px 26px 4px; }
    .masthead-row { margin-bottom: 10px; }
    /* Search shrinks when squeezed but never hogs the row's free space */
    .cwide-controls .cwide-search { flex: 0 1 320px; min-width: 140px; }
    /* No control ever touches its neighbor, even with dividers hidden */
    .cwide-controls { gap: 14px; }

    /* =====================================================================
       VARIANT A — no box: open row with a teal hairline as the bottom edge
       ===================================================================== */
    body.v-a .cwide-controls {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 4px 2px 12px;
        border-bottom: 1px solid rgba(0, 212, 170, 0.35);
    }
    body.v-a .cwide-divider { display: none; }

    /* =====================================================================
       VARIANT B — the box survives but recedes: hairline, no fill, slim
       ===================================================================== */
    body.v-b .cwide-controls {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 10px;
        padding: 6px 14px;
    }
    body.v-b .cwide-divider { height: 20px; }

    /* =====================================================================
       VARIANT C — fused: control row sits directly ON the first date strip;
       the strip's top border is the row's bottom line
       ===================================================================== */
    body.v-c .cwide-controls {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 4px 2px 10px;
    }
    body.v-c .cwide-divider { display: none; }
    body.v-c header { padding-bottom: 0; border-bottom: none; }
    body.v-c .cwide-hdr { padding-bottom: 0; }
    body.v-c #wall { padding-top: 0; }

    /* =====================================================================
       VARIANT D — controls share the masthead row (wordmark left, bar right)
       ⚠ reopens the "masthead = wordmark only" decision — comparison only
       ===================================================================== */
    body.v-d .cwide-hdr {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 10px 26px;
        flex-wrap: wrap;
    }
    body.v-d .masthead-row { margin-bottom: 0; flex: 0 0 auto; }
    body.v-d header h1 { font-size: 1.9rem; letter-spacing: 0.18em; }
    body.v-d .site-slogan { font-size: 0.78rem; margin: 0; }
    body.v-d .cwide-controls {
        flex: 1 1 520px;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
    }
    body.v-d .cwide-divider { display: none; }

    /* =====================================================================
       SLOGAN TREATMENTS (paired with variant C)
       Production bug being fixed here: the slogan's 45° gradient is painted
       across the full 817px masthead box while the text spans ~460px, so
       its teal never arrives; and it sits 4px under the wordmark.
       ===================================================================== */
    /* S1 — caps, tracked out: echoes the wordmark's architecture */
    body.s1 .site-slogan {
        background: none;
        -webkit-text-fill-color: currentColor;
        color: rgba(0, 212, 170, 0.8);
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        margin: 10px 0 0;
        width: fit-content;
    }
    /* S2 — sentence case kept, artifacts fixed: solid color, breathing room */
    body.s2 .site-slogan {
        background: none;
        -webkit-text-fill-color: currentColor;
        color: rgba(154, 223, 208, 0.9);
        font-size: 1rem;
        margin: 8px 0 0;
        width: fit-content;
    }
    /* S3 — inline: slogan sits on the wordmark's baseline, saves the row */
    body.s3 .mh-titles { display: flex; align-items: baseline; gap: 22px; }
    body.s3 .site-slogan {
        background: none;
        -webkit-text-fill-color: currentColor;
        color: rgba(0, 212, 170, 0.7);
        text-transform: uppercase;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        margin: 0;
        white-space: nowrap;
    }

    /* Variant switcher — mockup chrome only */
    #mock-variant {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 20000;
        background: rgba(8, 8, 12, 0.92);
        border: 1px solid #00d4aa;
        color: #00d4aa;
        border-radius: 25px;
        padding: 0.55rem 1.1rem;
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        cursor: pointer;
        font-family: inherit;
    }
    </style>
</head>
<body class="v-a">
    <header>
        <div class="cwide-hdr">
            <div class="masthead-row">
                <div class="mh-titles">
                    <h1>THE&nbsp;NEW RELEASE&nbsp;WALL</h1>
                    <p class="site-slogan">What came out, every day.</p>
                </div>
            </div>
            <div class="cwide-controls">
                <div class="slop-toggle-wrap" id="slop-free-toggle" data-state="all">
                    <div class="slop-track"><div class="slop-thumb"></div></div>
                    <span class="slop-label" id="slop-state-label">SLOP FILTER</span>
                </div>
                <div class="cwide-divider"></div>
                <div class="slop-toggle-wrap" id="highlights-toggle">
                    <div class="slop-track"><div class="slop-thumb"></div></div>
                    <span class="slop-label">SELECTS</span>
                </div>
                <div class="cwide-divider"></div>
                <div class="slop-toggle-wrap" id="fest-toggle">
                    <div class="slop-track"><div class="slop-thumb"></div></div>
                    <span class="slop-label">FESTS</span>
                </div>
                <div class="cwide-divider"></div>
                <div class="slop-toggle-wrap" id="preorder-toggle">
                    <div class="slop-track"><div class="slop-thumb"></div></div>
                    <span class="slop-label">PRE-ORDER</span>
                </div>
                <div class="cwide-divider"></div>
                <div class="genre-slot">
                    <button class="genre-control" id="genre-toggle" type="button" aria-expanded="false"><span class="genre-text">GENRE</span><span class="caret">▼</span></button>
                    <div class="genre-pop" id="genre-pop">
                        <div class="genre-pop-head"><span>Filter by genre</span><button class="genre-clear" id="genre-clear" type="button">Clear</button></div>
                        <div class="genre-chips">
                            <button class="filter-btn" data-filter="indie">Indie</button>
                            <button class="filter-btn" data-filter="horror">Horror</button>
                            <button class="filter-btn" data-filter="action">Action</button>
                            <button class="filter-btn" data-filter="comedy">Comedy</button>
                            <button class="filter-btn" data-filter="family">Family</button>
                            <button class="filter-btn" data-filter="thriller">Thriller</button>
                            <button class="filter-btn" data-filter="foreign">Foreign</button>
                            <button class="filter-btn" data-filter="documentary">Docs</button>
                            <button class="filter-btn" data-filter="restorations">Reissues</button>
                        </div>
                    </div>
                </div>
                <div class="cwide-divider"></div>
                <div class="cwide-search">
                    <div class="search-container">
                        <svg class="search-mag" aria-hidden="true" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8"/><line x1="12.8" y1="12.8" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <input type="text" id="search-input" placeholder="Search title, director, genre..." autocomplete="off">
                        <button id="search-clear" class="search-clear" aria-label="Clear search">&times;</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <div class="filter-description" id="filter-description">
        <h2 class="filter-description-title" id="filter-description-title"></h2>
        <div class="filter-description-right">
            <p id="filter-description-text"></p>
        </div>
    </div>
    <main id="wall"></main>
    <div id="load-more-container"></div>

    <!-- Fullscreen Poster Lightbox -->
    <div class="poster-lightbox" id="poster-lightbox">
        <div class="lightbox-content">
            <div class="lightbox-poster-wrap">
                <div class="lightbox-poster-fallback" id="lightbox-poster-fallback"><span class="lightbox-poster-fallback-title" id="lightbox-poster-fallback-title"></span></div>
                <img class="lightbox-poster" id="lightbox-poster" src="" alt="Movie poster">
                <div class="lightbox-score-overlay" id="lightbox-score-overlay"></div>
            </div>
            <div class="lightbox-info-wrap">
                <button class="lightbox-close" onclick="NRW.closeLightbox()" aria-label="Close">&times;</button>
                <div class="lightbox-info">
                    <div class="lightbox-screening-name" id="lightbox-screening-name" style="display:none;"></div>
                    <div class="lightbox-title-area">
                        <div class="lightbox-title-row">
                            <h2 class="lightbox-title" id="lightbox-title"></h2>
                            <span class="staff-pick-badge" id="lightbox-staff-pick" style="display:none;">★ NRW SELECT ★</span>
                        </div>
                        <div class="lightbox-title-sub">
                            <span class="lightbox-reissue-pill" id="lightbox-reissue-label" style="display:none;"></span>
                            <span class="lightbox-date" id="lightbox-date"></span>
                        </div>
                    </div>
                    <div class="lightbox-meta" id="lightbox-meta"></div>
                    <div class="lightbox-scores" id="lightbox-scores"></div>
                    <div class="lightbox-pull-quotes" id="lightbox-pull-quotes" style="display:none;"></div>
                    <p class="lightbox-synopsis" id="lightbox-synopsis"></p>
                    <p class="lightbox-runtime" id="lightbox-runtime" style="display:none;"></p>
                </div>
                <div class="lightbox-scroll-fade"></div>
                <div class="lightbox-more-pill" id="lightbox-more-pill">MORE ⌄</div>
                <div class="lightbox-buttons" id="lightbox-buttons"></div>
            </div>
        </div>
    </div>

    <button id="mock-variant" type="button">A — HAIRLINE</button>

    <script src="assets/shared-config.js?v=3"></script>
    <script src="assets/app.js?v=86"></script>
    <script>
    /* ===== Variant switcher ===== */
    (function () {
        var VARIANTS = [
            { cls: 'v-c s1', label: 'C + SLOGAN CAPS' },
            { cls: 'v-c s2', label: 'C + SLOGAN CLEAN' },
            { cls: 'v-c s3', label: 'C + SLOGAN INLINE' },
            { cls: 'v-c',    label: 'C (slogan as-is)' },
            { cls: 'v-a', label: 'A — HAIRLINE' },
            { cls: 'v-b', label: 'B — SLIM BOX' },
            { cls: 'v-d', label: 'D — ONE ROW' },
            { cls: '',    label: 'PROD (current)' },
        ];
        var i = 0;
        var btn = document.getElementById('mock-variant');
        btn.addEventListener('click', function () {
            i = (i + 1) % VARIANTS.length;
            document.body.className = VARIANTS[i].cls;
            btn.textContent = VARIANTS[i].label;
        });
    })();
    </script>
</body>
</html>
