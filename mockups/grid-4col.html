<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NRW - 4 Column Grid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            background-attachment: fixed;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== HEADER ===== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 1rem 0.5rem;
            text-align: center;
            border-bottom: 1px solid #333;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .site-header h1 {
            font-weight: 100;
            letter-spacing: 0.3em;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #fff, #00d4aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
        }
        /* Two-row filter pills */
        .filters-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3rem;
            padding-bottom: 0.15rem;
        }
        .filter-pill {
            padding: 0.25rem 0.6rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 25px;
            font-size: 0.65rem;
        }
        .filter-pill.active {
            background: #00d4aa;
            border-color: #00d4aa;
            color: #000;
            font-weight: 700;
        }

        /* ===== GRID ===== */
        .wall {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px 8px;
            padding: 10px;
        }
        .grid-item {
            touch-action: manipulation;
            cursor: pointer;
        }
        .movie-card {
            aspect-ratio: 2/3;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .movie-title {
            font-size: 0.6rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            margin-top: 5px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .movie-director {
            font-size: 0.5rem;
            color: #00d4aa;
            text-align: center;
            margin-top: 2px;
            font-weight: 600;
        }
        .streaming-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 6.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
        }
        .staff-pick-wrap {
            border: 2px solid #dc143c;
            border-radius: 10px;
            padding: 3px;
            background: rgba(220,20,60,0.05);
            box-shadow: 0 0 12px rgba(220,20,60,0.3);
        }
        .staff-pick-wrap .movie-card { border-radius: 7px; }

        /* ===== SERVICE BADGES ===== */
        .badge-netflix { background: #E50914; }
        .badge-max { background: #B537F2; }
        .badge-prime { background: #00A8E1; }
        .badge-hulu { background: #1CE783; color: #000 !important; }
        .badge-disney { background: #113CCF; }
        .badge-rent { background: #ff9500; }
        .badge-mubi { background: #DA2128; }
        .badge-tubi { background: #FA382F; }
        .badge-criterion { background: #000; border: 0.5px solid #888; }
        .badge-kanopy { background: #1B7A43; }
        .badge-paramount { background: #0064FF; }
        .badge-apple { background: #000; border: 0.5px solid #555; }

        /* ===== FULLSCREEN OVERLAY ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.95);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay.active { display: flex; align-items: center; justify-content: center; }

        /* Nav arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 220;
            font-size: 2.2rem;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            padding: 1rem 0.4rem;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-arrow:active { color: #00d4aa; }
        .nav-left { left: 4px; }
        .nav-right { right: 4px; }

        /* Flip container */
        .flip-wrap {
            width: 85vw;
            max-width: 380px;
            perspective: 1200px;
        }
        .flip-inner {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        .flip-inner.flipped {
            transform: rotateY(180deg);
        }

        /* Both faces */
        .flip-front, .flip-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
        }

        /* ===== FRONT: POSTER ===== */
        .flip-front {
            background: #111;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        .flip-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .flip-front .poster-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 2.5rem 1rem 1rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
        }
        .flip-front .poster-info h2 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.2rem;
        }
        .flip-front .poster-info .poster-director {
            font-size: 0.8rem;
            color: #00d4aa;
            font-weight: 600;
        }
        .flip-front .poster-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
        }
        .flip-front .staff-glow {
            box-shadow: 0 0 20px rgba(220,20,60,0.4);
            border: 2px solid #dc143c;
        }

        /* ===== BACK: DETAILS ===== */
        .flip-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }
        .back-content {
            padding: 1.2rem;
            overflow-y: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .flip-inner.flipped .back-content {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
        }

        /* Back header */
        .back-header {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .back-thumb {
            width: 70px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .back-thumb img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .back-title-area {
            flex: 1;
            min-width: 0;
        }
        .back-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.15rem;
        }
        .back-director {
            font-size: 0.8rem;
            color: #00d4aa;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }
        .back-meta {
            font-size: 0.7rem;
            color: #888;
            line-height: 1.4;
        }
        .back-staff-badge {
            display: inline-block;
            background: #dc143c;
            color: #fff;
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 0.3rem;
            text-transform: uppercase;
        }

        /* Synopsis */
        .back-synopsis {
            font-size: 0.8rem;
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        /* Scores */
        .back-scores {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }
        .score-pill {
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
        a.score-pill:active { opacity: 0.7; }
        .score-rt { background: #FA320A; }
        .score-mc { background: #FFCC34; color: #000 !important; }

        /* Watch buttons */
        .back-watch-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            flex-shrink: 0;
        }
        .watch-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            touch-action: manipulation;
        }
        .watch-btn:active { opacity: 0.7; }
        .watch-btn.svc-amazon { background: #ff9500; }
        .watch-btn.svc-apple { background: #000; border: 1px solid #555; }
        .watch-btn.svc-prime { background: #00A8E1; }
        .watch-btn.svc-netflix { background: #E50914; }
        .watch-btn.svc-hulu { background: #1CE783; color: #000 !important; }
        .watch-btn.svc-mubi { background: #DA2128; }
        .watch-btn.svc-tubi { background: #FA382F; }
        .watch-btn.svc-disney { background: #113CCF; }
        .watch-btn.svc-criterion { background: #000; border: 1px solid #888; }
        .watch-btn.svc-shudder { background: #3d5afe; }
        .watch-btn.svc-default { background: rgba(255,255,255,0.15); }

        /* Link buttons row */
        .back-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.8rem;
            flex-shrink: 0;
        }
        .back-link-btn {
            display: inline-block;
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
        }
        .back-link-btn:active { opacity: 0.7; }
        .link-trailer { background: #00d4aa; color: #000 !important; }
        .link-wiki { background: rgba(255,255,255,0.15); }
        .link-rt { background: #FA320A; }
        .link-mc { background: #FFCC34; color: #000 !important; }

        /* ===== TRAILER MODAL ===== */
        .trailer-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0,0,0,0.97);
        }
        .trailer-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .trailer-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.8rem;
            background: linear-gradient(rgba(0,0,0,0.7), transparent);
            z-index: 2;
        }
        .trailer-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .trailer-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 0.3rem;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }
        .trailer-close:active { color: #fff; }
        .trailer-body {
            position: relative;
            width: 100%;
        }
        .trailer-video-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        @media (orientation: landscape) {
            .trailer-modal.active {
                padding: 0;
            }
            .trailer-body {
                width: 100vw;
                height: 100vh;
            }
            .trailer-video-wrap {
                padding-bottom: 0;
                width: 100%;
                height: 100%;
            }
        }
        .trailer-video-wrap video,
        .trailer-video-wrap iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .trailer-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #888;
            font-size: 0.75rem;
        }
        .trailer-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top-color: #00d4aa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .trailer-error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: #ff6b6b;
            font-size: 0.8rem;
        }
        .trailer-nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 310;
            font-size: 2.2rem;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            padding: 1rem 0.4rem;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .trailer-nav-arrow:active { color: #00d4aa; }
        .trailer-nav-left { left: 4px; }
        .trailer-nav-right { right: 4px; }
        .trailer-hint {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 0; right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 310;
        }

        /* Tap hint */
        .tap-hint {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 0; right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 210;
        }
    </style>
</head>

function resolveWatchClass(svc) {
    const s = svc.toLowerCase();
    if (s.includes('prime')) return 'svc-prime';
    if (s.includes('amazon')) return 'svc-amazon';
    if (s.includes('apple')) return 'svc-apple';
    if (s.includes('netflix')) return 'svc-netflix';
    if (s.includes('hulu')) return 'svc-hulu';
    if (s.includes('mubi')) return 'svc-mubi';
    if (s.includes('tubi')) return 'svc-tubi';
    if (s.includes('disney')) return 'svc-disney';
    if (s.includes('criterion')) return 'svc-criterion';
    if (s.includes('shudder')) return 'svc-shudder';
    return 'svc-default';
}

    if (s.includes('netflix')) return 'Netflix';
    if (s.includes('hulu')) return 'Hulu';
    if (s.includes('mubi')) return 'MUBI';
    if (s.includes('tubi')) return 'Tubi';
    if (s.includes('disney')) return 'Disney+';
    if (s.includes('criterion')) return 'Criterion';
    if (s.includes('shudder')) return 'Shudder';
    return svc;
}

function loadMovie(idx) {
    const m = movies[idx];
    currentIdx = idx;

    // Front
    frontPoster.src = posterHi + m.p + '.jpg';
    frontBadge.textContent = m.sv;
    frontBadge.className = 'poster-badge badge-' + m.b;
    frontTitle.textContent = m.t;
    frontDirector.textContent = m.d;

    if (m.sp) {
        flipFront.classList.add('staff-glow');
    } else {
        flipFront.classList.remove('staff-glow');
    }

    // Back
    backThumb.src = posterBase + m.p + '.jpg';
    backTitle.textContent = m.t;
    backDirector.textContent = m.d;
    const metaParts = [];
    if (m.y) metaParts.push(m.y);
    if (m.r) metaParts.push(m.r + ' min');
    if (m.g.length) metaParts.push(m.g.join(', '));
    backMeta.textContent = metaParts.join(' \u2022 ');
    backStaffBadge.innerHTML = m.sp ? '<span class="back-staff-badge">\u2605 STAFF PICK \u2605</span>' : '';
    backSynopsis.textContent = m.s;

    // Scores — make them links if URL available
    let scoreHtml = '';
    if (m.rt && m.rt !== '0') {
        if (m.rtU) {
            scoreHtml += `<a href="${m.rtU}" target="_blank" rel="noopener" class="score-pill score-rt">\uD83C\uDF45 ${m.rt}</a>`;
        } else {
            scoreHtml += `<span class="score-pill score-rt">\uD83C\uDF45 ${m.rt}</span>`;
        }
    }
    if (m.mc && m.mc !== '0') {
        if (m.mcU) {
            scoreHtml += `<a href="${m.mcU}" target="_blank" rel="noopener" class="score-pill score-mc">MC ${m.mc}</a>`;
        } else {
            scoreHtml += `<span class="score-pill score-mc">MC ${m.mc}</span>`;
        }
    }
    backScores.innerHTML = scoreHtml;
    backScores.style.display = scoreHtml ? 'flex' : 'none';

    // Watch buttons
    let watchHtml = '';
    if (m.w && m.w.length) {
        m.w.forEach(function(ww) {
            const cls = resolveWatchClass(ww.s);
            const label = resolveWatchLabel(ww.s);
            watchHtml += `<a href="${ww.l}" target="_blank" rel="noopener" class="watch-btn ${cls}">${label}</a>`;
        });
    }
    backService.innerHTML = watchHtml ? `<div class="back-watch-row">${watchHtml}</div>` : '';

    // Link buttons (RT/MC handled by score pills above)
    let linksHtml = '';
    if (m.tr) linksHtml += `<button class="back-link-btn link-trailer" type="button">\u25B6 Trailer</button>`;
    if (m.wi) linksHtml += `<a href="${m.wi}" target="_blank" rel="noopener" class="back-link-btn link-wiki">Wiki</a>`;
    backLinks.innerHTML = linksHtml;
}

function openPoster(idx) {
    loadMovie(idx);
    flipInner.classList.remove('flipped');
    overlay.classList.add('active');
    tapHint.textContent = 'TAP TO FLIP  \u2022  SWIPE \u2190 \u2192';
    state = 'poster';
}

function flipToDetails() {
    flipInner.classList.add('flipped');
    tapHint.textContent = 'TAP TO CLOSE  \u2022  SWIPE \u2190 \u2192';
    state = 'details';
}

function closeOverlay() {
    overlay.classList.remove('active');
    flipInner.classList.remove('flipped');
    state = 'grid';
    currentIdx = -1;
}

function navigate(direction) {
    if (currentIdx < 0) return;
    let next = currentIdx + direction;
    if (next < 0) next = movies.length - 1;
    if (next >= movies.length) next = 0;

    // Stay in current view state
    loadMovie(next);
    if (state === 'poster') {
        flipInner.classList.remove('flipped');
    } else if (state === 'details') {
        flipInner.classList.add('flipped');
    }
}

// Arrow taps
navLeft.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    touchHandled = true;
    navigate(-1);
    setTimeout(function() { touchHandled = false; }, 300);
});
navLeft.addEventListener('click', function(e) {
    e.stopPropagation();
    if (touchHandled) return;
    navigate(-1);
});
navRight.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    touchHandled = true;
    navigate(1);
    setTimeout(function() { touchHandled = false; }, 300);
});
navRight.addEventListener('click', function(e) {
    e.stopPropagation();
    if (touchHandled) return;
    navigate(1);
});

// Grid tap -> open poster
wall.addEventListener('touchend', function(e) {
    const item = e.target.closest('.grid-item');
    if (!item) return;
    e.preventDefault();
    touchHandled = true;
    openPoster(parseInt(item.dataset.index));
    setTimeout(function() { touchHandled = false; }, 300);
});
wall.addEventListener('click', function(e) {
    if (touchHandled) return;
    const item = e.target.closest('.grid-item');
    if (!item) return;
    openPoster(parseInt(item.dataset.index));
});

// Overlay: swipe detection + tap to cycle
overlay.addEventListener('touchstart', function(e) {
    if (e.target.closest('.nav-arrow') || e.target.closest('.back-link-btn') || e.target.closest('.score-pill') || e.target.closest('.watch-btn')) return;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swiping = false;
}, { passive: true });

overlay.addEventListener('touchmove', function(e) {
    if (e.target.closest('.nav-arrow') || e.target.closest('.back-link-btn') || e.target.closest('.score-pill') || e.target.closest('.watch-btn')) return;
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
        swiping = true;
    }
}, { passive: true });

overlay.addEventListener('touchend', function(e) {
    if (e.target.closest('.nav-arrow') || e.target.closest('.back-link-btn') || e.target.closest('.score-pill') || e.target.closest('.watch-btn')) return;

    // Check for swipe first
    if (swiping) {
        const dx = e.changedTouches[0].clientX - swipeStartX;
        if (Math.abs(dx) > 50) {
            e.preventDefault();
            touchHandled = true;
            navigate(dx < 0 ? 1 : -1);
            setTimeout(function() { touchHandled = false; }, 300);
            swiping = false;
            return;
        }
    }
    swiping = false;

    // Not a swipe — treat as tap
    if (state === 'details' && e.target.closest('.back-content')) {
        const bc = document.getElementById('backContent');
        if (bc.scrollHeight > bc.clientHeight) return;
    }
    e.preventDefault();
    touchHandled = true;
    if (state === 'poster') flipToDetails();
    else if (state === 'details') closeOverlay();
    setTimeout(function() { touchHandled = false; }, 300);
});

overlay.addEventListener('click', function(e) {
    if (touchHandled) return;
    if (e.target.closest('.nav-arrow') || e.target.closest('.back-link-btn') || e.target.closest('.score-pill') || e.target.closest('.watch-btn')) return;
    if (state === 'poster') flipToDetails();
    else if (state === 'details') closeOverlay();
});

// ===== INLINE TRAILER PLAYER =====
const trailerModal = document.getElementById('trailerModal');
const trailerTitle = document.getElementById('trailerTitle');
const trailerVideoWrap = document.getElementById('trailerVideoWrap');
const trailerClose = document.getElementById('trailerClose');
const trailerNavLeft = document.getElementById('trailerNavLeft');
const trailerNavRight = document.getElementById('trailerNavRight');
const trailerBody = document.getElementById('trailerBody');

let trailerIdx = -1;
let trailerSwipeStartX = 0;
let trailerSwiping = false;

function isHostedTrailer(url) {
    return url && (url.endsWith('.mp4') || url.includes('/file/NRW-TRAILERS/'));
}

function extractYouTubeId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?#]+)/);
    return m ? m[1] : null;
}

function findNextTrailerIdx(fromIdx, direction) {
    const count = movies.length;
    let idx = fromIdx;
    for (let i = 0; i < count - 1; i++) {
        idx = (idx + direction + count) % count;
        if (movies[idx].tr) return idx;
    }
    return -1;
}

function loadTrailer(idx) {
    const m = movies[idx];
    trailerIdx = idx;
    trailerTitle.textContent = m.t;

    // Stop any existing media
    const oldVideo = trailerVideoWrap.querySelector('video');
    if (oldVideo) { oldVideo.pause(); oldVideo.src = ''; }
    const oldIframe = trailerVideoWrap.querySelector('iframe');
    if (oldIframe) { oldIframe.src = ''; }

    if (isHostedTrailer(m.tr)) {
        trailerVideoWrap.innerHTML = `
            <div class="trailer-loading" id="tLoading">
                <div class="trailer-spinner"></div>
                <span>Loading trailer...</span>
            </div>
            <div class="trailer-error" id="tError">Trailer unavailable</div>
            <video id="tVideo" controls playsinline preload="auto" style="background:#000;">
                Your browser does not support video playback.
            </video>
        `;
        const video = document.getElementById('tVideo');
        const loading = document.getElementById('tLoading');
        const error = document.getElementById('tError');
        video.addEventListener('canplay', function() { loading.style.display = 'none'; }, { once: true });
        video.addEventListener('error', function() {
            loading.style.display = 'none';
            error.style.display = 'flex';
        }, { once: true });
        video.addEventListener('ended', function() {
            trailerNav(1);
        }, { once: true });
        // Set src then try to play — mobile Safari needs user gesture
        video.src = m.tr;
        video.play().catch(function() {
            // Autoplay blocked — user can tap play via native controls
            loading.style.display = 'none';
        });
    } else {
        const ytId = extractYouTubeId(m.tr);
        if (ytId) {
            trailerVideoWrap.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&playsinline=1"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            `;
        }
    }

    // Show/hide nav arrows
    trailerNavLeft.style.display = findNextTrailerIdx(idx, -1) >= 0 ? '' : 'none';
    trailerNavRight.style.display = findNextTrailerIdx(idx, 1) >= 0 ? '' : 'none';
}

function trailerNav(direction) {
    const next = findNextTrailerIdx(trailerIdx, direction);
    if (next >= 0) loadTrailer(next);
}

function openTrailer(idx) {
    loadTrailer(idx);
    trailerModal.classList.add('active');
}

function closeTrailer() {
    trailerModal.classList.remove('active');
    const video = trailerVideoWrap.querySelector('video');
    if (video) { video.pause(); video.src = ''; }
    const iframe = trailerVideoWrap.querySelector('iframe');
    if (iframe) { iframe.src = ''; }
    trailerVideoWrap.innerHTML = '';
}

// Make trailer button open inline player instead of new tab
document.addEventListener('click', function(e) {
    const btn = e.target.closest('.back-link-btn.link-trailer');
    if (btn) {
        e.preventDefault();
        e.stopPropagation();
        openTrailer(currentIdx);
    }
});

// Trailer close button
trailerClose.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    closeTrailer();
});
trailerClose.addEventListener('click', function(e) {
    e.stopPropagation();
    closeTrailer();
});

// Trailer nav arrows
trailerNavLeft.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    trailerNav(-1);
});
trailerNavLeft.addEventListener('click', function(e) { e.stopPropagation(); trailerNav(-1); });
trailerNavRight.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    trailerNav(1);
});
trailerNavRight.addEventListener('click', function(e) { e.stopPropagation(); trailerNav(1); });

// Trailer swipe
trailerModal.addEventListener('touchstart', function(e) {
    if (e.target.closest('.trailer-nav-arrow') || e.target.closest('.trailer-close') || e.target.closest('iframe')) return;
    trailerSwipeStartX = e.touches[0].clientX;
    trailerSwiping = false;
}, { passive: true });
trailerModal.addEventListener('touchmove', function(e) {
    if (e.target.closest('.trailer-nav-arrow') || e.target.closest('.trailer-close') || e.target.closest('iframe')) return;
    const dx = e.touches[0].clientX - trailerSwipeStartX;
    if (Math.abs(dx) > 30) trailerSwiping = true;
}, { passive: true });
trailerModal.addEventListener('touchend', function(e) {
    if (e.target.closest('.trailer-nav-arrow') || e.target.closest('.trailer-close') || e.target.closest('iframe')) return;
    if (trailerSwiping) {
        const dx = e.changedTouches[0].clientX - trailerSwipeStartX;
        if (Math.abs(dx) > 50) {
            e.preventDefault();
            trailerNav(dx < 0 ? 1 : -1);
        }
    }
    trailerSwiping = false;
});

// Trailer backdrop click to close
trailerModal.addEventListener('click', function(e) {
    if (e.target === trailerModal) closeTrailer();
});
</script>
