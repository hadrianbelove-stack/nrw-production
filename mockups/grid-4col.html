<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NRW - 4 Column Grid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            background-attachment: fixed;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== HEADER ===== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 1rem 0.5rem;
            text-align: center;
            border-bottom: 1px solid #333;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .site-header h1 {
            font-weight: 100;
            letter-spacing: 0.3em;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #fff, #00d4aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
        }
        .filters-row {
            display: flex;
            gap: 0.35rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 0.3rem;
        }
        .filters-row::-webkit-scrollbar { display: none; }
        .filter-pill {
            flex-shrink: 0;
            padding: 0.25rem 0.6rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 25px;
            font-size: 0.65rem;
        }
        .filter-pill.active {
            background: #00d4aa;
            border-color: #00d4aa;
            color: #000;
            font-weight: 700;
        }

        /* ===== GRID ===== */
        .wall {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px 8px;
            padding: 10px;
        }
        .grid-item {
            touch-action: manipulation;
            cursor: pointer;
        }
        .movie-card {
            aspect-ratio: 2/3;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .movie-title {
            font-size: 0.6rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            margin-top: 5px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .movie-director {
            font-size: 0.5rem;
            color: #00d4aa;
            text-align: center;
            margin-top: 2px;
            font-weight: 600;
        }
        .streaming-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 6.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
        }
        .staff-pick-wrap {
            border: 2px solid #dc143c;
            border-radius: 10px;
            padding: 3px;
            background: rgba(220,20,60,0.05);
            box-shadow: 0 0 12px rgba(220,20,60,0.3);
        }
        .staff-pick-wrap .movie-card { border-radius: 7px; }

        /* ===== SERVICE BADGES ===== */
        .badge-netflix { background: #E50914; }
        .badge-max { background: #B537F2; }
        .badge-prime { background: #00A8E1; }
        .badge-hulu { background: #1CE783; color: #000 !important; }
        .badge-disney { background: #113CCF; }
        .badge-rent { background: #ff9500; }
        .badge-mubi { background: #DA2128; }
        .badge-tubi { background: #FA382F; }
        .badge-criterion { background: #000; border: 0.5px solid #888; }
        .badge-kanopy { background: #1B7A43; }
        .badge-paramount { background: #0064FF; }
        .badge-apple { background: #000; border: 0.5px solid #555; }

        /* ===== FULLSCREEN OVERLAY ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.95);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay.active { display: flex; align-items: center; justify-content: center; }

        /* Flip container */
        .flip-wrap {
            width: 85vw;
            max-width: 380px;
            perspective: 1200px;
        }
        .flip-inner {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        .flip-inner.flipped {
            transform: rotateY(180deg);
        }

        /* Both faces */
        .flip-front, .flip-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
        }

        /* ===== FRONT: POSTER ===== */
        .flip-front {
            background: #111;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        .flip-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .flip-front .poster-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 2.5rem 1rem 1rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
        }
        .flip-front .poster-info h2 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.2rem;
        }
        .flip-front .poster-info .poster-director {
            font-size: 0.8rem;
            color: #00d4aa;
            font-weight: 600;
        }
        .flip-front .poster-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
        }
        .flip-front .staff-glow {
            box-shadow: 0 0 20px rgba(220,20,60,0.4);
            border: 2px solid #dc143c;
        }

        /* ===== BACK: DETAILS ===== */
        .flip-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }
        .back-content {
            padding: 1.2rem;
            overflow-y: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .flip-inner.flipped .back-content {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
        }

        /* Back header */
        .back-header {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .back-thumb {
            width: 70px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .back-thumb img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .back-title-area {
            flex: 1;
            min-width: 0;
        }
        .back-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.15rem;
        }
        .back-director {
            font-size: 0.8rem;
            color: #00d4aa;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }
        .back-meta {
            font-size: 0.7rem;
            color: #888;
            line-height: 1.4;
        }
        .back-staff-badge {
            display: inline-block;
            background: #dc143c;
            color: #fff;
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 0.3rem;
            text-transform: uppercase;
        }

        /* Synopsis */
        .back-synopsis {
            font-size: 0.8rem;
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        /* Scores */
        .back-scores {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }
        .score-pill {
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #fff;
        }
        .score-rt { background: #FA320A; }
        .score-mc { background: #FFCC34; color: #000 !important; }

        /* Service pill */
        .back-service {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .back-service::before {
            content: '▶';
            font-size: 0.5rem;
        }

        /* Tap hint */
        .tap-hint {
            position: absolute;
            bottom: 12px;
            left: 0; right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.1em;
            pointer-events: none;
        }
        .overlay .tap-hint {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            z-index: 210;
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>THE NEW RELEASE WALL</h1>
    <div class="filters-row">
        <span class="filter-pill active">All</span>
        <span class="filter-pill">Big Time</span>
        <span class="filter-pill">Indie</span>
        <span class="filter-pill">Staff Picks</span>
        <span class="filter-pill">Foreign</span>
        <span class="filter-pill">Restorations</span>

    </div>
</header>

<div class="wall" id="wall"></div>

<!-- Fullscreen overlay -->
<div class="overlay" id="overlay">
    <div class="flip-wrap">
        <div class="flip-inner" id="flipInner">
            <div class="flip-front" id="flipFront">
                <img id="frontPoster" src="" alt="">

                <div class="poster-info">

                    <div class="poster-director" id="frontDirector"></div>

            <div class="flip-back" id="flipBack">

                            <div class="back-director" id="backDirector"></div>

                        </div>
                    </div>
                    <div class="back-synopsis" id="backSynopsis"></div>
                    <div class="back-scores" id="backScores"></div>
                    <div id="backService"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="tap-hint" id="tapHint">TAP TO FLIP</div>
</div>

const posterBase = 'https://image.tmdb.org/t/p/w300/';
const posterHi = 'https://image.tmdb.org/t/p/w500/';

// Build grid
const wall = document.getElementById('wall');
movies.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = 'grid-item';
    div.dataset.index = i;
    const cardWrap = m.sp ? `<div class="staff-pick-wrap"><div class="movie-card">` : `<div class="movie-card">`;
    const cardClose = m.sp ? `</div></div>` : `</div>`;
    div.innerHTML = `
        ${cardWrap}
            <span class="streaming-badge badge-${m.b}">${m.sv}</span>
            <img src="${posterBase}${m.p}.jpg" alt="" loading="lazy">
        ${cardClose}
        <div class="movie-title">${m.t}</div>
        <div class="movie-director">${m.d}</div>
    `;
    wall.appendChild(div);
});

// Overlay elements
const overlay = document.getElementById('overlay');
const flipInner = document.getElementById('flipInner');
const frontPoster = document.getElementById('frontPoster');
const frontBadge = document.getElementById('frontBadge');
const frontTitle = document.getElementById('frontTitle');
const frontDirector = document.getElementById('frontDirector');
const backThumb = document.getElementById('backThumb');
const backTitle = document.getElementById('backTitle');
const backDirector = document.getElementById('backDirector');
const backMeta = document.getElementById('backMeta');
const backStaffBadge = document.getElementById('backStaffBadge');
const backSynopsis = document.getElementById('backSynopsis');
const backScores = document.getElementById('backScores');
const backService = document.getElementById('backService');
const tapHint = document.getElementById('tapHint');
const flipFront = document.getElementById('flipFront');

// State: 'grid' | 'poster' | 'details'
let state = 'grid';
let currentMovie = null;
let touchHandled = false;

function openPoster(idx) {
    const m = movies[idx];
    currentMovie = m;

    // Front
    frontPoster.src = posterHi + m.p + '.jpg';
    frontBadge.textContent = m.sv;
    frontBadge.className = 'poster-badge badge-' + m.b;
    frontTitle.textContent = m.t;
    frontDirector.textContent = m.d;

    // Staff pick glow on front
    if (m.sp) {
        flipFront.classList.add('staff-glow');
    } else {
        flipFront.classList.remove('staff-glow');
    }

    // Back
    backThumb.src = posterBase + m.p + '.jpg';
    backTitle.textContent = m.t;
    backDirector.textContent = m.d;
    const metaParts = [];
    if (m.y) metaParts.push(m.y);
    if (m.r) metaParts.push(m.r + ' min');
    if (m.g.length) metaParts.push(m.g.join(', '));
    backMeta.textContent = metaParts.join(' \u2022 ');
    backStaffBadge.innerHTML = m.sp ? '<span class="back-staff-badge">\u2605 STAFF PICK \u2605</span>' : '';
    backSynopsis.textContent = m.s;

    // Scores
    let scoreHtml = '';
    if (m.rt && m.rt !== '0') scoreHtml += `<span class="score-pill score-rt">\ud83c\udf45 ${m.rt}</span>`;
    if (m.mc && m.mc !== '0') scoreHtml += `<span class="score-pill score-mc">MC ${m.mc}</span>`;
    backScores.innerHTML = scoreHtml;
    backScores.style.display = scoreHtml ? 'flex' : 'none';

    // Service
    backService.innerHTML = `<span class="back-service badge-${m.b}">${m.sv}</span>`;

    // Show overlay, reset flip
    flipInner.classList.remove('flipped');
    overlay.classList.add('active');
    tapHint.textContent = 'TAP TO FLIP';
    state = 'poster';
}

function flipToDetails() {
    flipInner.classList.add('flipped');
    tapHint.textContent = 'TAP TO CLOSE';
    state = 'details';
}

function closeOverlay() {
    overlay.classList.remove('active');
    flipInner.classList.remove('flipped');
    state = 'grid';
    currentMovie = null;
}

// Grid tap → open poster
wall.addEventListener('touchend', function(e) {
    const item = e.target.closest('.grid-item');
    if (!item) return;
    e.preventDefault();
    touchHandled = true;
    openPoster(parseInt(item.dataset.index));
    setTimeout(() => { touchHandled = false; }, 300);
});
wall.addEventListener('click', function(e) {
    if (touchHandled) return;
    const item = e.target.closest('.grid-item');
    if (!item) return;
    openPoster(parseInt(item.dataset.index));
});

// Overlay tap → cycle states
overlay.addEventListener('touchend', function(e) {
    // Allow scroll on back content
    if (state === 'details' && e.target.closest('.back-content')) {
        const bc = document.getElementById('backContent');
        if (bc.scrollHeight > bc.clientHeight) return;
    }
    e.preventDefault();
    touchHandled = true;
    if (state === 'poster') flipToDetails();
    else if (state === 'details') closeOverlay();
    setTimeout(() => { touchHandled = false; }, 300);
});
overlay.addEventListener('click', function(e) {
    if (touchHandled) return;
    if (state === 'poster') flipToDetails();
    else if (state === 'details') closeOverlay();
});
</script>

</body>
</html>
