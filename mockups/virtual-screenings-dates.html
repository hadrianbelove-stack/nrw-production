<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRW — Large pill · color combos</title>
<style>
:root{ --accent-primary:#00d4aa; --screening-gold:#FFD700; --screening-glow:rgba(255,215,0,0.3); --screening-subtle:rgba(255,215,0,0.05); }
*{box-sizing:border-box;}
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(160deg,#0a0a0a 0%,#1a1a2e 100%); color:#fff; min-height:100vh; }
.site-header{ text-align:center; padding:2rem 1rem 0.4rem; }
.site-header h1{ font-weight:100; letter-spacing:0.3em; font-size:1.9rem; margin:0;
  background:linear-gradient(45deg,#fff,var(--accent-primary)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.site-header .sub{ color:#888; letter-spacing:0.22em; text-transform:uppercase; font-size:0.7rem; margin-top:0.5rem; }
.legend{ max-width:900px; margin:14px auto 0; color:#9a9ab0; font-size:0.84rem; text-align:center; line-height:1.6; padding:0 1rem;}
.legend b{ color:#ddd; }

#gallery{ max-width:1500px; margin:0 auto; padding:1.5rem 1.5rem 5rem; display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:1.7rem; }
.variation{ border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:14px 14px 18px; background:rgba(255,255,255,0.02); }
.var-label{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.var-label .n{ background:var(--screening-gold); color:#000; font-weight:900; font-size:0.78rem; min-width:24px; height:24px; padding:0 8px; border-radius:12px; display:flex; align-items:center; justify-content:center;}
.var-label .nm{ font-weight:700; font-size:0.98rem; }
.var-desc{ color:#888; font-size:0.72rem; margin:0 0 12px 34px;}
.var-cards{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.movie-container{ display:flex; flex-direction:column; position:relative; min-width:0;
  border:3px solid var(--screening-gold); border-radius:14px; padding:7px; background:var(--screening-subtle); box-shadow:0 0 16px var(--screening-glow); overflow:hidden; }
.fest-above{ width:calc(100% + 14px); margin:-7px -7px 7px -7px; padding:5px 8px; text-align:center;
  font-size:0.6rem; font-weight:900; letter-spacing:0.05em; line-height:1.3; text-transform:uppercase;
  border-radius:11px 11px 0 0; background:#15151f; color:var(--screening-gold); border-bottom:2px solid var(--screening-gold); }
.movie-card{ position:relative; width:100%; aspect-ratio:2/3; }
.card-front{ position:absolute; inset:0; border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.3);
  background:linear-gradient(135deg,#1a1a2e,#0f0f1a); display:flex; align-items:center; justify-content:center;}
.card-front img{ width:100%; height:100%; object-fit:cover; }
.poster-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px;
  background:linear-gradient(135deg,#23233e,#12121f); color:#cfcfe6; font-weight:700; font-size:0.8rem;}
.movie-info{ width:100%; padding:6px 2px 0;}
.movie-title{ font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.movie-meta{ font-size:0.74rem; color:#00d4aa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
.movie-meta .muted{ color:#888;}

/* large pill (style C) — colors set inline per combo */
.pillrow{ text-align:center; margin-top:8px; }
.dC{ display:inline-block; border-radius:22px; padding:6px 16px; font-size:0.92rem; font-weight:900; letter-spacing:0.02em; }
</style>
</head>
<body>

<div class="site-header">
  <h1>THE NEW RELEASE WALL</h1>
  <div class="sub">Large pill · color combinations</div>
</div>
<div class="legend">
  Style C (large pill) in different color schemes. Left card = <b>urgent</b> (1 day left), right card = <b>calm</b> (plenty of time).
  ★ = uses existing NRW palette colors; others are new and would need a quick OK.
</div>

<div id="gallery"></div>

<script>
const URGENT={title:"Best Friends Forever",dir:"K. Mousoulis",genre:"Comedy",country:"GRE",poster:"https://image.tmdb.org/t/p/w500/2lNZYwLljw2WAoYGfK9zQ1cODoy.jpg",fest:"Los Angeles Greek Film Fest"};
const CALM={title:"The Obsessed",dir:"W. Takahashi",genre:"Animation",country:"JPN",poster:"https://image.tmdb.org/t/p/w500/vzNDv1Ts7GzlFJ2pgcMYev3BDCG.jpg",fest:"Chattanooga Film Fest"};
const poster=f=>`<img src="${f.poster}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="poster-fallback" style="display:none">${f.title}</div>`;
const cap=f=>`<div class="movie-info"><div class="movie-title">${f.title}</div><div class="movie-meta">${f.dir} <span class="muted">· ${f.genre} · ${f.country}</span></div></div>`;

// combo: [name, urgentStyle, calmStyle]  — style = {bg, color, border?}
const fill=(bg,color)=>({bg,color});
const out=(color)=>({bg:'transparent',color,border:color});
const COMBOS=[
 ['Red / Gold ★', fill('#ff5252','#fff'), fill('#FFD700','#000')],
 ['Red / Teal ★', fill('#ff5252','#fff'), fill('#00d4aa','#000')],
 ['Crimson / Gold ★', fill('#dc143c','#fff'), fill('#FFD700','#000')],
 ['Orange / Gold ★', fill('#ff9500','#000'), fill('#FFD700','#000')],
 ['Crimson / Teal ★', fill('#dc143c','#fff'), fill('#00d4aa','#000')],
 ['Red / Doc-blue ★', fill('#ff5252','#fff'), fill('#4A90D9','#fff')],
 ['Amber / Gold', fill('#ffab40','#000'), fill('#FFD700','#000')],
 ['Red / Green', fill('#ff5252','#fff'), fill('#2ecc71','#000')],
 ['Red / Gray (quiet calm) ★', fill('#ff5252','#fff'), fill('#888','#fff')],
 ['Hollow red / Hollow gold', out('#ff6b6b'), out('#FFD700')],
 ['Hollow red / Hollow teal', out('#ff6b6b'), out('#00d4aa')],
 ['Gradient red→amber / Gold', {bg:'linear-gradient(90deg,#ffab40,#ff3b3b)',color:'#fff'}, fill('#FFD700','#000')],
];

const pill=(txt,st)=>`<span class="dC" style="background:${st.bg};color:${st.color};${st.border?'border:2px solid '+st.border+';':''}">${txt}</span>`;
function card(f,txt,st){
  return `<div class="movie-container">
    <div class="fest-above">${f.fest}</div>
    <div class="movie-card"><div class="card-front">${poster(f)}</div></div>
    ${cap(f)}
    <div class="pillrow">${pill(txt,st)}</div>
  </div>`;
}
const g=document.getElementById('gallery');
let html='';
COMBOS.forEach((c,i)=>{
  html+=`<div class="variation">
    <div class="var-label"><span class="n">${i+1}</span><span class="nm">${c[0]}</span></div>
    <div class="var-cards">${card(URGENT,'⏳ 1 day left',c[1])}${card(CALM,'Until Jun 28',c[2])}</div>
  </div>`;
});
g.innerHTML=html;
</script>
</body>
</html>
