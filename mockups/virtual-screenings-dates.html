<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRW — VS Card Layout · balancing 3 elements</title>
<style>
:root{
  --accent-primary:#00d4aa;
  --screening-gold:#FFD700; --screening-glow:rgba(255,215,0,0.3); --screening-subtle:rgba(255,215,0,0.05);
  --leaving-red:#ff5252; --gold-deep:#b9952e;
}
*{box-sizing:border-box;}
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(160deg,#0a0a0a 0%,#1a1a2e 100%); color:#fff; min-height:100vh; }
.site-header{ text-align:center; padding:2rem 1rem 0.4rem; }
.site-header h1{ font-weight:100; letter-spacing:0.3em; font-size:1.9rem; margin:0;
  background:linear-gradient(45deg,#fff,var(--accent-primary)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.site-header .sub{ color:#888; letter-spacing:0.22em; text-transform:uppercase; font-size:0.7rem; margin-top:0.5rem; }
.legend{ max-width:900px; margin:14px auto 0; color:#9a9ab0; font-size:0.82rem; text-align:center; line-height:1.7; padding:0 1rem;}
.legend b{ color:#ddd; }
.legend .k1{ color:#FFD700;} .legend .k2{ color:#ff7b7b;} .legend .k3{ color:#00d4aa;}

#gallery{ max-width:1500px; margin:0 auto; padding:1.5rem 1.5rem 5rem; display:grid;
  grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:1.7rem; }
.variation{ border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:14px 14px 18px; background:rgba(255,255,255,0.02); }
.var-label{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.var-label .n{ background:var(--screening-gold); color:#000; font-weight:900; font-size:0.82rem; min-width:26px; height:26px; padding:0 7px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.var-label .nm{ font-weight:700; font-size:1rem; }
.var-desc{ color:#888; font-size:0.74rem; margin:0 0 12px 36px; line-height:1.4;}
.var-cards{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* ---- card shell ---- */
.movie-container{ display:flex; flex-direction:column; position:relative; min-width:0;
  border:3px solid var(--screening-gold); border-radius:14px; padding:7px; background:var(--screening-subtle); box-shadow:0 0 16px var(--screening-glow); }
.movie-card{ position:relative; width:100%; aspect-ratio:2/3; }
.card-front{ position:absolute; inset:0; border-radius:10px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.3);
  background:linear-gradient(135deg,#1a1a2e,#0f0f1a); display:flex; align-items:center; justify-content:center;}
.card-front img{ width:100%; height:100%; object-fit:cover; }
.poster-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px;
  background:linear-gradient(135deg,#23233e,#12121f); color:#cfcfe6; font-weight:700; font-size:0.8rem;}

/* element 3a — festival TOP banner on poster */
.fest-top{ position:absolute; top:0; left:0; right:0; z-index:5; padding:4px 6px; text-align:center;
  font-size:0.58rem; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; line-height:1.25;
  background:rgba(255,215,0,0.94); color:#000; }
/* days-left BOTTOM-of-poster overlay bar (optional) */
.days-bottompost{ position:absolute; bottom:0; left:0; right:0; z-index:5; padding:5px 6px; text-align:center;
  font-size:0.6rem; font-weight:900; letter-spacing:0.05em; text-transform:uppercase; }
.days-bottompost.u{ background:rgba(255,82,82,0.95); color:#fff;} .days-bottompost.n{ background:rgba(255,215,0,0.94); color:#000;}

.movie-info{ width:100%; padding:5px 2px 0;}
.movie-title{ font-weight:700; font-size:0.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.movie-meta{ font-size:0.72rem; color:#00d4aa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
.movie-meta .muted{ color:#888;}

/* element 1 — festival as muted caption text */
.fest-muted{ text-align:center; font-size:0.62rem; color:#c9b86a; letter-spacing:0.04em; text-transform:uppercase; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* element 2 — festival as full-width gold bottom BAR */
.fest-bar{ width:calc(100% + 14px); margin:6px -7px -7px -7px; text-align:center; padding:5px 6px; font-size:0.58rem; font-weight:900;
  letter-spacing:0.06em; line-height:1.3; text-transform:uppercase; border-radius:0 0 11px 11px; background:var(--screening-gold); color:#000;}

/* days-left chip (the pill) in caption */
.pill{ display:inline-block; border-radius:20px; padding:3px 11px; font-size:0.6rem; font-weight:900; letter-spacing:0.05em; text-transform:uppercase; line-height:1.4;}
.pill.u{ background:var(--leaving-red); color:#fff;} .pill.n{ background:var(--screening-gold); color:#000;}
/* days-left as plain colored text */
.days-text{ font-size:0.66rem; font-weight:800; letter-spacing:0.04em; text-transform:uppercase;}
.days-text.u{ color:#ff7b7b;} .days-text.n{ color:var(--screening-gold);}
/* days-left full-width bar */
.days-bar{ width:calc(100% + 14px); margin:6px -7px -7px -7px; text-align:center; padding:5px 6px; font-size:0.6rem; font-weight:900; letter-spacing:0.07em; text-transform:uppercase; border-radius:0 0 11px 11px;}
.days-bar.u{ background:var(--leaving-red); color:#fff;} .days-bar.n{ background:var(--screening-gold); color:#000;}

.center{ text-align:center; margin-top:6px; }
.split-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; }
.split-row .fest-muted{ margin:0; text-align:left; }
.split-row .days-text{ flex:0 0 auto; }
</style>
</head>
<body>

<div class="site-header">
  <h1>THE NEW RELEASE WALL</h1>
  <div class="sub">Virtual Screening · Card Layouts</div>
</div>
<div class="legend">
  Balancing three things on one card: <b class="k3">director / cast</b> · <b class="k2">days left</b> · <b class="k1">festival name</b>.<br>
  Each layout shown <b>urgent</b> (leaving soon) and <b>calm</b> (plenty of time). Festival may live on the poster top; days-left stays off the poster image.
</div>

<div id="gallery"></div>

<script>
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const d=s=>new Date(s+'T12:00:00');
const fmt=s=>{const x=d(s);return MONTHS[x.getMonth()]+' '+x.getDate();};

const URGENT={title:"Best Friends Forever",dir:"K. Mousoulis",genre:"Comedy",country:"GRE",poster:"https://image.tmdb.org/t/p/w500/2lNZYwLljw2WAoYGfK9zQ1cODoy.jpg",fest:"Los Angeles Greek Film Fest",end:"2026-06-20",leavesIn:2};
const CALM={title:"The Obsessed",dir:"W. Takahashi",genre:"Animation",country:"JPN",poster:"https://image.tmdb.org/t/p/w500/vzNDv1Ts7GzlFJ2pgcMYev3BDCG.jpg",fest:"Chattanooga Film Fest",end:"2026-06-28",leavesIn:10};

const poster=f=>`<img src="${f.poster}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="poster-fallback" style="display:none">${f.title}</div>`;
const meta=f=>`<div class="movie-info"><div class="movie-title">${f.title}</div><div class="movie-meta">${f.dir} <span class="muted">· ${f.genre} · ${f.country}</span></div></div>`;
const pill=(f,s)=> s==='u'?`<span class="pill u">⏳ ${f.leavesIn} days left</span>`:`<span class="pill n">Until ${fmt(f.end)}</span>`;
const daysText=(f,s)=> s==='u'?`<span class="days-text u">⏳ ${f.leavesIn} days left</span>`:`<span class="days-text n">Until ${fmt(f.end)}</span>`;

// LAYOUTS: each returns full card HTML for film f, state s
const LAYOUTS = {
 1:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front"><div class="fest-top">${f.fest}</div>${poster(f)}</div></div>
    ${meta(f)}<div class="center">${pill(f,s)}</div></div>`,

 2:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front">${poster(f)}</div></div>
    ${meta(f)}<div class="fest-muted">${f.fest}</div><div class="center">${pill(f,s)}</div></div>`,

 3:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front">${poster(f)}</div></div>
    ${meta(f)}<div class="split-row"><div class="fest-muted">${f.fest}</div>${daysText(f,s)}</div></div>`,

 4:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front"><div class="fest-top">${f.fest}</div>${poster(f)}</div></div>
    ${meta(f)}<div class="days-bar ${s}">${s==='u'?'⏳ '+f.leavesIn+' days left':'Until '+fmt(f.end)}</div></div>`,

 5:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front">${poster(f)}</div></div>
    ${meta(f)}<div class="center" style="margin-top:5px">${pill(f,s)}</div><div class="fest-bar">${f.fest}</div></div>`,

 6:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front"><div class="fest-top">${f.fest}</div>${poster(f)}</div></div>
    ${meta(f)}<div class="center" style="margin-top:5px">${daysText(f,s)}</div></div>`,

 7:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front"><div class="fest-top">${f.fest}</div>${poster(f)}<div class="days-bottompost ${s}">${s==='u'?'⏳ '+f.leavesIn+' days left':'Until '+fmt(f.end)}</div></div></div>
    ${meta(f)}</div>`,

 8:(f,s)=>`<div class="movie-container"><div class="movie-card"><div class="card-front">${poster(f)}</div></div>
    ${meta(f)}<div class="fest-muted">${f.fest}</div><div class="days-bar ${s}">${s==='u'?'⏳ '+f.leavesIn+' days left':'Until '+fmt(f.end)}</div></div>`,
};

const NAMES={
 1:['Fest on top · pill below','Festival banners the poster top; days-left pill in the caption. Cleanest separation.'],
 2:['Full caption stack','Everything below poster: title, director, festival (muted), then pill.'],
 3:['Split line','Director line, then festival left + days-left right on one shared row.'],
 4:['Fest top · days bar bottom','Festival banner on poster; days-left becomes a full-width bar (turns red when urgent).'],
 5:['Pill in caption · fest bar','Days-left pill sits above a gold festival bottom-bar.'],
 6:['Fest top · days text','Festival on poster; days-left as plain colored text (no chip) — quietest.'],
 7:['Both on poster','Festival top banner + days-left bottom-of-poster strip; caption is just director.'],
 8:['Fest muted · days bar','Festival as muted caption text; days-left as the bold bottom bar.'],
};

const g=document.getElementById('gallery');
let html='';
for(let i=1;i<=8;i++){
  html += `<div class="variation">
    <div class="var-label"><span class="n">${i}</span><span class="nm">${NAMES[i][0]}</span></div>
    <div class="var-desc">${NAMES[i][1]}</div>
    <div class="var-cards">${LAYOUTS[i](URGENT,'u')}${LAYOUTS[i](CALM,'n')}</div>
  </div>`;
}
g.innerHTML=html;
</script>
</body>
</html>
