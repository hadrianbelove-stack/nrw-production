<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Filter Descriptions — Phone Preview</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-mid: #1a1a2e;
            --accent: #00d4aa;
            --text-primary: #ffffff;
            --text-secondary: #bbb;
            --text-muted: #888;
            --border-subtle: rgba(255,255,255,0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ====== DESIGN PICKER (top bar) ====== */
        .picker {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 200;
            background: #111;
            padding: 10px 12px;
            border-bottom: 1px solid #333;
        }
        .picker-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .picker-tabs {
            display: flex;
            gap: 6px;
        }
        .picker-tab {
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #444;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            font-family: inherit;
        }
        .picker-tab.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* ====== PHONE FRAME ====== */
        .phone-frame {
            margin: 70px auto 30px;
            width: 375px;
            max-width: 100vw;
            height: calc(100vh - 90px);
            background: var(--bg-dark);
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* If on actual phone, fill screen */
        @media (max-width: 420px) {
            .phone-frame {
                width: 100vw;
                height: calc(100vh - 70px);
                border-radius: 0;
            }
        }

        /* ====== PINNED HEADER ====== */
        .nrw-header {
            flex-shrink: 0;
            background: var(--bg-dark);
            padding: 10px 12px 8px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .nrw-header h1 {
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .pill-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .pill-row::-webkit-scrollbar { display: none; }

        .pill {
            flex-shrink: 0;
            padding: 5px 12px;
            border-radius: 25px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .pill.active {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            font-weight: 600;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }
        .search-row input {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 5px 12px;
            color: var(--text-primary);
            font-size: 0.7rem;
            font-family: inherit;
            outline: none;
        }
        .view-dots {
            display: flex;
            gap: 6px;
        }
        .view-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: none;
            background: #555;
            cursor: default;
        }
        .view-dot:first-child {
            background: var(--accent);
        }

        /* ====== DESCRIPTION AREA ====== */
        .desc-area {
            flex-shrink: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            max-height: 0;
            opacity: 0;
        }
        .desc-area.visible {
            max-height: 200px;
            opacity: 1;
        }

        /* Design A: Banner */
        .desc-a {
            background: rgba(0, 212, 170, 0.08);
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 8px 10px 4px;
            border-radius: 0 8px 8px 0;
        }
        .desc-a .dt { font-size: 0.65rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; }
        .desc-a .dd { font-size: 0.7rem; color: var(--text-secondary); line-height: 1.4; }

        /* Design B: Card */
        .desc-b {
            background: var(--bg-mid);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 10px 12px;
            margin: 8px 10px 4px;
        }
        .desc-b .dt { font-size: 0.65rem; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
        .desc-b .dd { font-size: 0.7rem; color: var(--text-muted); line-height: 1.4; }

        /* Design C: Minimal + bar */
        .desc-c {
            border-left: 3px solid var(--accent);
            padding: 6px 12px;
            margin: 8px 10px 4px;
        }
        .desc-c .dd { font-size: 0.68rem; color: var(--text-muted); font-style: italic; line-height: 1.35; }

        /* Design D: Collapsed */
        .desc-d {
            background: rgba(0, 212, 170, 0.06);
            border-radius: 8px;
            margin: 8px 10px 4px;
            overflow: hidden;
        }
        .desc-d-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 12px;
            cursor: pointer;
        }
        .desc-d-head .dt { font-size: 0.65rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
        .desc-d-head .chevron { font-size: 0.75rem; color: var(--accent); transition: transform 0.2s; }
        .desc-d-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .desc-d.open .desc-d-body { max-height: 150px; }
        .desc-d.open .chevron { transform: rotate(180deg); }
        .desc-d-body .dd { font-size: 0.7rem; color: var(--text-secondary); line-height: 1.4; padding: 0 12px 8px; }

        /* Design E: Tooltip */
        .desc-e {
            position: relative;
            background: var(--bg-mid);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 8px 12px;
            margin: 8px 10px 4px;
        }
        .desc-e::before {
            content: '';
            position: absolute;
            top: -5px; left: 18px;
            width: 8px; height: 8px;
            background: var(--bg-mid);
            border-left: 1px solid var(--accent);
            border-top: 1px solid var(--accent);
            transform: rotate(45deg);
        }
        .desc-e .dd { font-size: 0.7rem; color: var(--text-secondary); line-height: 1.4; }

        /* ====== SCROLLABLE GRID ====== */
        .grid-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 6px;
        }

        .poster-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        .poster {
            aspect-ratio: 2/3;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Date divider card */
        .date-card {
            aspect-ratio: 2/3;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .date-bar {
            background: var(--accent);
            padding: 3px 0;
            text-align: center;
            font-size: 0.5rem;
            font-weight: 800;
            color: var(--bg-dark);
            letter-spacing: 1px;
        }
        .date-body {
            flex: 1;
            background: linear-gradient(180deg, rgba(0,212,170,0.15), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }
        .date-num { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); }
        .date-mon { font-size: 0.5rem; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; }
        .date-chevs { font-size: 0.6rem; color: var(--accent); opacity: 0.4; letter-spacing: 2px; }

        /* Design note at bottom */
        .design-note {
            padding: 8px 12px;
            text-align: center;
            font-size: 0.6rem;
            color: #555;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="picker">
    <div class="picker-label">Filter Description Style</div>
    <div class="picker-tabs">
        <button class="picker-tab active" data-design="a">A: Banner</button>
        <button class="picker-tab" data-design="b">B: Card</button>
        <button class="picker-tab" data-design="c">C: Bar+Minimal</button>
        <button class="picker-tab" data-design="d">D: Collapsed</button>
        <button class="picker-tab" data-design="e">E: Tooltip</button>
    </div>
</div>

<div class="phone-frame" id="phone">
    <!-- Pinned Header -->
    <div class="nrw-header">
        <h1>THE NEW RELEASE WALL</h1>
        <div class="pill-row" id="pill-row">
            <button class="pill active" data-filter="all">All</button>
            <button class="pill" data-filter="pre-orders">Pre-Orders</button>
            <button class="pill" data-filter="studio">Studio</button>
            <button class="pill" data-filter="indie">Indie</button>
            <button class="pill" data-filter="staff-picks">Staff Picks</button>
            <button class="pill" data-filter="foreign">Foreign</button>
            <button class="pill" data-filter="series">Limited Series</button>
            <button class="pill" data-filter="documentary">Documentary</button>
            <button class="pill" data-filter="virtual-screenings">Virtual Screenings</button>
        </div>
        <div class="search-row">
            <input type="text" placeholder="Search..." disabled>
            <div class="view-dots">
                <div class="view-dot"></div>
                <div class="view-dot"></div>
                <div class="view-dot"></div>
            </div>
        </div>
    </div>

    <!-- Description (injected by JS based on active design) -->
    <div class="desc-area" id="desc-area"></div>

    <!-- Scrollable Grid -->
    <div class="grid-area" id="grid-area"></div>

    <div class="design-note" id="design-note"></div>
</div>

<script>
const FILTERS = {
    'pre-orders': {
        title: 'Pre-Orders',
        text: 'Coming soon. These movies have confirmed digital release dates and are available to pre-order now.'
    },
    'studio': {
        title: 'Studio',
        text: "The wide releases, the studio fare, the main-streamers. Not saying they're good, not saying they're bad, but these are the movies that have either entered or tried to enter the mainstream conversation."
    },
    'indie': {
        title: 'Indie',
        text: "The smaller films, the independents, the ones without a billboard campaign. These movies flew under the radar theatrically but are worth knowing about now that they're available to stream at home."
    },
    'staff-picks': {
        title: 'Staff Picks',
        text: "The ones we're vouching for. Out of everything on the wall, these are the movies we think are genuinely worth your time. Not a popularity contest, just honest recommendations."
    },
    'foreign': {
        title: 'Foreign',
        text: "Non-English language films from around the world. Some are massive in their home countries, some are intimate art-house pieces."
    },
    'series': {
        title: 'Limited Series',
        text: "Not movies \u2014 limited series. The kind you can finish in a weekend. Prestige mini-series and limited runs that deserve the same attention as a good film."
    },
    'documentary': {
        title: 'Documentary',
        text: "Non-fiction filmmaking. Documentaries covering real stories, real people, and real events \u2014 now available to stream at home."
    },
    'virtual-screenings': {
        title: 'Virtual Screenings',
        text: "Currently playing at film festivals. These aren't streaming yet \u2014 they're in theaters, at festivals, or doing the circuit."
    }
};

const NOTES = {
    a: 'Teal left border, title + text. Clear and branded.',
    b: 'Rounded card, muted text. Blends with dark UI.',
    c: 'Teal left bar + italic muted text. No title, no background.',
    d: 'Collapsed bar \u2014 tap to reveal text. Least intrusive.',
    e: 'Speech-bubble with teal border pointing at pills.'
};

// Sample poster URLs from TMDB (placeholder approach — gray rectangles with subtle variation)
const POSTER_COLORS = [
    '#1a1a2e','#16213e','#1f1f38','#1b1b30','#212140',
    '#1e1e3a','#1a1a35','#19192f','#1c1c3c','#1d1d33',
    '#181838','#1a1a3e','#15152e','#1b1b36','#1f1f40',
    '#1a1a30','#1c1c2e','#181830','#171730','#191938'
];

let currentDesign = 'a';
let activeFilter = null;

function buildGrid() {
    const grid = document.getElementById('grid-area');
    let html = '<div class="poster-grid">';

    // Date divider + 4 posters, repeated
    const dates = [
        { day: 'TUE', num: '6', mon: 'MAY' },
        { day: 'FRI', num: '2', mon: 'MAY' },
        { day: 'TUE', num: '29', mon: 'APR' },
        { day: 'FRI', num: '25', mon: 'APR' },
        { day: 'TUE', num: '22', mon: 'APR' },
    ];

    let posterIdx = 0;
    dates.forEach(d => {
        html += '<div class="date-card">' +
            '<div class="date-bar">' + d.day + '</div>' +
            '<div class="date-body">' +
            '<div class="date-num">' + d.num + '</div>' +
            '<div class="date-mon">' + d.mon + '</div>' +
            '<div class="date-chevs">\u203A\u203A\u203A\u203A\u203A</div>' +
            '</div></div>';

        const count = 3 + Math.floor(Math.random() * 5);
        for (let i = 0; i < count; i++) {
            const c = POSTER_COLORS[(posterIdx++) % POSTER_COLORS.length];
            html += '<div class="poster" style="background:' + c + '"></div>';
        }
    });

    html += '</div>';
    grid.innerHTML = html;
}

function renderDesc(filterKey) {
    const area = document.getElementById('desc-area');
    const f = FILTERS[filterKey];
    if (!f) {
        area.classList.remove('visible');
        area.innerHTML = '';
        return;
    }

    let inner = '';
    switch (currentDesign) {
        case 'a':
            inner = '<div class="desc-a"><div class="dt">' + f.title + '</div><div class="dd">' + f.text + '</div></div>';
            break;
        case 'b':
            inner = '<div class="desc-b"><div class="dt">' + f.title + '</div><div class="dd">' + f.text + '</div></div>';
            break;
        case 'c':
            inner = '<div class="desc-c"><div class="dd">' + f.text + '</div></div>';
            break;
        case 'd':
            inner = '<div class="desc-d" id="desc-d-el">' +
                '<div class="desc-d-head" onclick="document.getElementById(\'desc-d-el\').classList.toggle(\'open\')">' +
                '<span class="dt">' + f.title + ' \u2014 what\'s this?</span>' +
                '<span class="chevron">\u25BE</span></div>' +
                '<div class="desc-d-body"><div class="dd">' + f.text + '</div></div></div>';
            break;
        case 'e':
            inner = '<div class="desc-e"><div class="dd">' + f.text + '</div></div>';
            break;
    }

    area.innerHTML = inner;
    area.classList.add('visible');
}

function updateNote() {
    document.getElementById('design-note').textContent = NOTES[currentDesign] || '';
}

// Pills — interactive
document.getElementById('pill-row').addEventListener('click', (e) => {
    const pill = e.target.closest('.pill');
    if (!pill) return;

    const filter = pill.dataset.filter;
    const pills = document.querySelectorAll('.pill');
    const allPill = document.querySelector('.pill[data-filter="all"]');

    if (filter === 'all') {
        activeFilter = null;
        pills.forEach(p => p.classList.remove('active'));
        allPill.classList.add('active');
        renderDesc(null);
    } else {
        if (activeFilter === filter) {
            // Deselect — back to All
            activeFilter = null;
            pills.forEach(p => p.classList.remove('active'));
            allPill.classList.add('active');
            renderDesc(null);
        } else {
            activeFilter = filter;
            pills.forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            renderDesc(filter);
        }
    }
});

// Design tabs
document.querySelectorAll('.picker-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.picker-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentDesign = tab.dataset.design;
        if (activeFilter) renderDesc(activeFilter);
        updateNote();
    });
});

// Init
buildGrid();
updateNote();
</script>

</body>
</html>
