<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NRW Mockup — 10 Sticky Date Banners</title>
<style>
:root {
    --accent: #00d4aa;
    --crimson: #dc143c;
    --preorder: #7c3aed;
    --fest: #f59e0b;
    --hdr: 46px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
body { background: linear-gradient(160deg, #0a0a0a 0%, #1a1a2e 100%);
    min-height: 100vh; padding-bottom: 150px; }

.m-header { padding: 12px; position: sticky; top: 0; z-index: 50; height: var(--hdr);
    background: rgba(10,10,10,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06); text-align: center; }
.m-title { font-size: 0.95rem; font-weight: 100; letter-spacing: 0.28em; }
.m-title b { font-weight: 700; color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; padding: 8px; }
.cell { aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; background: #15151f; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ===== shared sticky behavior ===== */
.strip {
    grid-column: 1 / -1;
    position: sticky;
    top: var(--hdr);
    z-index: 20;
    margin-top: 8px;
    display: flex;
    align-items: center;
}
.s-day, .s-rest { text-transform: uppercase; }
.s-chip { display: none; }

/* ============ 1 · GLOW SPINE (the original D) ============ */
body[data-s="1"] .strip {
    gap: 10px; background: rgba(10,10,12,0.88); backdrop-filter: blur(10px);
    border-radius: 8px; padding: 8px 12px;
    border-left: 4px solid var(--sc);
    box-shadow: 0 0 18px color-mix(in srgb, var(--sc) 30%, transparent);
}
body[data-s="1"] .s-day { font-size: 0.95rem; font-weight: 900; letter-spacing: 0.12em; color: var(--sc); }
body[data-s="1"] .s-rest { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.12em; color: #fff; }
body[data-s="1"] .s-line { flex: 1; height: 1px; background: color-mix(in srgb, var(--sc) 40%, transparent); }

/* ============ 2 · SOLID FILL ============ */
body[data-s="2"] .strip {
    gap: 8px; background: var(--sc); border-radius: 8px; padding: 8px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
body[data-s="2"] .s-day { font-size: 0.95rem; font-weight: 900; letter-spacing: 0.1em; color: #000; }
body[data-s="2"] .s-rest { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; color: rgba(0,0,0,0.65); }
body[data-s="2"] .s-line { display: none; }

/* ============ 3 · THICK UNDERLINE ============ */
body[data-s="3"] .strip {
    gap: 10px; background: rgba(10,10,12,0.92); backdrop-filter: blur(10px);
    padding: 8px 4px 6px; border-bottom: 4px solid var(--sc);
}
body[data-s="3"] .s-day { font-size: 1.05rem; font-weight: 900; letter-spacing: 0.1em; color: #fff; }
body[data-s="3"] .s-rest { font-size: 1.05rem; font-weight: 300; letter-spacing: 0.1em; color: var(--sc); }
body[data-s="3"] .s-line { display: none; }

/* ============ 4 · FLOATING PILL ============ */
body[data-s="4"] .strip { justify-content: center; background: transparent; }
body[data-s="4"] .s-wrap {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(12,12,16,0.92); backdrop-filter: blur(12px);
    border: 1.5px solid var(--sc); border-radius: 999px; padding: 7px 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
}
body[data-s="4"] .s-day { font-size: 0.8rem; font-weight: 900; letter-spacing: 0.12em; color: var(--sc); }
body[data-s="4"] .s-rest { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; color: #fff; }
body[data-s="4"] .s-line { display: none; }

/* ============ 5 · TICKET STUB ============ */
body[data-s="5"] .strip {
    background: rgba(10,10,12,0.9); backdrop-filter: blur(10px);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
}
body[data-s="5"] .s-day {
    background: var(--sc); color: #000; font-size: 0.85rem; font-weight: 900;
    letter-spacing: 0.1em; padding: 9px 14px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%);
    padding-right: 22px;
}
body[data-s="5"] .s-rest { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: #fff; padding: 0 12px; }
body[data-s="5"] .s-line { flex: 1; }

/* ============ 6 · GRADIENT FADE ============ */
body[data-s="6"] .strip {
    gap: 8px; padding: 9px 14px; border-radius: 8px;
    background: linear-gradient(90deg, var(--sc) 0%, color-mix(in srgb, var(--sc) 35%, transparent) 55%, transparent 100%);
}
body[data-s="6"] .s-day { font-size: 0.95rem; font-weight: 900; letter-spacing: 0.1em; color: #000; }
body[data-s="6"] .s-rest { font-size: 0.9rem; font-weight: 800; letter-spacing: 0.12em; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
body[data-s="6"] .s-line { display: none; }

/* ============ 7 · OUTLINE BOX ============ */
body[data-s="7"] .strip {
    justify-content: center; gap: 10px;
    background: rgba(10,10,12,0.85); backdrop-filter: blur(10px);
    border: 2px solid var(--sc); border-radius: 6px; padding: 8px 10px;
}
body[data-s="7"] .s-day { font-size: 0.85rem; font-weight: 900; letter-spacing: 0.22em; color: var(--sc); }
body[data-s="7"] .s-rest { font-size: 0.85rem; font-weight: 400; letter-spacing: 0.22em; color: #fff; }
body[data-s="7"] .s-line { display: none; }

/* ============ 8 · MEGA TYPE ============ */
body[data-s="8"] .strip {
    gap: 12px; align-items: baseline;
    background: rgba(10,10,12,0.92); backdrop-filter: blur(12px);
    padding: 4px 10px 6px; border-radius: 8px;
}
body[data-s="8"] .s-day { font-size: 1.7rem; font-weight: 900; letter-spacing: 0.02em; color: var(--sc); }
body[data-s="8"] .s-rest { font-size: 1.1rem; font-weight: 200; letter-spacing: 0.18em; color: #fff; }
body[data-s="8"] .s-line { flex: 1; height: 1px; background: rgba(255,255,255,0.15); align-self: center; }

/* ============ 9 · BOOKENDS ============ */
body[data-s="9"] .strip {
    gap: 10px; background: rgba(10,10,12,0.9); backdrop-filter: blur(10px);
    border-radius: 8px; padding: 7px 10px;
}
body[data-s="9"] .s-rest { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.12em; color: #fff; }
body[data-s="9"] .s-line { flex: 1; height: 1px; background: rgba(255,255,255,0.12); }
body[data-s="9"] .s-day {
    background: var(--sc); color: #000; font-size: 0.7rem; font-weight: 900;
    letter-spacing: 0.1em; padding: 4px 10px; border-radius: 5px;
}

/* ============ 10 · NEON EDGE ============ */
body[data-s="10"] .strip {
    justify-content: center; gap: 10px;
    background: rgba(8,8,12,0.94);
    border-top: 1.5px solid var(--sc); border-bottom: 1.5px solid var(--sc);
    padding: 8px 10px;
    box-shadow: 0 0 22px color-mix(in srgb, var(--sc) 45%, transparent),
                inset 0 0 14px color-mix(in srgb, var(--sc) 18%, transparent);
}
body[data-s="10"] .s-day { font-size: 0.9rem; font-weight: 900; letter-spacing: 0.3em; color: var(--sc);
    text-shadow: 0 0 8px var(--sc); }
body[data-s="10"] .s-rest { font-size: 0.9rem; font-weight: 300; letter-spacing: 0.3em; color: #fff; }
body[data-s="10"] .s-line { display: none; }

/* ============ CONTROL BAR ============ */
.ctrl-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(18,18,24,0.97); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.14); padding: 10px 10px 24px; }
.ctrl-tag { font-size: 0.5rem; font-weight: 800; letter-spacing: 0.18em; color: #888;
    text-align: center; margin-bottom: 7px; }
.seg { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex-shrink: 0; min-width: 44px; border: none; background: #26262e; color: #bbb;
    font-size: 0.72rem; font-weight: 800; padding: 10px 0; border-radius: 8px;
    -webkit-tap-highlight-color: transparent; }
.seg button.on { background: var(--accent); color: #000; }
.ctrl-desc { text-align: center; font-size: 0.62rem; color: #999; margin-top: 8px; min-height: 26px; padding: 0 8px; }
</style>
</head>
<body data-s="1">

<header class="m-header"><div class="m-title">NEW RELEASE <b>WALL</b></div></header>
<div class="grid" id="grid"></div>

<div class="ctrl-bar">
    <div class="ctrl-tag">STICKY DATE BANNER — 10 DESIGNS · SCROLL TO FEEL THE STICK</div>
    <div class="seg" id="seg"></div>
    <div class="ctrl-desc" id="desc"></div>
</div>

<script>
const MOVIES = [
 {d:"2026-06-11",p:"80vJ5kBWfpThzsggWWU7LBVyJQ9.jpg"},
 {d:"2026-06-11",p:"dH32lHEdcEeKfperjPbx8U7SqyL.jpg"},
 {d:"2026-06-11",p:"3cYDmDWNWIjVMFbTlDQXjhydT6e.jpg"},
 {d:"2026-06-10",p:"wIubCZKpnTiQmlC5DehgU1LNFip.jpg"},
 {d:"2026-06-10",p:"v6fvzTRikUp9ry5OyoTmUIon5rh.jpg"},
 {d:"2026-06-10",p:"dHnCH7HoVE7MBwc2lvgbSM3jXg7.jpg"},
 {d:"2026-06-10",p:"p03nyFzLERXEeE7MfBsCzBVb266.jpg"},
 {d:"2026-06-10",p:"qlbeEWHs2np97vmvMAifjJYyLFP.jpg"},
 {d:"2026-06-09",p:"kZgzZsVgNruGRWKzTbAIfvvrvHJ.jpg"},
 {d:"2026-06-09",p:"iQBNEmJxNUhrzmom9DRhyJTWyGn.jpg"},
 {d:"2026-06-09",p:"gMV5eCyaq6eSq32rQbhIvcxvpM4.jpg"},
 {d:"2026-06-09",p:"81xUChgVphBFehihIgbXbyneZXP.jpg"},
 {d:"2026-06-09",p:"aoqxusBlbwShgKcfrlgUb9q6Rqo.jpg"},
 {d:"2026-06-09",p:"Awnun4US4M5x36qruNtaRA7G5uw.jpg"},
 {d:"2026-06-09",p:"8N2VubStoAfrkqE0RtnhDcFTqhw.jpg"},
 {d:"2026-06-09",p:"lHWo5q8WipfW8yLSpT8yAGz2mWp.jpg"},
 {d:"2026-06-09",p:"zm0KAbOjlt9eR5y7vDiL2dEOwMl.jpg"},
 {d:"2026-06-08",p:"aQZ4OxzaYTN7cRN7fALi9BhPucp.jpg"},
 {d:"2026-06-08",p:"yZqhFJDenLfgF1VygOOCNmAdS1P.jpg"},
 {d:"2026-06-08",p:"3zkUfnHzz5LraC6rOXybUABK93T.jpg"},
 {d:"2026-06-07",p:"fx7NrOJJdsFS91uDJqoVc0vccwd.jpg"},
 {d:"2026-06-07",p:"ihpFaQo5wRfzyTlq43qtYqZyvKZ.jpg"},
 {d:"2026-06-07",p:"sda3XXtz6iXFlbvBmCNCWnqO1uB.jpg"},
 {d:"2026-06-06",p:"wpmPcKbBfSuiUAxzhvMp679JdkW.jpg"},
 {d:"2026-06-06",p:"dDd0xRF3z0D10votwIx0W4IqKEe.jpg"},
 {d:"2026-06-06",p:"3vCdqenXoOdNFHgr16VOJwBCJwS.jpg"},
];
const FEST = [
 {p:"klheiHrCGwNNooVvYTJCFYMzmrI.jpg"}, {p:"VbYDDEw7RPdATftVrAboA0iuP.jpg"}, {p:"kmEWAP6sda66Sm78lGs84PDjXGC.jpg"},
];
const PRE = [
 {p:"dU46ROG7HoP7biPtntaMTjkGbU6.jpg"}, {p:"uN0psnESvA9X6TnmQHKG78YKe4e.jpg"}, {p:"hDzllxB1TQ7uUxVvjnGHirJJovt.jpg"},
];
const IMG = 'https://image.tmdb.org/t/p/w500/';

const DESCS = {
  1: 'Glow spine — glass bar, colored left edge, soft glow. (The original sticky.)',
  2: 'Solid fill — the whole banner is the strip color, dark text. Maximum punch.',
  3: 'Thick underline — glass bar with a heavy colored rule under bold type.',
  4: 'Floating pill — centered lozenge with colored outline, hovers over the wall.',
  5: 'Ticket stub — solid date tab with arrow notch, glass body. Two-tone.',
  6: 'Gradient fade — color pours in from the left and dissolves across the bar.',
  7: 'Outline box — full-width colored frame, airy letterspaced text, centered.',
  8: 'Mega type — oversized day name in color, thin date beside it. Typographic.',
  9: 'Bookends — date text left, solid weekday chip pinned to the right end.',
  10: 'Neon edge — synthwave: glowing top/bottom borders, haloed letterspaced text.',
};

function stripHtml(kind, dateStr) {
  let color, day = '', rest = '';
  if (kind === 'fest') { color = 'var(--fest)'; day = 'FEST'; rest = 'NOW SCREENING'; }
  else if (kind === 'pre') { color = 'var(--preorder)'; day = 'PRE-ORDER'; rest = 'COMING SOON'; }
  else {
    const d = new Date(dateStr + 'T12:00:00');
    color = 'var(--accent)';
    day = d.toLocaleDateString('en', {weekday: 'short'});
    rest = d.toLocaleDateString('en', {month: 'short'}) + ' ' + d.getDate();
  }
  return `<div class="strip" style="--sc:${color}">
    <span class="s-wrap" style="display:contents">
      <span class="s-day">${day}</span>
      <span class="s-rest">${rest}</span>
    </span>
    <span class="s-line"></span>
  </div>`;
}

let html = '';
html += stripHtml('fest');
FEST.forEach(m => html += `<div class="cell"><img loading="lazy" src="${IMG + m.p}"></div>`);
let last = '';
MOVIES.forEach(m => {
  if (m.d !== last) { html += stripHtml('date', m.d); last = m.d; }
  html += `<div class="cell"><img loading="lazy" src="${IMG + m.p}"></div>`;
});
html += stripHtml('pre');
PRE.forEach(m => html += `<div class="cell"><img loading="lazy" src="${IMG + m.p}"></div>`);
document.getElementById('grid').innerHTML = html;

// Option 4 needs a real wrapper for the pill — flip display:contents off there
const seg = document.getElementById('seg');
const desc = document.getElementById('desc');
for (let i = 1; i <= 10; i++) {
  const b = document.createElement('button');
  b.textContent = i;
  b.dataset.s = i;
  if (i === 1) b.classList.add('on');
  seg.appendChild(b);
}
function applyStyle(s) {
  document.body.dataset.s = s;
  desc.textContent = s + ' · ' + DESCS[s];
  // pill option needs grouped wrapper
  document.querySelectorAll('.s-wrap').forEach(w => {
    w.style.display = (s === '4') ? 'inline-flex' : 'contents';
  });
}
seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  applyStyle(b.dataset.s);
});
applyStyle('1');
</script>
</body>
</html>
