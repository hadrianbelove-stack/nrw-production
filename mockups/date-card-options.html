<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NRW — Date Card Design Options</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #0a0a0a;
    --bg-mid: #1a1a2e;
    --accent: #00d4aa;
    --text-primary: #ffffff;
    --text-secondary: #bbb;
    --text-muted: #888;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  html {
    background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 100%);
    background-attachment: fixed;
  }
  body {
    color: var(--text-primary);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    padding: 0 0 60px;
  }

  .page-header {
    text-align: center;
    padding: 14px 10px 10px;
    border-bottom: 1px solid #333;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .page-header h1 {
    font-weight: 100;
    letter-spacing: 0.2em;
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .page-header .sub {
    font-size: 0.6rem;
    color: var(--text-muted);
  }

  .option-section {
    padding: 12px 0 0;
  }
  .option-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 8px 6px;
  }
  .option-num {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--accent);
    min-width: 24px;
  }
  .option-name {
    font-size: 0.7rem;
    color: #fff;
    font-weight: 600;
  }
  .option-desc {
    font-size: 0.55rem;
    color: var(--text-muted);
    padding: 0 8px 6px;
  }

  /* The grid — matches real NRW mobile */
  .wall-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 0 4px;
    max-width: 440px;
    margin: 0 auto;
  }

  .poster-cell {
    aspect-ratio: 2/3;
    border-radius: 4px;
    overflow: hidden;
  }
  .poster-cell img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Section divider */
  .section-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    margin: 16px 0 0;
  }

  /* ===== BASE DATE CARD ===== */
  .dc {
    aspect-ratio: 2/3;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* ===== 1. Current baseline ===== */
  .dc1 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid var(--accent);
  }
  .dc1::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(0,212,170,0.03) 8px, rgba(0,212,170,0.03) 9px);
  }
  .dc1 .dy { font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.15em; margin-bottom: 2px; z-index: 1; }
  .dc1 .nm { font-size: 1.8rem; font-weight: bold; color: var(--accent); line-height: 1; z-index: 1; text-shadow: 0 0 15px rgba(0,212,170,0.5); }
  .dc1 .mo { font-size: 0.65rem; color: var(--accent); letter-spacing: 0.2em; margin-top: 2px; font-weight: bold; z-index: 1; }

  /* ===== 2. All white, bigger day ===== */
  .dc2 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid rgba(255,255,255,0.3);
  }
  .dc2 .dy { font-size: 0.75rem; color: #fff; letter-spacing: 0.15em; font-weight: 700; margin-bottom: 4px; z-index: 1; }
  .dc2 .nm { font-size: 2.2rem; font-weight: 800; color: #fff; line-height: 1; z-index: 1; }
  .dc2 .mo { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.2em; margin-top: 4px; z-index: 1; }

  /* ===== 3. Full day, all teal ===== */
  .dc3 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid var(--accent);
  }
  .dc3 .dy { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.15em; font-weight: 600; margin-bottom: 4px; z-index: 1; }
  .dc3 .nm { font-size: 2.4rem; font-weight: 800; color: var(--accent); line-height: 1; z-index: 1; text-shadow: 0 0 20px rgba(0,212,170,0.6); }
  .dc3 .mo { font-size: 0.6rem; color: var(--accent); letter-spacing: 0.2em; margin-top: 4px; opacity: 0.7; z-index: 1; }

  /* ===== 4. Teal ribbon top ===== */
  .dc4 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid rgba(255,255,255,0.15);
    justify-content: flex-start;
  }
  .dc4 .rb { width: 100%; background: var(--accent); color: #000; font-size: 0.55rem; font-weight: 800; letter-spacing: 0.12em; text-align: center; padding: 5px 0; z-index: 1; }
  .dc4 .nw { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .dc4 .nm { font-size: 2.4rem; font-weight: 800; color: #fff; line-height: 1; }
  .dc4 .mo { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.2em; margin-top: 4px; }

  /* ===== 5. Teal ribbon + teal number ===== */
  .dc5 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid var(--accent);
    justify-content: flex-start;
  }
  .dc5 .rb { width: 100%; background: var(--accent); color: #000; font-size: 0.55rem; font-weight: 800; letter-spacing: 0.12em; text-align: center; padding: 5px 0; z-index: 1; }
  .dc5 .nw { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .dc5 .nm { font-size: 2.4rem; font-weight: 800; color: var(--accent); line-height: 1; text-shadow: 0 0 20px rgba(0,212,170,0.5); }
  .dc5 .mo { font-size: 0.6rem; color: var(--accent); letter-spacing: 0.2em; margin-top: 4px; opacity: 0.7; }

  /* ===== 6. Teal ribbon + arrow ===== */
  .dc6 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid var(--accent);
    justify-content: flex-start;
  }
  .dc6 .rb { width: 100%; background: var(--accent); color: #000; font-size: 0.55rem; font-weight: 800; letter-spacing: 0.12em; text-align: center; padding: 5px 0; z-index: 1; }
  .dc6 .nw { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .dc6 .nm { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; }
  .dc6 .mo { font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.2em; margin-top: 3px; }
  .dc6 .ar { font-size: 1.2rem; color: var(--accent); opacity: 0.5; margin-top: 6px; }

  /* ===== 7. Subtle white ribbon + chevron ===== */
  .dc7 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid rgba(255,255,255,0.3);
    justify-content: flex-start;
  }
  .dc7 .rb { width: 100%; background: rgba(255,255,255,0.15); color: #fff; font-size: 0.55rem; font-weight: 700; letter-spacing: 0.12em; text-align: center; padding: 5px 0; z-index: 1; }
  .dc7 .nw { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .dc7 .nm { font-size: 2.2rem; font-weight: 800; color: #fff; line-height: 1; }
  .dc7 .mo { font-size: 0.55rem; color: var(--text-secondary); letter-spacing: 0.2em; margin-top: 3px; }
  .dc7 .ar { font-size: 1.4rem; color: rgba(255,255,255,0.3); margin-top: 4px; }

  /* ===== 8. Borderless + edge chevron ===== */
  .dc8 {
    background: linear-gradient(135deg, rgba(0,212,170,0.05) 0%, rgba(0,212,170,0.02) 100%);
    border: none;
  }
  .dc8 .dy { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.15em; font-weight: 600; margin-bottom: 2px; z-index: 1; }
  .dc8 .nm { font-size: 2.5rem; font-weight: 800; color: #fff; line-height: 1; z-index: 1; }
  .dc8 .mo { font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.2em; margin-top: 3px; z-index: 1; }
  .dc8 .ea { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font-size: 1.4rem; color: var(--accent); opacity: 0.4; z-index: 1; }

  /* ===== 9. Bold day / light number ===== */
  .dc9 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid var(--accent);
  }
  .dc9 .dy { font-size: 0.9rem; color: #fff; font-weight: 800; letter-spacing: 0.1em; z-index: 1; line-height: 1.1; }
  .dc9 .nm { font-size: 2.2rem; font-weight: 200; color: var(--accent); line-height: 1; z-index: 1; }
  .dc9 .mo { font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.2em; margin-top: 2px; z-index: 1; }

  /* ===== 10. Split teal/dark ===== */
  .dc10 {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent) 40%, #0a0a0a 40%, #1a1a2e 100%);
    border: none;
  }
  .dc10 .ds { flex: 0 0 40%; display: flex; align-items: center; justify-content: center; width: 100%; z-index: 1; }
  .dc10 .dy { font-size: 0.7rem; color: #000; font-weight: 800; letter-spacing: 0.12em; }
  .dc10 .ns { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .dc10 .nm { font-size: 2.2rem; font-weight: 800; color: #fff; line-height: 1; }
  .dc10 .mo { font-size: 0.55rem; color: var(--accent); letter-spacing: 0.2em; margin-top: 3px; }

  /* ===== 11. Ultra-minimal ===== */
  .dc11 {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .dc11 .nm { font-size: 3rem; font-weight: 100; color: var(--accent); line-height: 1; z-index: 1; opacity: 0.8; }
  .dc11 .sb { font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.1em; margin-top: 6px; z-index: 1; }

  /* ===== 12. Day pill badge + arrow ===== */
  .dc12 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .dc12 .dp { background: var(--accent); color: #000; font-size: 0.5rem; font-weight: 800; letter-spacing: 0.1em; padding: 3px 10px; border-radius: 12px; margin-bottom: 6px; z-index: 1; }
  .dc12 .nm { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; z-index: 1; }
  .dc12 .mo { font-size: 0.55rem; color: var(--text-secondary); letter-spacing: 0.2em; margin-top: 3px; z-index: 1; }
  .dc12 .ar { font-size: 0.9rem; color: var(--accent); opacity: 0.4; margin-top: 8px; z-index: 1; }

  /* ===== 13. Left-aligned editorial ===== */
  .dc13 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border-left: 3px solid var(--accent);
    border-radius: 0;
    align-items: flex-start;
    padding-left: 8px;
  }
  .dc13 .dy { font-size: 0.75rem; color: var(--accent); font-weight: 700; letter-spacing: 0.1em; z-index: 1; }
  .dc13 .nm { font-size: 2.4rem; font-weight: 800; color: #fff; line-height: 1; z-index: 1; margin: 2px 0; }
  .dc13 .mo { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.15em; z-index: 1; }
  .dc13 .chevs { font-size: 0.7rem; color: var(--accent); opacity: 0.35; margin-top: 6px; z-index: 1; letter-spacing: -0.05em; }

  /* ===== 14. Big day + gradient bar ===== */
  .dc14 {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .dc14 .dy { font-size: 0.85rem; color: #fff; font-weight: 800; letter-spacing: 0.12em; z-index: 1; margin-bottom: 2px; }
  .dc14 .nm { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; z-index: 1; }
  .dc14 .mo { font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.2em; margin-top: 2px; z-index: 1; }
  .dc14 .bb { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); z-index: 1; }

  /* ===== 15. Calendar page (light) ===== */
  .dc15 {
    background: #fff;
    border: none;
    border-radius: 4px;
    justify-content: flex-start;
  }
  .dc15 .ct { width: 100%; background: var(--accent); color: #000; font-size: 0.55rem; font-weight: 800; letter-spacing: 0.12em; text-align: center; padding: 5px 0; z-index: 1; }
  .dc15 .cb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .dc15 .nm { font-size: 2.4rem; font-weight: 800; color: #1a1a2e; line-height: 1; }
  .dc15 .mo { font-size: 0.55rem; color: #666; letter-spacing: 0.15em; margin-top: 2px; font-weight: 600; }
  .dc15 .ca { font-size: 0.9rem; color: var(--accent); margin-top: 4px; }
</style>
</head>
<body>

<div class="page-header">
  <h1>DATE CARD OPTIONS</h1>
  <div class="sub">15 designs in full grid context</div>
</div>

<div id="options"></div>

<script>
const posters = [
  'https://image.tmdb.org/t/p/w200/xEua5z9LMILLFS8sVddyipivAfU.jpg',
  'https://image.tmdb.org/t/p/w200/gqY0ITBgT7A82poL9jv851qdnIb.jpg',
  'https://image.tmdb.org/t/p/w200/z7xXihu5wHuSMWymq5VAulPVuvg.jpg',
  'https://image.tmdb.org/t/p/w200/hoEMZXOJgx0XioWcY8nuoVQ70JZ.jpg',
  'https://image.tmdb.org/t/p/w200/lbrnJY7E0a9xxgj2cotNp6YI4dz.jpg',
  'https://image.tmdb.org/t/p/w200/z0KEkkptc2kNHNrUdES1cZD2vRm.jpg',
  'https://image.tmdb.org/t/p/w200/sxyRAjnkDw2E8BVsd91J6Cnv9OK.jpg',
  'https://image.tmdb.org/t/p/w200/9HcEqn3D4J6b2Z0jK54id9nA0fr.jpg',
  'https://image.tmdb.org/t/p/w200/9DZCHEo6lVXk0IvKA1D26jJCmPZ.jpg',
  'https://image.tmdb.org/t/p/w200/6n95Q0HGpFnA4rlnfAKknkoy6XV.jpg',
  'https://image.tmdb.org/t/p/w200/mAX1ujOROXtKsOuIg5MbJbotOyD.jpg',
  'https://image.tmdb.org/t/p/w200/dXeeDRLGpTX1U97lWBAwQeeplsW.jpg',
  'https://image.tmdb.org/t/p/w200/7SphrQbctdC8OTXVIkk9kzI9yXK.jpg',
  'https://image.tmdb.org/t/p/w200/nedWOSKUvZf2J0oLjYCk44rob2l.jpg',
];

// Two dates for each option
const dates = [
  { day: 'SATURDAY', dayShort: 'SAT', num: 10, month: 'MAY' },
  { day: 'FRIDAY', dayShort: 'FRI', num: 9, month: 'MAY' },
];

function posterHTML(idx) {
  return `<div class="poster-cell"><img src="${posters[idx % posters.length]}" alt="" loading="lazy"></div>`;
}

// Each option: date card builder function
function buildDateCard(optNum, date) {
  const d = date;
  switch(optNum) {
    case 1: return `<div class="dc dc1"><div class="dy">${d.dayShort}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div></div>`;
    case 2: return `<div class="dc dc2"><div class="dy">${d.dayShort}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div></div>`;
    case 3: return `<div class="dc dc3"><div class="dy">${d.day}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div></div>`;
    case 4: return `<div class="dc dc4"><div class="rb">${d.day}</div><div class="nw"><div class="nm">${d.num}</div><div class="mo">${d.month}</div></div></div>`;
    case 5: return `<div class="dc dc5"><div class="rb">${d.day}</div><div class="nw"><div class="nm">${d.num}</div><div class="mo">${d.month}</div></div></div>`;
    case 6: return `<div class="dc dc6"><div class="rb">${d.dayShort}</div><div class="nw"><div class="nm">${d.num}</div><div class="mo">${d.month}</div><div class="ar">\u2192</div></div></div>`;
    case 7: return `<div class="dc dc7"><div class="rb">${d.day}</div><div class="nw"><div class="nm">${d.num}</div><div class="mo">${d.month}</div><div class="ar">\u203A</div></div></div>`;
    case 8: return `<div class="dc dc8"><div class="dy">${d.dayShort}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div><div class="ea">\u203A</div></div>`;
    case 9: return `<div class="dc dc9"><div class="dy">${d.dayShort}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div></div>`;
    case 10: return `<div class="dc dc10"><div class="ds"><div class="dy">${d.day}</div></div><div class="ns"><div class="nm">${d.num}</div><div class="mo">${d.month}</div></div></div>`;
    case 11: return `<div class="dc dc11"><div class="nm">${d.num}</div><div class="sb">${d.dayShort} \u00B7 ${d.month}</div></div>`;
    case 12: return `<div class="dc dc12"><div class="dp">${d.dayShort}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div><div class="ar">\u203A\u203A\u203A</div></div>`;
    case 13: return `<div class="dc dc13"><div class="dy">${d.dayShort}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div><div class="chevs">\u203A\u203A\u203A\u203A\u203A\u203A\u203A\u203A</div></div>`;
    case 14: return `<div class="dc dc14"><div class="dy">${d.dayShort}</div><div class="nm">${d.num}</div><div class="mo">${d.month}</div><div class="bb"></div></div>`;
    case 15: return `<div class="dc dc15"><div class="ct">${d.day}</div><div class="cb"><div class="nm">${d.num}</div><div class="mo">${d.month}</div><div class="ca">\u203A\u203A\u203A</div></div></div>`;
  }
}

const labels = [
  'Current (baseline)',
  'All white, bigger day',
  'Full day name, all teal',
  'Teal day ribbon top',
  'Teal ribbon + teal number',
  'Teal ribbon + arrow',
  'Subtle white ribbon + chevron',
  'Borderless + edge chevron',
  'Bold day / light number',
  'Split \u2014 teal top / dark bottom',
  'Ultra-minimal',
  'Day pill badge + arrows',
  'Left-aligned editorial',
  'Big day + gradient bar',
  'Calendar page (light)',
];

const descs = [
  'Small day in gray, teal number, teal border, diagonal stripes',
  'Day prominent in white bold, big white number, white border',
  'Full weekday name, large teal glow number, all teal palette',
  'Full-bleed teal ribbon with day name on top, white number below',
  'Teal ribbon on top, teal glowing number, teal border',
  'Short day in teal ribbon, white number, \u2192 arrow below implying movies to the right',
  'White translucent ribbon, white number, soft \u203A chevron',
  'No border, subtle teal bg, huge white number, \u203A on right edge',
  'Day is the hero (big white bold), number is thin teal',
  'Top 40% solid teal with day, bottom dark with big white number',
  'Giant thin teal number, tiny context text',
  'Day as teal pill badge, white number, \u203A\u203A\u203A arrow hint',
  'Left teal border, left-aligned text, \u203A\u203A\u203A\u203A\u203A\u203A\u203A\u203A chevrons',
  'Day name biggest (white), teal number, gradient accent bar at bottom',
  'Real calendar look \u2014 white card, teal header strip, dark number',
];

const container = document.getElementById('options');

for (let opt = 1; opt <= 15; opt++) {
  const section = document.createElement('div');
  section.className = 'option-section';

  // Header
  const header = document.createElement('div');
  header.className = 'option-header';
  header.innerHTML = `<span class="option-num">${opt}</span><span class="option-name">${labels[opt-1]}</span>`;

  const desc = document.createElement('div');
  desc.className = 'option-desc';
  desc.textContent = descs[opt-1];

  // Grid with 2 date groups, date card position varies
  // Real wall: date cards land wherever the previous group ended,
  // so they appear in different columns
  const grid = document.createElement('div');
  grid.className = 'wall-grid';

  // Vary layout: first date has N posters before it, second date has M posters before it
  // This shifts the date card to different column positions
  const layouts = [
    { pre1: 0, post1: 7, pre2: 0, post2: 3 },  // date at col 1, then col 1
    { pre1: 2, post1: 5, pre2: 1, post2: 3 },  // date at col 3, then col 2
    { pre1: 1, post1: 6, pre2: 3, post2: 1 },  // date at col 2, then col 4
    { pre1: 3, post1: 4, pre2: 2, post2: 2 },  // date at col 4, then col 3
    { pre1: 0, post1: 5, pre2: 2, post2: 2 },  // date at col 1, then col 3
  ];
  const layout = layouts[(opt - 1) % layouts.length];
  let pi = 0;
  let cells = '';
  // Pre-posters before first date
  for (let p = 0; p < layout.pre1; p++) cells += posterHTML(pi++);
  cells += buildDateCard(opt, dates[0]);
  // Post-posters after first date
  for (let p = 0; p < layout.post1; p++) cells += posterHTML(pi++);
  // Pre-posters before second date
  for (let p = 0; p < layout.pre2; p++) cells += posterHTML(pi++);
  cells += buildDateCard(opt, dates[1]);
  // Post-posters after second date
  for (let p = 0; p < layout.post2; p++) cells += posterHTML(pi++);
  grid.innerHTML = cells;

  section.appendChild(header);
  section.appendChild(desc);
  section.appendChild(grid);

  if (opt > 1) {
    const div = document.createElement('div');
    div.className = 'section-divider';
    container.appendChild(div);
  }
  container.appendChild(section);
}
</script>
</body>
</html>
