<head>

<title>NRW · Mobile detail</title>
<style>
  :root{
    --bg1:#0a0a0a; --bg2:#1a1a2e; --accent:#00d4aa;
    --text:#fff; --muted:#bbb; --dim:#888;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --pill:25px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#000;font-family:var(--font);color:var(--text);}
  body{display:flex;flex-direction:column;align-items:center;}
  .phone{width:100%;max-width:430px;height:100dvh;background:linear-gradient(180deg,var(--bg1),var(--bg2));
    display:flex;flex-direction:column;overflow:hidden;position:relative;}

  /* demo title bar (not part of the real UI) */
  .topbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;
    padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.07);
    font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .topbar b{color:var(--accent);}

  /* sheet = handle + scrolling content + fixed button bar */
  .sheet{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .handle{display:flex;justify-content:center;padding:9px 0 5px;flex-shrink:0;}
  .handle i{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 22px 18px;}

  /* ---- HERO (locked: poster + text box are one fixed-height unit, 84x126 = 2:3) ---- */
  .hero{display:flex;gap:14px;align-items:flex-start;height:126px;overflow:hidden;}
  .hero-poster{width:84px;height:126px;border-radius:8px;object-fit:cover;flex-shrink:0;
    box-shadow:0 4px 14px rgba(0,0,0,.5);background:#222;}
  .hero-text{flex:1;min-width:0;height:100%;overflow:hidden;display:flex;flex-direction:column;}
  .hero-title{font-size:1.18rem;font-weight:700;line-height:1.22;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .hero-dir{font-size:.76rem;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero-cast{font-size:.74rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero-meta{font-size:.7rem;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero .lab{color:var(--accent);font-weight:700;}
  .hero a{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.32);text-underline-offset:2px;}

  .scores{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;}
  .score{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;
    border:1.5px solid rgba(255,255,255,.2);font-size:.74rem;font-weight:700;}
  .score .lg{font-size:.58rem;font-weight:800;letter-spacing:.02em;opacity:.85;}
  .score.rt{border-color:rgba(255,107,107,.55);background:rgba(255,107,107,.08);color:#ff6b6b;}
  .score.imdb{border-color:rgba(245,197,24,.55);background:rgba(245,197,24,.08);color:#f5c518;}
  .score.mc{border-color:rgba(125,223,100,.55);background:rgba(125,223,100,.08);color:#7ddf64;}
  .score.lb{border-color:rgba(0,224,84,.5);background:rgba(0,224,84,.08);color:#00e054;}

  /* quotes — desktop style: teal italic, teal left border, NO badge */
  .pq{background:rgba(0,212,170,.07);border-left:3px solid var(--accent);border-radius:6px;
    padding:.55rem .7rem;margin:9px 0;}
  .pq q{display:block;font-style:italic;color:var(--accent);font-size:.92rem;line-height:1.45;quotes:"\201C" "\201D";}
  .pq a{text-decoration:none;color:inherit;}
  .pq cite{display:block;font-style:normal;font-size:.72rem;color:rgba(0,212,170,.6);margin-top:4px;}
  .pq-wrap{padding-top:.7rem;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);}

  /* synopsis — no label */
  .syn{font-size:.9rem;line-height:1.6;color:#ccc;margin-top:14px;}
  .syn a{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:2px;}
  /* screening note — desktop .screening-callout: gold, italic, one color, fest name bold */
  .vs-note{margin-top:12px;color:#FFD700;font-style:italic;font-size:.88rem;line-height:1.5;}
  .vs-note .vs-fest{font-weight:700;}

  /* ---- FIXED BOTTOM BUTTON BAR ---- */
  .btnbar{flex-shrink:0;display:flex;flex-direction:column;gap:8px;
    padding:10px 16px calc(12px + env(safe-area-inset-bottom,0));
    background:rgba(12,12,24,.65);border-top:1px solid rgba(255,255,255,.06);
    max-height:50vh;overflow-y:auto;}
  .btn-trailer{height:50px;border-radius:10px;background:#E50914;color:#fff;
    font-weight:800;letter-spacing:.18em;font-size:.92rem;border:1.5px solid rgba(255,255,255,.25);cursor:pointer;}
  .btn-trailer:active{transform:scale(.98);}
  .btn-vod{display:flex;align-items:stretch;min-height:50px;border-radius:10px;overflow:hidden;
    text-decoration:none;color:#fff;border:1.5px solid transparent;}
  .btn-vod .logo-half{display:flex;align-items:center;justify-content:center;width:42%;padding:6px;
    font-weight:700;text-transform:uppercase;font-size:.8rem;text-align:center;line-height:1.1;}
  .btn-vod .price-half{display:flex;align-items:center;justify-content:center;width:58%;padding:6px;
    background:rgba(0,0,0,.4);font-weight:700;font-size:.8rem;text-align:center;}
  .btn-vod.screening{border-color:#FFD700;}
  .btn-vod.screening .price-half{width:100%;background:transparent;color:#f5c518;}
  .btn-stream{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;
    font-weight:700;text-transform:uppercase;font-size:.8rem;color:#fff;text-decoration:none;letter-spacing:.02em;}
  /* ticket button — same filled style as a streaming button, gold for the screening */
  .btn-tickets{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;
    background:#FFD700;color:#000;font-weight:700;text-transform:uppercase;font-size:.8rem;text-decoration:none;letter-spacing:.04em;}
  .btn-share{height:46px;border-radius:10px;background:transparent;border:1.5px solid rgba(0,212,170,.5);
    color:var(--accent);font-weight:700;letter-spacing:.12em;font-size:.82rem;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}

  /* nav chevrons (over the content, above the button bar) */
  .nav{position:absolute;top:38%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
    background:rgba(10,12,16,.55);border:1px solid rgba(0,212,170,.5);color:var(--accent);font-size:1.6rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;user-select:none;}
  .nav.l{left:6px;} .nav.r{right:6px;}
</style>

let idx = 0;
const content = document.getElementById('content');
const btnbar  = document.getElementById('btnbar');

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wiki = name => 'https://en.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(name);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { const a=String(s).split('-'); return MON[+a[1]-1]+' '+(+a[2]); };
const tix = m => 'https://www.google.com/search?q='+encodeURIComponent((m.screening_name||'')+' virtual screening tickets');

// light markdown: **bold**, *italic*, [t](u), \n -> <br>
function md(t){
  if(!t) return '';
  t = esc(t);
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  t = t.replace(/\n/g,'<br>');
  return t;
}

function scoreHTML(m){
  const out=[];
  if(m.rt)   out.push(`<span class="score rt"><span class="lg">RT</span>${esc(m.rt)}</span>`);
  if(m.imdb) out.push(`<span class="score imdb"><span class="lg">IMDb</span>${esc(m.imdb)}</span>`);
  if(m.mc && m.mc!=='0') out.push(`<span class="score mc"><span class="lg">MC</span>${esc(m.mc)}</span>`);
  if(m.lb)   out.push(`<span class="score lb"><span class="lg">LB</span>${esc(m.lb)}</span>`);
  return out.join('');
}

function castHTML(m){
  if(!m.cast || !m.cast.length) return '';
  return m.cast.map(n=>`<a href="${wiki(n)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(', ');
}
function metaLine(m){
  const p=[];
  if(m.country) p.push(esc(m.country.replace('United States of America','USA').replace('United States','USA')));
  if(m.year) p.push(m.year);
  if(m.runtime) p.push(m.runtime+' min');
  if(m.studio && m.studio!=='Unknown') p.push(esc(m.studio));
  return p.join(' · ');
}

function heroHTML(m){
  const dir = m.director ? `<div class="hero-dir"><span class="lab">Dir:</span> <a href="${wiki(m.director)}" target="_blank" rel="noopener">${esc(m.director)}</a></div>` : '';
  const cast = castHTML(m) ? `<div class="hero-cast"><span class="lab">Cast:</span> ${castHTML(m)}</div>` : '';
  const meta = metaLine(m) ? `<div class="hero-meta">${metaLine(m)}</div>` : '';
  return `<div class="hero">
    <img class="hero-poster" src="${esc(m.poster)}" onerror="this.style.visibility='hidden'">
    <div class="hero-text">
      <div class="hero-title">${esc(m.title)}</div>
      ${dir}${cast}${meta}
      <div class="scores">${scoreHTML(m)}</div>
    </div></div>`;
}

function quotesHTML(m){
  if(!m.pull_quotes || !m.pull_quotes.length) return '';
  return `<div class="pq-wrap">` + m.pull_quotes.map(q=>{
    const attribution=[q.critic,q.outlet].filter(Boolean).join(', ');
    const inner = `<q>${esc(q.text)}</q>${attribution?`<cite>${esc(attribution)}</cite>`:''}`;
    return `<div class="pq">${q.review_url?`<a href="${esc(q.review_url)}" target="_blank" rel="noopener">${inner}</a>`:inner}</div>`;
  }).join('') + `</div>`;
}

// service brand colors (mirror styles.css :root --svc-*)
const SVC = [
  [/netflix/i,'#E50914'], [/max|hbo/i,'#B537F2'], [/disney/i,'#113CCF'],
  [/amazon|prime/i,'#00A8E1'], [/hulu/i,'#1CE783'], [/paramount/i,'#0064FF'],
  [/youtube/i,'#FF0000'], [/hoopla/i,'#FC4F08'], [/fandango|vudu/i,'#FF6600'],
  [/apple/i,'#333'], [/peacock/i,'#111'], [/tubi/i,'#FA382F'], [/pluto/i,'#00B4E4'],
  [/plex/i,'#1a1a1a'], [/discovery|investigation/i,'#1B6FE0'],
];
const svcColor = name => (SVC.find(([re])=>re.test(name||''))||[,'#2a2a3a'])[1];
const txtColor = bg => bg==='#1CE783' ? '#000' : '#fff';

function buttonsHTML(m){
  let h = `<button class="btn-trailer">TRAILER</button>`;
  if(m.screening) h += `<a class="btn-tickets" href="${tix(m)}" target="_blank" rel="noopener">Buy Tickets</a>`;
  (m.vod||[]).forEach(v=>{
    if(/spectrum|eventive/i.test(v.service||'')) return;
    const bg=svcColor(v.service);
    const price = (v.rent&&v.buy)?`Rent ${v.rent} / Buy ${v.buy}`:(v.rent?`Rent ${v.rent}`:(v.buy?`Buy ${v.buy}`:'Watch'));
    h += `<a class="btn-vod"><div class="logo-half" style="background:${bg};color:${txtColor(bg)}">${esc(v.service)}</div><div class="price-half">${price}</div></a>`;
  });
  const streams=[...new Set((m.streaming||[]).map(s=>s.service).filter(s=>s&&!/spectrum/i.test(s)))];
  streams.forEach(s=>{
    const bg=svcColor(s);
    h += `<a class="btn-stream" style="background:${bg};color:${txtColor(bg)}">${esc(s)}</a>`;
  });
  h += `<button class="btn-share">⤴ SHARE</button>`;
  return h;
}

function render(){
  const m=MOVIES[idx];
  let h = heroHTML(m);
  h += quotesHTML(m);
  h += `<div class="syn">${md(m.capsule)}</div>`;
  if(m.screening){
    const end = m.screening_end ? ' \u00b7 through '+fmtDate(m.screening_end) : '';
    h += `<div class="vs-note">Virtual screening via <span class="vs-fest">${esc(m.screening_name||'festival')}</span>${end}.</div>`;
  }
  content.innerHTML = h;
  content.scrollTop = 0;
  btnbar.innerHTML = buttonsHTML(m);
  document.getElementById('counter').textContent = (idx+1)+' / '+MOVIES.length;
}

function go(d){ idx=(idx+d+MOVIES.length)%MOVIES.length; render(); }
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')go(-1); if(e.key==='ArrowRight')go(1); });

let sx=0,sy=0;
const sheet=document.querySelector('.sheet');
sheet.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
sheet.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
},{passive:true});

render();
</script>
</body>
</html>
