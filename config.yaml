# Trailer Hosting (Backblaze B2)
# Self-hosted trailer MP4s for in-app playback — avoids YouTube dependency
# Apps check trailer_hosted first, fall back to YouTube trailer URL
# Credentials: B2_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME in .env
# Note: toggling enabled to false stops NEW hosting but existing trailer_hosted URLs in data.json remain valid
trailer_hosting:
  enabled: true                      # Master toggle for trailer hosting pipeline
  bucket_url: "https://f004.backblazeb2.com/file/NRW-TRAILERS"  # Public URL base (change when CloudFlare is set up)
  max_hosted: 200                    # Only the 200 most recent movies get trailers; oldest rotate out
  cookies_file: cache/yt_cookies.txt  # Netscape-format cookie file — works from LaunchAgent (no sandbox restriction). Refresh with: yt-dlp --cookies-from-browser safari --cookies cache/yt_cookies.txt --skip-download [any YT URL]
  # cookies_browser: safari           # Fallback: browser-based extraction works for manual runs but is blocked by macOS sandbox in LaunchAgent
  clean_local_after_upload: true     # Auto-delete local MP4 after confirmed B2 upload
  pipeline_integration: true         # Auto-host trailers for new movies during daily enrichment
  trailer_gap_batch_size: 30         # Max movies to retry per trailer gap fill run
  trailer_gap_max_retries: 5         # Stop retrying after N failed attempts per movie
  trailer_gap_cooldown_days: 7       # Days between retry attempts for the same movie
# Slop classifier Tier-3 scoring — read by scripts/slop_classifier.py.
# These values MATCH the code's built-in defaults, so this section is
# documentation-as-config: edit a number here to retune the classifier
# without touching code. Missing keys fall back to the same defaults.
# (Tier 1/2 studio + streaming lists still live in slop_classifier.py;
# the prestige-festival list lives in scripts/detect_festivals.py.)
slop_classifier:
  score_threshold: 4        # score >= threshold -> slop
  weights:
    no_wiki: 2              # no Wikipedia article
    no_rt: 2                # no Rotten Tomatoes score
    no_imdb: 2              # no IMDb rating at all
    low_imdb: 2             # IMDb <= 6.0
    mid_imdb: 1             # IMDb 6.1 - 6.9
    good_imdb: -1           # IMDb >= 7.0
    tv_movie: 3             # TMDB content_type == tv_movie
    no_rt_link: 1           # no RT page link (score may still exist via OMDb)
    festival: -1            # listed in admin/festival_films.json
    major_streamer: -1      # licensed on Netflix/Prime/Disney+/HBO/Max/Shudder
