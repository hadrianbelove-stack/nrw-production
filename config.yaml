# NRW Configuration
#
# Launch: Use `./launch_all.sh` to start both admin panel (5556) and site (3000)
# No authentication required for local development
#
# Scraper Configuration Notes:
# - All scrapers use centralized defaults from constants.py (SCRAPER_DEFAULTS)
# - Per-scraper configs below override the centralized defaults
# - Centralized defaults: timeout=15s, rate_limit=2.0s, max_retries=3,
#   exponential_backoff={base_delay=0.5s, max_delay=5.0s, jitter_ratio=0.2},
#   cache_ttl_days=30, screenshots_enabled=true, screenshot_retention_days=7

# Ports for local development (configurable via environment variables)
tracking:
  bootstrap_days: 7  # Look back N days for new releases
  poll_all_tracking: true  # Poll all tracking movies (production requirement)
  archive_available_on_detect: false  # Archive available movies to separate file (experimental)
  compaction_batch_size: 50  # Maximum entries to move per compaction run
  compaction_recent_days: null  # Only compact entries from last N days (null = no age limit)
  excluded_services: ['fuboTV', 'Philo', 'Sun Nxt', 'Google Play Movies', 'Google Play', 'Shahid VIP', 'Viki', 'Futo', 'AMC Plus']  # Fandango allowed for VOD. Google Play excluded (YouTube is separate). AMC Plus excluded (no reliable direct links).
  # Metadata fields set by false-positive revert logic (generator.py post-enrichment):
  #   _reverted_from_available: true = movie was reverted from available→tracking (zero watch links)
  #   _false_positive_source: 'tmdb_type4' or 'provider_availability_check' = which discovery triggered the false positive
  #   _type4_false_positive: true = Type 4 discovery was false positive (blocks Type 4 re-discovery)
  #   _providers_false_positive: true = provider discovery was false positive (blocks provider re-discovery)
  blocked_companies:  # Non-film content producers — safe to block
    - 146598   # WWE
    - 10339    # WWE Studios
    - 20586    # NJPW (New Japan Pro-Wrestling)
    - 13927    # TNA (Total Nonstop Action)
    - 118180   # Stardom
    - 119828   # AEW (All Elite Wrestling)
    - 146674   # DDT Pro-Wrestling
    - 116675   # TJPW (Tokyo Joshi Pro-Wrestling)
    - 170188   # HOG (House of Glory)
    - 232651   # CMLL (Consejo Mundial De Lucha Libre)
    - 110728   # Lucha Libre AAA
    - 265635   # Lucha Libre AAA Worldwide
    - 291384   # Sareee-ISM
    - 103501   # ROH (Ring of Honor)
    - 88761    # Impact Wrestling
    - 141961   # Pro Wrestling NOAH
    - 241364   # Major League Wrestling
    - 116902   # GCW (Game Changer Wrestling)
    - 124609   # GCW (alternate)
  blocked_title_keywords: ['WWE', 'NXT', 'WrestleMania', 'NJPW', 'AEW', 'Ring of Honor', 'ROH', 'Sareee-ISM', 'TNA Sacrifice', 'TNA Slammiversary', 'TNA Emergence', 'TNA Hard to Kill', 'TNA Rebellion', 'ISU World Championships', 'ISU Grand Prix', 'Mystery Wrestling', 'TJPW', 'DDT Judgement', 'CMLL', 'HOG:', 'HOGxBIG', 'PWU:', 'Stardom', 'GCW']

# JustWatch configuration (enrichment only)
# NOTE: JustWatch verification removed from discovery phase (Mar 2026).
# JustWatch is used in enrichment only — for resolving actual rent/buy watch links
# (Amazon, Apple TV deep URLs) that TMDB doesn't provide. See docs/features/WATCH_LINK_ARCHITECTURE.md (tier 4).
justwatch_verification:
  enabled: true                    # Used by enrichment for watch link resolution
  rate_limit: 0.5                  # Seconds between JustWatch API calls
  min_confidence: 'close_year'     # Minimum match confidence: exact_year, close_year, title_only, first_result
  fallback_to_tmdb: true           # If JustWatch fails, use TMDB provider names (no deep links)

# Backup retention policy for quarantined corrupt files and atomic write backups
# Prevents unbounded disk growth from .corrupted-* and .backup-* files in backups/ directory
backups:
  retention_days: 30  # Delete backup files older than N days (30 days default for production)
  cleanup_check_interval_hours: 1  # Minimum time between cleanup checks (rate limiting)
  enabled: true  # Enable automatic cleanup of old backup files
  include_backup_files: false  # Enable cleanup of .backup-*.json files from atomic writes (default: false)

# Structured telemetry and metrics across Storage, Validation, Enrichment services
# Emits events with fields: service, action, file, item_id, result, duration_ms, error
# Maintains counters: quarantined_files, validated_items, enriched_items, retry_count
telemetry:
  enabled: true  # Enable structured telemetry logging
  console: false  # Log telemetry events to console (set false to reduce noise)
  file: true  # Write telemetry to JSONL file
  file_path: 'metrics/telemetry.jsonl'  # Path to telemetry log file (JSONL format)
  metrics_dir: 'metrics'  # Directory for metrics and summary files
  # Counters tracked:
  # - quarantined_files: Files moved to backups/ due to corruption
  # - validated_items: Items passing schema validation
  # - enriched_items: Movies successfully enriched with watch links
  # - cache_hits: Cache hits across all services
  # - api_calls: External API calls (TMDB, etc)
  # - retry_count: Total retry attempts across services

# INTAKE configuration (legacy key name "discovery" preserved for compatibility)
# Controls: generate_data.py --intake (finding NEW movie premieres from TMDB)
# NOT used by: generate_data.py --discover (provider-availability checks)
# For provider-availability settings, see: orchestrator.health section below
intake:
  days_back: 7  # Intake window for finding new premieres from TMDB (controls how far back intake looks)
  max_pages: 20  # Intake page limit - maximum TMDB pages to process during intake phase
  min_runtime: 60  # Minimum runtime in minutes - filters out shorts (features only)
  # CI optimizations - reduce load for automated runs
  ci_days_back: 7  # Reduced intake window for CI (set via CI_DISCOVERY_DAYS env var)
  ci_max_pages: 10  # Reduced intake page limit for CI (set via CI_DISCOVERY_PAGES env var)
  enable_pass_a: true  # Enable Pass A: Direct-to-digital releases (release_date + type=4)
  enable_pass_b: true  # Enable Pass B: Theatrical releases (primary_release_date)
  enable_pass_c: true  # Enable Pass C: Festival premieres (with_release_type=1 in festival regions)
  festival_max_pages: 50  # Higher page limit for festival intake (more obscure films)

  # Pass D: Reissue / Restoration candidate collection (NOT auto-intaked — held for human confirm)
  # Catches OLD films (original release reissue_min_age_years+ ago) that just got a NEW release
  # event (theatrical 4K restoration, anniversary re-release, festival revival, alt cut). These are
  # invisible to Passes A/B because TMDB keeps their ORIGINAL primary_release_date. Candidates are
  # written to admin/reissue_candidates.json and surfaced in the /curate & /morning "Confirm
  # Reissues" stage. Only films the user confirms enter tracking.
  enable_pass_d: true
  reissue_min_age_years: 10      # Original release must be at least this old (matches restoration_config year_gap_threshold)
  reissue_days_back: 30          # Wider window than normal intake — reissues are rare, scan further back
  reissue_max_pages: 5           # TMDB discover pages for the candidate sweep
  # Greenlight note keywords — a recent release entry whose note contains one of these flags a
  # likely reissue. Used only to PRE-SORT the confirm list (likely/maybe); never a hard gate —
  # every candidate is still shown to the user.
  reissue_note_keywords:
    - restoration
    - restored
    - 4k
    - remaster
    - re-release
    - rerelease
    - reissue
    - anniversary
    - extended cut
    - assembly cut
    - director's cut
    - film festival

  # Pass E: Distributor release calendars (restoration lane). Scrapes physicalmedia.news
  # for upcoming discs from curated restoration labels (label list + year-gap threshold:
  # admin/restoration_config.json), TMDB-matches each row, and intakes HIGH-confidence
  # matches as PARKED deferred-reissue tracking entries — the same change-detection
  # baseline as confirm_reissue --defer, so a stale old transfer already streaming can
  # never false-transition them. Discovery wakes an entry only on a NEW digital signal.
  # Unmatched rows accumulate in admin/distributor_unmatched.json for human review.
  # Default OFF (unlike passes A-D) until the CI rollout is approved.
  enable_pass_e: false

# Restoration version gate (Stage 4 of the restoration lifecycle). When enabled, a
# reissue (_reissue) film that discovery would transition to the wall is HELD in
# tracking instead — TMDB/JustWatch confirm the TITLE has offers, not that the offer
# is the RESTORATION (44% of parked restorations have an old transfer streaming).
# pipeline/version_check.py researches held films (grounded Gemini);
# scripts/release_restoration.py --release / --repark is the human ruling.
# Nothing on the wall without verification.
restoration_gate:
  enabled: false
  research_limit: 15   # grounded Gemini calls per version_check run

