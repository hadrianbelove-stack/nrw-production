# Pre-order settings
preorder:
  link_finder_days: 14  # Days before digital_date to start fetching buy links from storefronts

# Manual pre-order overrides: force-flag or un-flag movies as pre-orders.
# true = force pre-order badge, false = override to NOT pre-order
preorder_overrides:
  "1292415": true    # Beast
  "1408208": true    # Exit 8
  "1495044": true    # BORN SEXY YESTERDAY: Decoding the Enigma of Beauty
  "1515899": true    # Billie Eilish - Hit Me Hard and Soft: The Tour (Live in 3D) — theatrical-only, digital TBA ~Sept 2026; REMOVE this line when it genuinely releases
  "1320006": false   # PH-1 (not actually a pre-order)
  "1398655": false   # Blue Film (verified released buy-only, not a pre-order)
  "1257406": false   # Two Prosecutors (verified released buy-only, not a pre-order)

# Manual end dates for festivals where Eventive page doesn't embed dates
# Used as fallback when auto-detection fails. Format: YYYY-MM-DD
