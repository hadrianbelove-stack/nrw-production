# Festival screening name mapping
# Maps Eventive URL slugs to human-readable festival names for poster ribbons
# Add new entries here when new festival slugs appear in the data
festival_names:
  mjff2026: "Miami Jewish Film Festival"
  tucsonfilm2026: "Tucson Film Festival"
  pjff2026: "Portland Jewish Film Festival"
  bsdff: "Big Sky Documentary Film Festival"
  focusonfrenchcinema: "Focus on French Cinema"
  36thsdijffmid: "San Diego Intl. Jewish Film Festival"
  menafilmfestival: "MENA Film Festival"
  sundance: "Sundance Film Festival"

api:
  # API keys now loaded from .env file (see load_env.py)
  # Environment variables: TMDB_API_KEY, OMDB_API_KEY, GEMINI_API_KEY
  tmdb_api_key: ""
  omdb_api_key: ""
  gemini_api_key: ""
  tmdb_rate_limit: 0.1  # Seconds between API calls
  max_retries: 3
  max_pages_bootstrap: 49  # Maximum pages to fetch for bootstrap operation

# Gemini-based scraper for YouTube trailers, RT scores, Wikipedia (primary), with Playwright fallback
# Uses Google Search grounding for accurate movie data finding
gemini_scraper:
  enabled: true                    # Master kill switch - set false to use Playwright-only for all
  youtube_enabled: true            # YouTube-specific toggle - set false for Playwright-only trailers
  rt_enabled: true                 # RT-specific toggle - set false for Playwright-only RT
  wikipedia_enabled: true          # Wikipedia-specific toggle - set false for Playwright-only Wikipedia
  pull_quotes_enabled: true        # Pull quotes - find critic/Letterboxd quotes per movie
  pull_quotes_count: 8             # Number of critic quotes to request per movie
  use_playwright_fallback: true    # Try Playwright if Gemini fails
  timeout_seconds: 30              # Prevent hanging API calls
  rate_limit: 1.0                  # Seconds between API calls
  cache_ttl_days: 90               # How long to cache results
  max_retries: 3                   # Retry attempts with exponential backoff

# Streaming scraper (Playwright): For Netflix/Disney+/HBO Max/Hulu - DISABLED due to authentication barriers
# Uses playwright for stealth browsing but blocked by login requirements
streaming_scraper:
  enabled: true  # Enabled as fallback when TMDB API has no links
  headless: true  # Run browser in headless mode (required for CI)
  rate_limit: 2.0  # Minimum seconds between scrapes
  timeout: 10  # Page load timeout in seconds
  max_retries: 3  # Increased from 1 for exponential backoff
  cache_ttl_days: 30  # Cache expiration (days)
  screenshots_enabled: true  # Capture screenshots on failure
  screenshot_retention_days: 7  # Auto-delete old screenshots
  exponential_backoff:
    base_delay: 0.5  # Initial retry delay (seconds)
    max_delay: 5.0  # Maximum retry delay (seconds)
    jitter_ratio: 0.2  # Randomness factor (±20%)

# VOD scraper (Playwright): For Amazon/Apple TV - ENABLED as TMDB fallback
# Uses Playwright for Amazon/Apple TV since they don't require authentication
# Only runs when TMDB API has no direct links, focuses on recent releases
vod_scraper:
  enabled: true  # Enable Playwright-based Amazon/Apple TV scraper as TMDB fallback
  headless: true  # Run browser in headless mode for production
  rate_limit: 2.0  # Seconds between scrapes to avoid rate limiting
  timeout: 10  # Page load timeout in seconds
  max_retries: 2  # Retry attempts on failure
  platforms:
    amazon: true  # Enable Amazon Prime Video scraping
    apple_tv: true  # Enable Apple TV scraping
  maintenance:
    last_selector_update: "2025-10-25"  # Track when selectors were last verified
    expected_update_frequency: "quarterly"  # How often selectors typically need updates
    # Migrated from Selenium to Playwright on 2025-10-25 for improved reliability and performance
    # Expected performance improvement: 30-40% faster (6-8s vs 10s per search)
    # Implementation: streaming_platform_scraper.py (Playwright-based, shares patterns with agent_link_scraper.py)

rt_scraper:
  enabled: true  # Enable/disable RT scraping
  headless: true  # Run browser in headless mode
  rate_limit: 2.0  # Minimum seconds between scrapes
  timeout: 15  # Page load timeout in seconds (increased for CI environment)
  max_retries: 3  # Number of retries on failure (increased for CI reliability)
  cache_ttl_days: 90  # RT links are stable, longer TTL than agent scraper
  screenshots_enabled: true  # Capture screenshots on failure for debugging
  screenshot_retention_days: 7  # Auto-delete old screenshots
  exponential_backoff:
    base_delay: 0.5  # Initial retry delay (seconds)
    max_delay: 5.0  # Maximum retry delay (seconds)
    jitter_ratio: 0.2  # Randomness factor (±20%)

# Vimeo On Demand scraper (Playwright): For discovering indie films
# Uses Playwright to browse Vimeo On Demand pages and cross-reference with TMDB
vimeo_scraper:
  enabled: true  # Enable Vimeo On Demand film discovery
  headless: true  # Run browser in headless mode
  rate_limit: 2.0  # Minimum seconds between scrapes
  timeout: 15  # Page load timeout in seconds
  max_retries: 3  # Number of retries on failure
  cache_ttl_days: 30  # Cache expiration for Vimeo metadata
  screenshots_enabled: true  # Capture screenshots on failure for debugging
  screenshot_retention_days: 7  # Auto-delete old screenshots
  exponential_backoff:
    base_delay: 0.5  # Initial retry delay (seconds)
    max_delay: 5.0  # Maximum retry delay (seconds)
    jitter_ratio: 0.2  # Randomness factor (±20%)
  discovery:
    max_pages: 5  # Browse pages to scrape per run
    min_runtime: 70  # Feature films only (70+ minutes)
    categories: ["drama", "documentary", "comedy", "thriller"]  # Categories to scrape

# YouTube Paid Content scraper (Playwright): For discovering indie films on YouTube
# Targets YouTube Movies category and indie film searches for rent/purchase/free films
youtube_scraper:
  enabled: true
  headless: true
  rate_limit: 2.0
  timeout: 15
  max_retries: 3
  cache_ttl_days: 30
  screenshots_enabled: true
  screenshot_retention_days: 7
  exponential_backoff:
    base_delay: 0.5
    max_delay: 5.0
    jitter_ratio: 0.2
  discovery:
    max_pages: 5
    min_runtime: 70
    search_queries: ["indie film", "independent film", "feature film", "documentary film"]
    include_free: true  # Include free filmmaker releases

# Letterboxd Video Store scraper (Playwright): For discovering exclusive rental films
# Scrapes Letterboxd's curated Video Store sections for films not widely available elsewhere
# Rent links point directly to Letterboxd Video Store
letterboxd_scraper:
  enabled: true
  headless: true
  rate_limit: 2.0
  timeout: 15
  max_retries: 3
  cache_ttl_days: 7  # Shorter TTL - video store inventory changes frequently
  screenshots_enabled: true
  screenshot_retention_days: 7
  exponential_backoff:
    base_delay: 0.5
    max_delay: 5.0
    jitter_ratio: 0.2
  discovery:
    sections: ["unreleased-gems", "lost-and-found", "new-releases"]
    min_runtime: 60  # Feature films

validation:
  recent_days: 7  # Strict recent movie validation window (days) - per PROJECT_CHARTER.md
  min_recall: 0.75  # Minimum intake recall - how well intake finds recent premieres from TMDB (75%)
  min_precision: 0.70  # Minimum intake precision - how well intake filters recent premieres (70%)
  min_provider_coverage_count: 10  # Minimum number of movies with non-search watch links per week
  approval_ttl_hours: 6  # Approval freshness grace window (6 hours default)
  fail_on_no_recent: false  # When true, fail validation if no recent movies found. When false (default), warn and continue.

orchestrator:
  discovery_retries: 2  # Additional retry attempts for provider-availability discovery (total attempts = 1 + retries)
  discovery_retry_delays: [30, 45]  # Retry delays for provider-availability discovery in seconds (exponential backoff)
  skip_approval: true  # Default to bypass approval gate during development (NRW_SKIP_APPROVAL override)
  health:
    min_polled: 1000  # Threshold for logging (report-only, no enforcement)


# Affiliate Program Configuration
# Sign up for affiliate programs to earn commissions on movie rentals/purchases
# NOTE: Most affiliate programs require an existing website before approval
affiliate:
  enabled: true  # Affiliate tagging is active

  # Amazon Associates - https://affiliate-program.amazon.com/
  # Commission: 5% on digital video, 24-hour cookie (earns on ANY purchase within 24h)
  amazon:
    enabled: true  # Amazon affiliate tagging enabled
    tag: "nrw04-20"  # Your Amazon Associates tag
    # Get your tag from: https://affiliate-program.amazon.com/home/account/tag/manage

  # Apple Performance Partners - https://performance-partners.apple.com/
  # Commission: 7% on movies/TV, 30-day cookie, $100 min payout
  # Application requirements: Website/app with relevant content, approved by Apple
  apple:
    enabled: false  # Enable after getting your affiliate token
    token: "REPLACE_WITH_YOUR_APPLE_TOKEN"  # e.g., "1000lxyz"
    # Get your token from: https://performance-partners.apple.com/resources/documentation/affiliate-token-guide

  # Future platforms can be added here as needed
  # vudu:
  #   enabled: false
  #   affiliate_id: ""


# Trailer Hosting (Backblaze B2)
# Self-hosted trailer MP4s for in-app playback — avoids YouTube dependency
# Apps check trailer_hosted first, fall back to YouTube trailer URL
# Credentials: B2_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME in .env
# Note: toggling enabled to false stops NEW hosting but existing trailer_hosted URLs in data.json remain valid
trailer_hosting:
  enabled: true                      # Master toggle for trailer hosting pipeline
  bucket_url: "https://f004.backblazeb2.com/file/NRW-TRAILERS"  # Public URL base (change when CloudFlare is set up)
  max_hosted: 200                    # Rotation cap — delete oldest trailers when over this count
  clean_local_after_upload: true     # Auto-delete local MP4 after confirmed B2 upload
  pipeline_integration: true         # Auto-host trailers for new movies during daily enrichment