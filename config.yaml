# NRW Configuration
#
# Launch: Use `./launch_all.sh` to start both admin panel (5556) and site (3000)
# No authentication required for local development
#
# Scraper Configuration Notes:
# - All scrapers use centralized defaults from constants.py (SCRAPER_DEFAULTS)
# - Per-scraper configs below override the centralized defaults
# - Centralized defaults: timeout=15s, rate_limit=2.0s, max_retries=3,
#   exponential_backoff={base_delay=0.5s, max_delay=5.0s, jitter_ratio=0.2},
#   cache_ttl_days=30, screenshots_enabled=true, screenshot_retention_days=7

# Ports for local development (configurable via environment variables)
ports:
  admin_port: 5556  # Admin panel port (ADMIN_PORT env var)
  site_port: 3000   # Public site port (SITE_PORT env var)
  site_fallback: 3001  # Fallback if site_port is busy

# Unified launcher configuration (launch_all.sh)
launcher:
  admin_port: 5556  # Default admin port for launcher
  site_port: 3000   # Default site port for launcher

workflow:
  daily_check_time: "02:00"  # 2 AM PST
  weekly_bootstrap_day: "sunday"
  
display:
  days_back: 90  # Show movies from last N days
  min_movies: 20  # Minimum movies to display
  max_movies: 100  # Maximum movies to display

tracking:
  bootstrap_days: 7  # Look back N days for new releases
  check_interval_hours: 24  # How often to check
  poll_all_tracking: true  # Poll all tracking movies (production requirement)
  archive_available_on_detect: false  # Archive available movies to separate file (experimental)
  compaction_batch_size: 50  # Maximum entries to move per compaction run
  compaction_recent_days: null  # Only compact entries from last N days (null = no age limit)
  excluded_services: ['fuboTV', 'Philo']  # Services to exclude from watch provider results

# Backup retention policy for quarantined corrupt files and atomic write backups
# Prevents unbounded disk growth from .corrupted-* and .backup-* files in backups/ directory
backups:
  retention_days: 30  # Delete backup files older than N days (30 days default for production)
  cleanup_check_interval_hours: 1  # Minimum time between cleanup checks (rate limiting)
  enabled: true  # Enable automatic cleanup of old backup files
  include_backup_files: false  # Enable cleanup of .backup-*.json files from atomic writes (default: false)

# Structured telemetry and metrics across Storage, Validation, Enrichment services
# Emits events with fields: service, action, file, item_id, result, duration_ms, error
# Maintains counters: quarantined_files, validated_items, enriched_items, retry_count
telemetry:
  enabled: true  # Enable structured telemetry logging
  console: false  # Log telemetry events to console (set false to reduce noise)
  file: true  # Write telemetry to JSONL file
  file_path: 'metrics/telemetry.jsonl'  # Path to telemetry log file (JSONL format)
  metrics_dir: 'metrics'  # Directory for metrics and summary files
  # Counters tracked:
  # - quarantined_files: Files moved to backups/ due to corruption
  # - validated_items: Items passing schema validation
  # - enriched_items: Movies successfully enriched with watch links
  # - cache_hits: Cache hits across all services
  # - api_calls: External API calls (TMDB, etc)
  # - retry_count: Total retry attempts across services

# INTAKE configuration (legacy key name "discovery" preserved for compatibility)
# Controls: generate_data.py --intake (finding NEW movie premieres from TMDB)
# NOT used by: generate_data.py --discover (provider-availability checks)
# For provider-availability settings, see: orchestrator.health section below
intake:
  days_back: 7  # Intake window for finding new premieres from TMDB (controls how far back intake looks)
  max_pages: 20  # Intake page limit - maximum TMDB pages to process during intake phase
  # CI optimizations - reduce load for automated runs
  ci_days_back: 7  # Reduced intake window for CI (set via CI_DISCOVERY_DAYS env var)
  ci_max_pages: 10  # Reduced intake page limit for CI (set via CI_DISCOVERY_PAGES env var)
  enable_pass_a: true  # Enable Pass A: Direct-to-digital releases (release_date + type=4)
  enable_pass_b: true  # Enable Pass B: Theatrical releases (primary_release_date)

api:
  # API keys: Environment variables take precedence, these are fallbacks for local development
  tmdb_api_key: "99b122ce7fa3e9065d7b7dc6e660772d"  # TMDB API key for movie data
  omdb_api_key: "539723d9"  # OMDB API key for additional movie data
  tmdb_rate_limit: 0.1  # Seconds between API calls
  max_retries: 3
  max_pages_bootstrap: 49  # Maximum pages to fetch for bootstrap operation

# Streaming scraper (Playwright): For Netflix/Disney+/HBO Max/Hulu - DISABLED due to authentication barriers
# Uses playwright for stealth browsing but blocked by login requirements
streaming_scraper:
  enabled: true  # Enabled as fallback when TMDB API has no links
  headless: true  # Run browser in headless mode (required for CI)
  rate_limit: 2.0  # Minimum seconds between scrapes
  timeout: 10  # Page load timeout in seconds
  max_retries: 3  # Increased from 1 for exponential backoff
  cache_ttl_days: 30  # Cache expiration (days)
  screenshots_enabled: true  # Capture screenshots on failure
  screenshot_retention_days: 7  # Auto-delete old screenshots
  exponential_backoff:
    base_delay: 0.5  # Initial retry delay (seconds)
    max_delay: 5.0  # Maximum retry delay (seconds)
    jitter_ratio: 0.2  # Randomness factor (±20%)

# VOD scraper (Playwright): For Amazon/Apple TV - ENABLED as TMDB fallback
# Uses Playwright for Amazon/Apple TV since they don't require authentication
# Only runs when TMDB API has no direct links, focuses on recent releases
vod_scraper:
  enabled: true  # Enable Playwright-based Amazon/Apple TV scraper as TMDB fallback
  headless: true  # Run browser in headless mode for production
  rate_limit: 2.0  # Seconds between scrapes to avoid rate limiting
  timeout: 10  # Page load timeout in seconds
  max_retries: 2  # Retry attempts on failure
  platforms:
    amazon: true  # Enable Amazon Prime Video scraping
    apple_tv: true  # Enable Apple TV scraping
  maintenance:
    last_selector_update: "2025-10-25"  # Track when selectors were last verified
    expected_update_frequency: "quarterly"  # How often selectors typically need updates
    # Migrated from Selenium to Playwright on 2025-10-25 for improved reliability and performance
    # Expected performance improvement: 30-40% faster (6-8s vs 10s per search)
    # Implementation: streaming_platform_scraper.py (Playwright-based, shares patterns with agent_link_scraper.py)

rt_scraper:
  enabled: true  # Enable/disable RT scraping
  headless: true  # Run browser in headless mode
  rate_limit: 2.0  # Minimum seconds between scrapes
  timeout: 15  # Page load timeout in seconds (increased for CI environment)
  max_retries: 3  # Number of retries on failure (increased for CI reliability)
  cache_ttl_days: 90  # RT links are stable, longer TTL than agent scraper
  screenshots_enabled: true  # Capture screenshots on failure for debugging
  screenshot_retention_days: 7  # Auto-delete old screenshots
  exponential_backoff:
    base_delay: 0.5  # Initial retry delay (seconds)
    max_delay: 5.0  # Maximum retry delay (seconds)
    jitter_ratio: 0.2  # Randomness factor (±20%)

validation:
  recent_days: 7  # Strict recent movie validation window (days) - per PROJECT_CHARTER.md
  min_recall: 0.75  # Minimum intake recall - how well intake finds recent premieres from TMDB (75%)
  min_precision: 0.70  # Minimum intake precision - how well intake filters recent premieres (70%)
  min_provider_coverage_count: 10  # Minimum number of movies with non-search watch links per week
  approval_ttl_hours: 6  # Approval freshness grace window (6 hours default)
  fail_on_no_recent: false  # When true, fail validation if no recent movies found. When false (default), warn and continue.

orchestrator:
  discovery_retries: 2  # Additional retry attempts for provider-availability discovery (total attempts = 1 + retries)
  discovery_retry_delays: [30, 45]  # Retry delays for provider-availability discovery in seconds (exponential backoff)
  skip_approval: true  # Default to bypass approval gate during development (NRW_SKIP_APPROVAL override)
  health:
    min_polled: 1000  # Threshold for logging (report-only, no enforcement)


# Affiliate Program Configuration
# Sign up for affiliate programs to earn commissions on movie rentals/purchases
# NOTE: Most affiliate programs require an existing website before approval
# Set enabled=false for now, enable after getting approved and adding your IDs
affiliate:
  enabled: false  # Set to true after signing up for affiliate programs

  # Amazon Associates - https://affiliate-program.amazon.com/
  # Commission: 5% on digital video, 24-hour cookie (earns on ANY purchase within 24h)
  # Application requirements: Active website with content, 10+ posts/pages, regular traffic
  amazon:
    enabled: false  # Enable after getting your affiliate tag
    tag: "REPLACE_WITH_YOUR_AMAZON_TAG"  # e.g., "yoursite-20"
    # Get your tag from: https://affiliate-program.amazon.com/home/account/tag/manage

  # Apple Performance Partners - https://performance-partners.apple.com/
  # Commission: 7% on movies/TV, 30-day cookie, $100 min payout
  # Application requirements: Website/app with relevant content, approved by Apple
  apple:
    enabled: false  # Enable after getting your affiliate token
    token: "REPLACE_WITH_YOUR_APPLE_TOKEN"  # e.g., "1000lxyz"
    # Get your token from: https://performance-partners.apple.com/resources/documentation/affiliate-token-guide

  # Future platforms can be added here as needed
  # vudu:
  #   enabled: false
  #   affiliate_id: ""