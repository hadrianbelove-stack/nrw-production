<!-- Section Header Component
     Table-based section divider with centered text for email compatibility.
     Use this component to separate major sections (Essay, Featured, The Rest, Movie Bank).

     Usage:
     {% with section_title="Featured Films", section_subtitle="This week's standout releases" %}
     {% include 'newsletter/components/section_header.html' %}
     {% endwith %}
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #16213e; border-top: 3px solid #00d4aa;">
    <tr>
        <td style="padding: 20px;" align="center">
            <h2 class="section-title" style="margin: 0 0 5px 0; color: #00d4aa; font-size: 24px; font-weight: bold; text-align: center; font-family: Arial, Helvetica, sans-serif;">
                {{ section_title | default('Section Title') }}
            </h2>
            {% if section_subtitle %}
            <p style="margin: 0; color: #999999; font-size: 14px; text-align: center; font-family: Arial, Helvetica, sans-serif;">
                {{ section_subtitle }}
            </p>
            {% endif %}
        </td>
    </tr>
</table>
