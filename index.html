<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New Release Wall</title>
    <link rel="stylesheet" href="assets/styles.css?v=18">
</head>
<body>
    <header>
        <h1>THE NEW RELEASE WALL</h1>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="featured">Featured</button>
            <button class="filter-btn" data-filter="foreign">Foreign</button>
            <button class="filter-btn" data-filter="series">Limited Series</button>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
                <button id="search-clear" class="search-clear" aria-label="Clear search">&times;</button>
            </div>
        </div>
    </header>
    <main id="wall"></main>
    <div id="load-more-container"></div>
    <script src="assets/app.js?v=19"></script>
</body>
</html>
