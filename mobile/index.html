<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>NRW - New Release Wall</title>
    <meta name="description" content="What came out, every day.">
    <!-- Link preview (Open Graph + Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The New Release Wall">
    <meta property="og:title" content="The New Release Wall">
    <meta property="og:description" content="What came out, every day.">
    <meta property="og:url" content="https://hadrianbelove-stack.github.io/nrw-production/">
    <meta property="og:image" content="https://hadrianbelove-stack.github.io/nrw-production/assets/share-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The New Release Wall">
    <meta name="twitter:description" content="What came out, every day.">
    <meta name="twitter:image" content="https://hadrianbelove-stack.github.io/nrw-production/assets/share-card.png">
    <link rel="stylesheet" href="mobile.css?v=97">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="../favicon.png">
</head>
<body>
    <!-- Persistent header -->
    <header class="site-header" id="site-header">
        <div class="header-title-row">
            <h1>THE&nbsp;NEW RELEASE&nbsp;WALL</h1>
        </div>
        <p class="site-slogan">What came out, every day.</p>
        <div class="header-controls">
            <div class="toggle-row">
                <div class="slop-toggle-wrap" id="slop-free-toggle" data-state="all">
                    <div class="slop-track">
                        <div class="slop-thumb"></div>
                    </div>
                    <span class="slop-label" id="slop-state-label">SLOP FILTER</span>
                </div>
                <div class="filter-pill-divider"></div>
                <div class="slop-toggle-wrap" id="highlights-toggle">
                    <div class="slop-track">
                        <div class="slop-thumb"></div>
                    </div>
                    <span class="slop-label">SELECTS</span>
                </div>
                <div class="filter-pill-divider"></div>
                <div class="slop-toggle-wrap" id="fest-toggle">
                    <div class="slop-track">
                        <div class="slop-thumb"></div>
                    </div>
                    <span class="slop-label">FESTS</span>
                </div>
                <div class="filter-pill-divider"></div>
                <div class="slop-toggle-wrap" id="preorder-toggle">
                    <div class="slop-track">
                        <div class="slop-thumb"></div>
                    </div>
                    <span class="slop-label">PRE-ORDER</span>
                </div>
            </div>
            <div class="filter-row" id="filters">
                <button class="genre-control" id="genre-control" type="button"><span class="genre-text">GENRE</span><span class="caret">▼</span></button>
                <div class="search-container">
                    <svg class="search-mag" aria-hidden="true" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8"/><line x1="12.8" y1="12.8" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
                    <button id="search-clear" class="search-clear" aria-label="Clear">&times;</button>
                </div>
                <div class="view-dots" id="view-dots">
                    <button class="view-dot active" data-view="0"></button>
                    <button class="view-dot" data-view="1"></button>
                    <button class="view-dot" data-view="2"></button>
                </div>
            </div>
        </div>
    </header>

    <!-- GENRE bottom sheet -->
    <div class="genre-backdrop" id="genre-backdrop">
        <div class="genre-sheet" id="genre-sheet">
            <div class="genre-sheet-handle"></div>
            <div class="genre-sheet-head"><span>Filter by genre</span><button class="genre-sheet-clear" id="genre-sheet-clear" type="button">Clear</button></div>
            <div class="genre-sheet-chips">
                <button class="filter-pill" data-filter="indie">Indie</button>
                <button class="filter-pill" data-filter="horror">Horror</button>
                <button class="filter-pill" data-filter="action">Action</button>
                <button class="filter-pill" data-filter="comedy">Comedy</button>
                <button class="filter-pill" data-filter="family">Family</button>
                <button class="filter-pill" data-filter="foreign">Foreign</button>
                <button class="filter-pill" data-filter="documentary">Docs</button>
                <button class="filter-pill" data-filter="restorations">Reissues</button>
            </div>
            <button class="genre-sheet-done" id="genre-sheet-done" type="button">Done</button>
        </div>
    </div>

    <!-- Filter description (shown when a single filter is active) -->
    <div id="filter-desc" class="filter-desc"></div>

    <!-- View 1: Grid -->
    <div id="grid-view" class="view-container">
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading movies...</p>
        </div>
    </div>

    <!-- View 2: Poster close-up -->
    <div id="poster-view" class="view-container hidden">
        <div class="poster-full" id="poster-full">
            <img id="poster-img" src="" alt="">
            <div class="poster-counter" id="poster-counter"></div>
            <div class="poster-scores" id="poster-scores"></div>
            <button class="poster-share" aria-label="Share this movie" onclick="NRWMobile.shareCurrent()">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>
        </div>
        <div id="poster-meta" class="poster-meta"></div>
    </div>

    <!-- View 3: Bottom sheet -->
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-handle"><div class="sheet-handle-bar"></div></div>
        <div class="sheet-content" id="sheet-content"></div>
        <div class="sheet-scroll-fade" id="sheet-scroll-fade"></div>
        <div class="sheet-more-pill" id="sheet-more-pill">MORE ⌄</div>
        <div class="sheet-btnbar" id="sheet-btnbar"></div>
    </div>

    <!-- Nav chevrons (poster view) -->
    <div class="chevron chevron-left" id="chevron-left">&#8249;</div>
    <div class="chevron chevron-right" id="chevron-right">&#8250;</div>

    <script src="../assets/shared-config.js?v=4"></script>
    <script src="mobile.js?v=101"></script>
</body>
</html>
