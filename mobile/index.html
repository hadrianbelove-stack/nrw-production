<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>NRW - New Release Wall</title>
    <link rel="stylesheet" href="mobile.css?v=49">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="../favicon.png">
</head>
<body>
    <header class="nrw-header">
        <h1 class="nrw-title">THE NEW RELEASE WALL</h1>
        <div class="filter-row" id="filters">
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="big-time">Big Time</button>
            <button class="filter-pill" data-filter="indie">Indie</button>
            <button class="filter-pill" data-filter="staff-picks">Staff Picks</button>
            <button class="filter-pill" data-filter="foreign">Foreign</button>
            <button class="filter-pill" data-filter="series">Limited Series</button>
            <button class="filter-pill" data-filter="restorations">Restorations</button>
            <button class="filter-pill" data-filter="documentary">Documentary</button>
            <button class="filter-pill" data-filter="virtual-screenings">Virtual Screenings</button>
        </div>
    </header>

    <main id="movie-feed">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading movies...</p>
        </div>
    </main>

    <div id="load-trigger"></div>

    <script src="mobile.js?v=49"></script>
</body>
</html>
