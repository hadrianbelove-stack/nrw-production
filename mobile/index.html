<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>NRW - New Release Wall</title>
    <link rel="stylesheet" href="mobile.css?v=65">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="../favicon.png">
</head>
<body>
    <!-- Persistent header -->
    <header class="site-header" id="site-header">
        <div class="header-title-row">
            <h1>THE NEW RELEASE WALL</h1>
        </div>
        <div class="header-controls">
            <div class="filter-row" id="filters">
                <button class="filter-pill" data-filter="staff-picks">NRW Picks</button>
                <button class="filter-pill" data-filter="studio">Studio</button>
                <button class="filter-pill" data-filter="indie">Indie</button>
                <button class="filter-pill" data-filter="exploitation">Exploitation</button>
                <button class="filter-pill" data-filter="foreign">Foreign</button>
                <button class="filter-pill" data-filter="documentary">Docs</button>
                <button class="filter-pill" data-filter="series">Miniseries</button>
                <button class="filter-pill" data-filter="restorations">Reissues</button>
                <button class="filter-pill" data-filter="virtual-screenings">V. Screenings</button>
                <button class="filter-pill" data-filter="pre-orders">Pre-Orders</button>
                <div class="filter-row-spacer"></div>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
                    <button id="search-clear" class="search-clear" aria-label="Clear">&times;</button>
                </div>
                <div class="view-dots" id="view-dots">
                    <button class="view-dot active" data-view="0"></button>
                    <button class="view-dot" data-view="1"></button>
                    <button class="view-dot" data-view="2"></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Filter description (shown when a single filter is active) -->
    <div id="filter-desc" class="filter-desc"></div>

    <!-- View 1: Grid -->
    <div id="grid-view" class="view-container">
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading movies...</p>
        </div>
    </div>

    <!-- View 2: Poster close-up -->
    <div id="poster-view" class="view-container hidden">
        <div class="poster-full" id="poster-full">
            <img id="poster-img" src="" alt="">
            <div class="poster-counter" id="poster-counter"></div>
            <div class="poster-scores" id="poster-scores"></div>
        </div>
    </div>

    <!-- View 3: Bottom sheet -->
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-handle"><div class="sheet-handle-bar"></div></div>
        <div class="sheet-content" id="sheet-content"></div>
    </div>

    <!-- Nav chevrons (poster view) -->
    <div class="chevron chevron-left" id="chevron-left">&#8249;</div>
    <div class="chevron chevron-right" id="chevron-right">&#8250;</div>

    <script src="../assets/shared-config.js?v=2"></script>
    <script src="mobile.js?v=65"></script>
</body>
</html>
