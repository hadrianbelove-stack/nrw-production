<!DOCTYPE html>
<html>
<head>
    <title>Debug NRW</title>
</head>
<body>
    <h1>NRW Debug</h1>
    <div id="debug-output"></div>

    <script>
    async function debugLoad() {
        const output = document.getElementById('debug-output');

        try {
            console.log('Starting debug...');
            output.innerHTML += '<p>Starting debug...</p>';

            const response = await fetch('data.json');
            console.log('Fetch response:', response.status);
            output.innerHTML += `<p>Fetch response: ${response.status}</p>`;

            const data = await response.json();
            console.log('Data loaded:', data.count, 'movies');
            output.innerHTML += `<p>Data loaded: ${data.count} movies</p>`;

            const today = new Date();
            console.log('Today:', today);
            output.innerHTML += `<p>Today: ${today}</p>`;

            const filtered = data.movies.filter(m => {
                if (!m.digital_date) return false;
                const movieDate = new Date(m.digital_date);
                return movieDate <= today;
            });

            console.log('Filtered movies:', filtered.length);
            output.innerHTML += `<p>Filtered movies: ${filtered.length}</p>`;

            output.innerHTML += '<p><strong>Success!</strong> All filtering logic works.</p>';

        } catch (err) {
            console.error('Debug failed:', err);
            output.innerHTML += `<p style="color: red;">Error: ${err.message}</p>`;
        }
    }

    debugLoad();
    </script>
</body>
</html>
