<!DOCTYPE html>
<html>
<head>
    <title>Test Load</title>
</head>
<body>
    <h1>Movie Count Test</h1>
    <div id="result">Loading...</div>

    <script>
    fetch('data.json')
        .then(r => r.json())
        .then(data => {
            const today = new Date();
            const validMovies = data.movies.filter(m => {
                return m.digital_date && new Date(m.digital_date) <= today;
            });

            document.getElementById('result').innerHTML = `
                <p>Total movies in data.json: ${data.count}</p>
                <p>Movies with digital_date: ${data.movies.filter(m => m.digital_date).length}</p>
                <p>Movies valid for today: ${validMovies.length}</p>
                <p>First few titles:</p>
                <ul>
                    ${validMovies.slice(0, 5).map(m => `<li>${m.title} (${m.digital_date})</li>`).join('')}
                </ul>
            `;
        })
        .catch(err => {
            document.getElementById('result').innerHTML = `Error: ${err.message}`;
        });
    </script>
</body>
</html>
